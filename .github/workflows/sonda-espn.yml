name: Sonda ESPN (temporanea)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir s && cd s
          curl -sS "https://site.api.espn.com/apis/site/v2/sports/football/college-football/summary?event=401752870" -o cfb_summary.json
          curl -sS "https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?dates=2026&seasontype=2&week=12&groups=80&limit=5" -o cfb_sb.json
          ls -la
          git init -q && git checkout -q -b sonda && git add . && git -c user.name=sonda -c user.email=s@s commit -qm sonda
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sonda
