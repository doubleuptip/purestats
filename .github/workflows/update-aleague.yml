name: Aggiorna archivio A-League

on:
  schedule:
    # Una sola esecuzione settimanale: Ultimate A-League chiede di non
    # abusare dell'API e di conservare i dati anziché riscaricarli.
    - cron: '0 22 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_aleague.py'
      - '.github/workflows/update-aleague.yml'

permissions:
  contents: write

concurrency:
  group: archivio-aleague
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Scarica i dati arbitrali
        env:
          UAL_API_ID: ${{ secrets.UAL_API_ID }}
          UAL_API_SECRET: ${{ secrets.UAL_API_SECRET }}
          STAGIONE_ALEAGUE: ${{ vars.STAGIONE_ALEAGUE }}
        run: python scripts/fetch_aleague.py

      - name: Committa le modifiche
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          FILE="data/aleague_arbitri.json docs/data_aleague.json"

          git add $FILE
          if git diff --staged --quiet; then
            echo "Nessuna variazione."
            exit 0
          fi
          git commit -m "A-League aggiornata $(date -u '+%Y-%m-%d %H:%M UTC')"

          for tentativo in 1 2 3 4 5; do
            if git push; then
              echo "Pubblicato al tentativo $tentativo"
              exit 0
            fi

            echo "Repository cambiato, riapplico i file aggiornati..."
            mkdir -p /tmp/generati
            for f in $FILE; do
              mkdir -p "/tmp/generati/$(dirname "$f")"
              cp "$f" "/tmp/generati/$f"
            done

            git fetch origin main
            git reset --hard origin/main

            for f in $FILE; do cp "/tmp/generati/$f" "$f"; done

            git add $FILE
            if git diff --staged --quiet; then
              echo "I dati coincidono già con quelli pubblicati."
              exit 0
            fi
            git commit -m "A-League aggiornata $(date -u '+%Y-%m-%d %H:%M UTC')"
            sleep 5
          done

          echo "Pubblicazione non riuscita dopo 5 tentativi"
          exit 1
