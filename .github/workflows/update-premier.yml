name: Aggiorna archivio Premier League

on:
  schedule:
    - cron: '0 7 * * 1,4'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: archivio-premier
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scarica e unisci i dati
        env:
          STAGIONI: ${{ vars.STAGIONI }}
        run: python scripts/fetch_premier.py

      - name: Verifica il database
        run: python scripts/query.py

      - name: Committa le modifiche
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/premier_league.csv docs/data.json
          if git diff --staged --quiet; then
            echo "Nessuna variazione."
          else
            git commit -m "Archivio aggiornato $(date -u '+%Y-%m-%d %H:%M UTC')"
            for tentativo in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "Push rifiutato (remoto avanzato nel frattempo), tentativo $tentativo: rebase e riprovo..."
              git pull --rebase
            done
          fi
