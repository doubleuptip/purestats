name: Stemmi delle squadre

# Sigle e colori per gli stemmi PureStats (nessun logo ufficiale). Una chiamata a CollegeFootballData per giro:
# a mano e il 1 agosto rifà tutto; quando cambia lo script e ogni lunedì chiama CFBD solo se le sigle college
# non vengono ancora da lì (dopo il primo successo: zero chiamate).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/stemmi.py"]
  schedule:
    - cron: "17 6 1 8 *"     # 1 agosto: rifà tutto (--rifai)
    - cron: "41 7 * * 1"     # lunedì: riprova solo se le sigle college non vengono ancora da CFBD

permissions:
  contents: write

concurrency:
  group: stemmi
  cancel-in-progress: false

jobs:
  stemmi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sigle e colori (nflverse + CollegeFootballData, 1 chiamata)
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          if [ "${{ github.event.schedule }}" = "17 6 1 8 *" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/stemmi.py --rifai
          else
            python scripts/stemmi.py
          fi
      - name: Pubblica
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/stemmi.json
          git diff --cached --quiet && { echo "Stemmi invariati"; exit 0; }
          git commit -m "Stemmi delle squadre aggiornati"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
