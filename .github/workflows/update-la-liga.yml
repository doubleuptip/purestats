name: Aggiorna archivio LaLiga

on:
  schedule:
    - cron: '0 17 * * 4,5,1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: archivio-la-liga
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Installa pypdf
        run: pip install pypdf

      - name: Scarica dati e designazioni
        env:
          STAGIONI: ${{ vars.STAGIONI_LA_LIGA }}
          GIORNATE: ${{ vars.GIORNATE_LA_LIGA }}
        run: python scripts/fetch_la_liga.py

      - name: Committa le modifiche
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/la_liga.csv data/designaciones_la_liga.json docs/data_la_liga.json
          if git diff --staged --quiet; then
            echo "Nessuna variazione."
          else
            git commit -m "LaLiga aggiornata $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
