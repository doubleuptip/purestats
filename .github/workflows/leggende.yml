name: Leggende - record e dinastie

# Una volta a settimana (mercoledì, dopo il Monday Night e gli aggiornamenti di Wikipedia): voci Wikipedia
# (API, gratis) e statistiche nflverse per la verifica dei giocatori dal 1999. Nessuna fonte a credito.
on:
  schedule:
    - cron: '17 6 * * 3'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  leggende:
    runs-on: ubuntu-latest
    concurrency:
      group: leggende
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Costruisci le Leggende
        run: python scripts/leggende.py aggiorna
      - name: Committa
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/leggende/leggende.json
          if git diff --staged --quiet; then echo "Nessuna variazione."; exit 0; fi
          git commit -q -m "Leggende aggiornate $(date -u '+%Y-%m-%d %H:%M UTC')"
          for t in 1 2 3 4; do git push && exit 0; git pull -q --rebase origin main; done
          exit 1
