name: Aggiorna calendario

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_calendario.py'
      - '.github/workflows/update-calendario.yml'

permissions:
  contents: write

concurrency:
  group: aggiorna-calendario
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Scarica il calendario
        run: python scripts/fetch_calendario.py

      - name: Committa le modifiche
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/calendario.json
          if git diff --staged --quiet; then
            echo "Nessuna variazione."
            exit 0
          fi
          git commit -m "Calendario aggiornato $(date -u '+%Y-%m-%d %H:%M UTC')"
          for tentativo in 1 2 3 4 5; do
            if git push; then
              echo "Pubblicato al tentativo $tentativo"
              exit 0
            fi
            echo "Repository cambiato, mi riallineo e riprovo..."
            git pull --rebase origin main
            sleep 5
          done
          echo "Pubblicazione non riuscita dopo 5 tentativi"
          exit 1
