name: Aggiorna archivio NFL

on:
  schedule:
    # Ogni giorno alle 11:00 UTC (12:00 in Italia): linee del turno successivo.
    # In più, subito dopo le finestre di gioco, così una partita finita sparisce
    # dalla prossima giornata e dai duelli senza aspettare mezzogiorno
    # (orari UTC: in Italia un'ora in più, d'estate due).
    - cron: '0 11 * * *'
    - cron: '0 6 * * 5'      # venerdì mattina, dopo il giovedì sera
    - cron: '0 22 * * 0'     # domenica sera, dopo le partite del pomeriggio
    - cron: '0 6 * * 1'      # lunedì mattina, dopo la domenica sera
    - cron: '0 6 * * 2'      # martedì mattina, dopo il lunedì sera
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_nfl.py'
      - 'scripts/nfl_indici.py'
      - '.github/workflows/update-nfl.yml'
      - 'scripts/fetch_duelli.py'
      - 'scripts/reparti.py'
      - 'scripts/contesto.py'

permissions:
  contents: write

concurrency:
  group: archivio-nfl
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Scarica i dati NFL
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          # Se fallisce (fonte giù un momento, rete), riprova una volta dopo 5 minuti.
          python scripts/fetch_nfl.py || { echo "Primo tentativo fallito: riprovo tra 5 minuti"; sleep 300; python scripts/fetch_nfl.py; }

      - name: Sezione privata (prossimo turno, indici, duelli) cifrata
        # Non blocca mai l'aggiornamento pubblico: se fallisce resta la versione già pubblicata.
        continue-on-error: true
        env:
          DUELLI_PASSWORD: ${{ secrets.DUELLI_PASSWORD }}
        run: python scripts/fetch_duelli.py nfl

      - name: Committa le modifiche
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nfl.csv docs/data_nfl.json data/nfl_video.json
          [ -f docs/duelli_nfl.dat ] && git add docs/duelli_nfl.dat
          if git diff --staged --quiet; then
            echo "Nessuna variazione."
            exit 0
          fi
          git commit -m "NFL aggiornata $(date -u '+%Y-%m-%d %H:%M UTC')"
          for tentativo in 1 2 3 4 5; do
            if git push; then
              echo "Pubblicato al tentativo $tentativo"
              exit 0
            fi
            echo "Repository cambiato, mi riallineo e riprovo..."
            # su un conflitto vince il file appena rigenerato da questo giro (il più completo)
            git pull --rebase -X theirs origin main
            sleep 5
          done
          echo "Pubblicazione non riuscita dopo 5 tentativi"
          exit 1
