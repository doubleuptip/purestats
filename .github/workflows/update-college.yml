name: Aggiorna archivio College Football

on:
  schedule:
    # Domenica, martedì e giovedì alle 12:00 UTC: linee del turno successivo man mano che escono.
    # In più, subito dopo le serate di gioco: domenica mattina (sabato), mercoledì mattina
    # (MAC del martedì) e venerdì mattina (giovedì sera).
    # Dal 14/11/2026 calendario, risultati, linee e tabellini arrivano da ESPN (gratis, senza chiave).
    # CollegeFootballData (1.000 chiamate al mese, condivise con il bot) solo per SP+, al massimo una
    # volta ogni 6 giorni, e per i loghi una volta a stagione: circa 5-6 chiamate al mese.
    - cron: '0 12 * * 0,2,4'
    - cron: '0 6 * * 0,3,5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_college.py'
      - 'scripts/college_indici.py'
      - 'scripts/espn_college.py'
      - '.github/workflows/update-college.yml'
      - 'scripts/fetch_duelli.py'
      - 'scripts/reparti.py'
      - 'scripts/contesto.py'

permissions:
  contents: write

concurrency:
  group: archivio-college
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Scarica i dati College
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          STAGIONI: ${{ vars.STAGIONI_COLLEGE }}
        run: |
          # Se fallisce (fonte giù un momento, rete), riprova una volta dopo 5 minuti.
          python scripts/fetch_college.py || { echo "Primo tentativo fallito: riprovo tra 5 minuti"; sleep 300; python scripts/fetch_college.py; }

      - name: Sezione privata (prossimo turno, indici, duelli) cifrata
        # Non blocca mai l'aggiornamento pubblico: se fallisce resta la versione già pubblicata.
        continue-on-error: true
        env:
          DUELLI_PASSWORD: ${{ secrets.DUELLI_PASSWORD }}
        run: python scripts/fetch_duelli.py college

      - name: Committa le modifiche
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/college.csv docs/data_college.json data/college_squadre.json data/college_video.json
          # archivi che evitano di richiedere di nuovo ciò che non cambia (tabellini, linee chiuse, SP+)
          for f in data/college_giocatori.json data/college_linee.json data/college_sp.json; do
            [ -f "$f" ] && git add "$f"
          done
          [ -f docs/duelli_college.dat ] && git add docs/duelli_college.dat
          if git diff --staged --quiet; then
            echo "Nessuna variazione."
            exit 0
          fi
          git commit -m "College aggiornato $(date -u '+%Y-%m-%d %H:%M UTC')"
          for tentativo in 1 2 3 4 5; do
            if git push; then
              echo "Pubblicato al tentativo $tentativo"
              exit 0
            fi
            echo "Repository cambiato, mi riallineo e riprovo..."
            # su un conflitto vince il file appena rigenerato da questo giro (il più completo)
            git pull --rebase -X theirs origin main
            sleep 5
          done
          echo "Pubblicazione non riuscita dopo 5 tentativi"
          exit 1
