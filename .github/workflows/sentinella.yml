name: Sentinella fine partite

# Ogni 15 minuti nelle finestre di gioco (orari UTC; in Italia +1 d'inverno, +2 con l'ora legale):
# appena una partita NFL o College è finita e i dati sono pronti, lancia l'aggiornamento (scripts/sentinella.py).
# Controlli gratis e leggeri (ESPN + API di GitHub); i workflow NFL e College tengono i loro orari fissi come riserva.
on:
  schedule:
    # 26/11/2026 (scelta di Valerio): tutti i giorni, perché ci sono partite anche di mercoledì, nei giorni di festa
    # (Ringraziamento, Natale) e il college infrasettimanale. Minuti lontani dallo :00, l'ora in cui GitHub salta più giri.
    - cron: '7,22,37,52 16-23 * * *'  # pomeriggio e sera
    - cron: '7,22,37,52 0-7 * * *'    # notte
  workflow_dispatch:
    inputs:
      prova:
        description: 'Solo prova (legge nflverse e la coda dei workflow, non lancia niente)'
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

concurrency:
  group: sentinella
  cancel-in-progress: true

jobs:
  controlla:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (solo i dati pubblicati e lo script)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/sentinella.py
            docs/data_nfl.json
            docs/data_college.json
          sparse-checkout-cone-mode: false

      - name: Partite finite e dati pronti?
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROVA: ${{ inputs.prova }}
        run: python3 scripts/sentinella.py
