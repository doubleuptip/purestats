name: Aggiorna news

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'Modalità di aggiornamento'
        required: false
        default: 'completo'
        type: choice
        options: [completo, rapido]
  push:
    branches: [main]
    paths:
      - 'scripts/news.py'
      - 'scripts/fetch_news.py'
      - '.github/workflows/update-news.yml'

permissions:
  contents: write

concurrency:
  group: aggiorna-news
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Scarica notizie e calendario
        env:
          MODO: >-
            ${{ github.event_name == 'workflow_dispatch'
                && inputs.modo
                || (github.event.schedule == '0 18 * * *' && 'rapido' || 'completo') }}
        run: python scripts/fetch_news.py

      - name: Committa le modifiche
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/news_premier.json docs/news_serie_a.json \
                  docs/news_la_liga.json docs/news_ligue_1.json
          if git diff --staged --quiet; then
            echo "Nessuna variazione."
            exit 0
          fi
          git commit -m "News aggiornate $(date -u '+%Y-%m-%d %H:%M UTC')"
          for tentativo in 1 2 3 4 5; do
            if git push; then
              echo "Pubblicato al tentativo $tentativo"
              exit 0
            fi
            echo "Repository cambiato, mi riallineo e riprovo..."
            git pull --rebase origin main
            sleep 5
          done
          echo "Pubblicazione non riuscita dopo 5 tentativi"
          exit 1
