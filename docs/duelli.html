<body>
<div class="pagina">

<script>
/* Dati cifrati da scripts/fetch_duelli.py (un file per campionato): qui si rifanno gli stessi passaggi
   con WebCrypto. Nessun localStorage: la password resta nel gestore password del browser, se lo scegli. */
const AREE = {corse:"Corse", passaggi:"Passaggi", pressione:"Protezione QB", esplosive:"Giocate lunghe"};
const REPARTO_DIFESA = {corse:"difesa corse", passaggi:"difesa passaggi", pressione:"pressione sul QB", esplosive:"difesa giocate lunghe"};
const ORDINE_AREE = ["corse","passaggi","pressione","esplosive"];
const MAX_EVIDENZA = 5;
const DATI = {};
let CAMPIONATO = "NFL";

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const unisci = (...parti) => { const n = parti.reduce((t, p) => t + p.length, 0), o = new Uint8Array(n); let i = 0; for (const p of parti) { o.set(p, i); i += p.length; } return o; };

async function decifra(pacchetto, password){
  const sub = crypto.subtle;
  const base = await sub.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
  const chiave = new Uint8Array(await sub.deriveBits({name:"PBKDF2", hash:"SHA-256", salt:b64(pacchetto.sale), iterations:pacchetto.iterazioni}, base, 512));
  const kCif = chiave.slice(0, 32), kMac = chiave.slice(32);
  const nonce = b64(pacchetto.nonce), cifrato = b64(pacchetto.dati);
  const km = await sub.importKey("raw", kMac, {name:"HMAC", hash:"SHA-256"}, false, ["verify"]);
  if (!await sub.verify("HMAC", km, b64(pacchetto.mac), unisci(nonce, cifrato))) throw new Error("password");
  const blocchi = Math.ceil(cifrato.length / 32), richieste = [];
  for (let i = 0; i < blocchi; i++) {
    const c = new Uint8Array([i >>> 24 & 255, i >>> 16 & 255, i >>> 8 & 255, i & 255]);
    richieste.push(sub.digest("SHA-256", unisci(kCif, nonce, c)));
  }
  const flusso = unisci(...(await Promise.all(richieste)).map(x => new Uint8Array(x)));
  return JSON.parse(new TextDecoder().decode(cifrato.map((b, i) => b ^ flusso[i])));
}

/* Collegamento privato dalla pagina principale (17/11/2026): duelli.html#NFL&k=<password> apre senza scrivere
   la password; la chiave sparisce subito dalla barra degli indirizzi e resta solo in memoria. */
let CHIAVE_LINK = null;
(function(){
  const m = location.hash.match(/&k=(.+)$/);
  if (!m) return;
  try { CHIAVE_LINK = decodeURIComponent(m[1]); } catch (e) { CHIAVE_LINK = m[1]; }
  history.replaceState(null, "", location.pathname + location.search + location.hash.replace(/&k=.+$/, ""));
})();

async function scarica(lega, pw){
  const r = await fetch(`duelli_${lega}.dat?` + Date.now(), {cache:"no-store"});
  if (r.status === 404) return null;            // campionato non ancora calcolato
  if (!r.ok) throw new Error("file");
  return decifra(await r.json(), pw);
}

document.getElementById("accesso").addEventListener("submit", async ev => {
  ev.preventDefault();
  const err = document.getElementById("errore"), pw = document.getElementById("password").value;
  if (!pw) { err.textContent = "Scrivi la password."; return; }
  err.textContent = "Apro i dati…";
  try {
    if (!window.crypto || !crypto.subtle) throw new Error("browser");
    const [nfl, college] = await Promise.all([scarica("nfl", pw), scarica("college", pw)]);
    if (!nfl && !college) throw new Error("file");
    if (nfl) DATI.NFL = nfl;
    if (college) DATI.College = college;
  } catch (e) {
    err.textContent = e.message === "password" ? "Password sbagliata." :
      e.message === "browser" ? "Questo browser non supporta la decifratura: apri la pagina in https." :

    return;
  }
  // Chrome e Android: proposta esplicita di salvare la password (gli altri browser lo fanno dal modulo)
  if (!CHIAVE_LINK) try { if (window.PasswordCredential) await navigator.credentials.store(new PasswordCredential({id:"purestats", password:pw, name:"PureStats Matchup"})); } catch (e) {}
  // il logo riporta alla pagina principale già sbloccata (calcio e Matchup visibili)
  const marchio = document.querySelector(".marchio");
  if (marchio) marchio.href = "./#k=" + encodeURIComponent(pw);

/* ---------- utilità ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = (v, d = 0) => v === null || v === undefined ? "—" : Number(v).toLocaleString("it-IT", {minimumFractionDigits:d, maximumFractionDigits:d});
const segno = (v, d) => v === null || v === undefined ? "—" : (v > 0 ? "+" : v < 0 ? "−" : "") + num(Math.abs(v), d);
const scuro = () => matchMedia("(prefers-color-scheme: dark)").matches;
const valido = h => /^#[0-9a-f]{6}$/i.test(h || "");
const fondo = hex => valido(hex) ? hex : "#555555";
function coloreTesto(hex){
  if (!valido(hex)) return "var(--fb-text)";
  if (!scuro()) return hex;
  const n = [1,3,5].map(i => parseInt(hex.substr(i, 2), 16));
  return "rgb(" + n.map(v => Math.round(v + (255 - v) * .55)).join(",") + ")";
}
/* fondo del lato che vince il duello: colore della squadra, appena schiarito in modalità scura */
function fondoVince(hex){
  if (!valido(hex)) return "var(--att)";
  if (!scuro()) return hex;
  const n = [1,3,5].map(i => parseInt(hex.substr(i, 2), 16));
  return "rgb(" + n.map(v => Math.round(v + (255 - v) * .18)).join(",") + ")";
}
function squadra(g, sigla){
  const casa = sigla === g.casa;
  return {sigla, nome: casa ? g.nomeCasa : g.nomeOspite, logo: casa ? g.logoCasa : g.logoOspite, colore: casa ? g.coloreCasa : g.coloreOspite};
}
function stemma(t, taglia){
  const cl = taglia ? " " + taglia : "";
  const cerchio = `<span class="bd${cl}" style="background:${fondo(t.colore)}" aria-hidden="true">${esc(String(t.sigla).slice(0, 4).toUpperCase())}</span>`;
  if (/^https:\/\//.test(t.logo || "")) return `<img class="lg${cl}" src="${esc(t.logo)}" alt="${esc(t.nome)}" loading="lazy" data-ripiego="${esc(cerchio)}" onerror="ripiego(this)">`;
  return cerchio;
}
/* Logo non raggiungibile: al suo posto il cerchio con colore e sigla, come in index.html */
function ripiego(img){ img.insertAdjacentHTML("afterend", img.dataset.ripiego); img.remove(); }
const classeRank = (r, n) => r <= Math.round(n * 10 / 32) ? "buono" : r >= n - Math.round(n * 11 / 32) + 1 ? "scarso" : "";
const freccia = f => f === "in forma" ? '<span class="su">▲</span>' : f === "in calo" ? '<span class="giu">▼</span>' : "";

/* Le partite già cominciate spariscono subito, senza aspettare il prossimo aggiornamento dei dati.
   Data e ora sono italiane; senza ora la partita resta visibile fino alla fine del suo giorno. */
function iniziata(g){
  if (!g.data) return false;
  const ora = new Intl.DateTimeFormat("sv-SE", {timeZone:"Europe/Rome", year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", hour12:false}).format(new Date()).replace(" ", "T");
  return g.ora ? `${g.data}T${g.ora}` <= ora : g.data < ora.slice(0, 10);
}
function quando(g){
  if (!g.data) return "";
  const d = new Date(g.data + "T12:00:00");
  return d.toLocaleDateString("it-IT", {weekday:"short", day:"2-digit", month:"2-digit"}) + (g.ora ? " " + g.ora : "");
}

/* ---------- vantaggio in evidenza: due lati e un VS; il lato avvantaggiato prende il colore della sua squadra.
   Il vantaggio viene sempre dalla difesa che si trova davanti (la parte verificata sullo storico). ---------- */
const segnoNum = (v, d = 1) => (v > 0 ? "+" : v < 0 ? "−" : "") + num(Math.abs(v), d);
function duelloEvidenza(g, T, s){
  let sx, dx, cosa, testo;
  if (s.tipo === "giocatore") {
    const att = T[s.squadra], dif = T[s.difesa];
    cosa = `${esc(s.ruolo)} · ${esc(s.misura || "")}`;
    sx = {t: att, num: `${num(s.previsione)} yd`, chi: esc(s.nome), val: `previste · media ${num(s.media)}`};
    dx = {t: dif, num: `${s.rangoDifesa}ª`, chi: esc(dif.nome), val: `${REPARTO_DIFESA[s.areaDifesa] || "difesa"} su ${s.n}`};
    const pct = s.pct ? ` · storico: ${s.pct}% delle volte ${s.verso === "attacco" ? "sopra" : "sotto"} la sua media` : "";
    testo = s.verso === "attacco"
      ? `Vantaggio attacco · ${segnoNum(s.effetto)} yard per la difesa tra le peggiori${pct}`
      : `Vantaggio difesa · ${segnoNum(s.effetto)} yard per la difesa tra le migliori${pct}`;
  } else {
    const att = T[s.att], dif = T[s.dif];
    cosa = AREE[s.area];
    sx = {t: att, num: `${s.ra}°`, chi: esc(att.nome), val: "attacco"};
    dx = {t: dif, num: `${s.rd}ª`, chi: esc(dif.nome), val: `difesa su ${s.n}`};
    testo = s.verso === "attacco" ? `Vantaggio attacco ${esc(att.nome)} · difesa tra le peggiori` : `Vantaggio difesa ${esc(dif.nome)} · tra le migliori`;
  }
  const vinceSx = s.verso === "attacco";
  const lato = (x, destra, v) => `<div class="lato${destra ? " d" : ""}${v ? " vince" : ""}" style="${v ? `background:${fondoVince(x.t.colore)}` : ""}">
      ${destra ? "" : `<span class="tondo">${stemma(x.t, "m")}</span>`}<div style="min-width:0"><div class="num">${x.num}</div><div class="chi">${x.chi}</div><div class="val">${x.val}</div></div>${destra ? `<span class="tondo">${stemma(x.t, "m")}</span>` : ""}</div>`;
  return `<div class="duello${s.tipo === "giocatore" ? " gioc" : ""}"><div class="cosa">${cosa}</div><div class="lati">${lato(sx, false, vinceSx)}<div class="vs">VS</div>${lato(dx, true, !vinceSx)}</div><div class="esito ${s.verso}">${testo}</div></div>`;
}

/* margine e totale attesi per effetto delle due difese, in punti tarati sullo storico */
/* ---------- contesto: giudizio in tendina, assenze, meteo, forza delle squadre ---------- */
function sommario(g, T){
  const P = g.partita || {}, pezzi = [];
  if (P.attesoCasa != null) pezzi.push(`${esc(T[g.ospite].nome)} ${Math.round(P.attesoOspite)} – ${Math.round(P.attesoCasa)} ${esc(T[g.casa].nome)}`);
  for (const [sq, a] of [[g.ospite, g.assenzeOspite], [g.casa, g.assenzeCasa]])
    if (a && ((a.rango && a.rango <= 15) || (a.impatto && a.impatto >= 3 && !a.rango))) pezzi.push(`assenze pesanti ${esc(T[sq].nome)}`);
  if (g.meteo && g.meteo.effetto) pezzi.push(`vento ${Math.round(g.meteo.ventoMph)} mph`);
  return pezzi.length ? ` · <span class="sotto">${pezzi.join(" · ")}</span>` : "";
}
function bloccoAssenze(g, T){
  if (!g.assenzeCasa && !g.assenzeOspite) return "";
  const lato = (sq, a) => {
    if (!a) return `<div><div class="blocco">${stemma(T[sq], "s")}${esc(T[sq].nome)}</div><div class="sotto">nessun dato</div></div>`;
    const testa = a.rango ? `${a.n || 0} in lista · peso ${a.rango}ª su 138` : `${a.n || 0} in lista${a.impatto ? ` · circa ${Math.round(a.impatto * 10)}% della produzione` : ""}`;
    const righe = (a.giocatori || []).map(x => {
      const st = String(x.stato || "").toUpperCase();
      const segno = st === "ATTIVO" ? "✅ " : st === "INATTIVO" ? "⛔ " : "";
      return `<li${x.nuovo ? ' class="nuovo"' : ""}${st === "ATTIVO" ? ' style="opacity:.75"' : ""}>${segno}<b>${esc(x.nome)}</b> <span class="sotto">${esc(x.ruolo || "")}</span> · ${esc(x.statoIt || x.stato)}${x.nuovo ? " · <b>novità</b>" : ""}</li>`;
    }).join("");
    return `<div><div class="blocco">${stemma(T[sq], "s")}${esc(T[sq].nome)} <span class="sotto">${testa}</span></div><ul class="ass">${righe || "<li class='sotto'>nessun assente</li>"}</ul>${a.altri ? `<div class="sotto">e altri ${a.altri}</div>` : ""}</div>`;
  };
  return `<div class="titolo">Assenze</div><div class="giocatori">${lato(g.ospite, g.assenzeOspite)}${lato(g.casa, g.assenzeCasa)}</div>
    <div class="legenda"><span>${g.campionato === "College" ? "fonte CFBDepth (rapporti ufficiali e notizie); peso = quanto conta l'assenza" : "fonte rapporto infortuni ESPN (riserva nflverse); % = quota delle yard o dei lanci della squadra"}</span>${g.contestoAggiornato ? `<span>aggiornato ${esc(g.contestoAggiornato.slice(11, 16))} UTC</span>` : ""}${(g.inattivi || {}).ora ? `<span>✅ gioca / ⛔ inattivo: lista del giorno ESPN delle ${esc(g.inattivi.ora.slice(11, 16))} UTC</span>` : ""}</div>`;
}
function bloccoMeteo(g){
  const m = g.meteo;
  if (!m) return "";
  if (m.coperto) return `<div class="meteo">🏟️ Stadio coperto: il meteo non conta</div>`;
  const p = [];
  if (m.tempC != null) p.push(`${m.tempC} °C`);
  if (m.ventoKmh != null) p.push(`vento ${m.ventoKmh} km/h${m.direzione ? " " + esc(m.direzione) : ""}`);
  if (m.raffKmh != null) p.push(`raffiche ${m.raffKmh} km/h`);
  if (m.pioggia != null) p.push(`pioggia ${m.pioggia}%`);
  const forte = m.effetto && m.effetto.avviso !== false;     // college sotto i 20 mph: solo informazione
  return `<div class="meteo${forte ? " forte" : ""}">🌬️ ${p.join(" · ")}${m.cielo ? ` · ${esc(m.cielo)}` : ""}${m.effetto ? (forte ? `<br><b>${esc(m.effetto.testo)}</b>` : `<br>${esc(m.effetto.testo)}`) : ""} <span class="sotto">(${esc(m.fonte || "")})</span></div>`;
}
function bloccoForza(g, T){
  const a = g.forzaOspite, b = g.forzaCasa;
  if (!a || !b) return "";
  const n = a.n, rk = r => `<span class="rk ${classeRank(r, n)}">${r}°</span>`;
  const riga = (et, k, lato) => `<tr><td>${et}</td><td>${rk(a[lato]["rango_" + k])}</td><td>${rk(b[lato]["rango_" + k])}</td></tr>`;
  return `<details><summary>Forza delle squadre</summary><table class="forza"><tr><th></th><th>${esc(T[g.ospite].nome)}</th><th>${esc(T[g.casa].nome)}</th></tr>
    ${riga("Attacco · success rate", "successo", "att")}${riga("Attacco · EPA per passaggio", "epaPass", "att")}${riga("Attacco · EPA per corsa", "epaCorsa", "att")}
    ${riga("Difesa · success rate concesso", "successo", "dif")}${riga("Difesa · EPA per passaggio", "epaPass", "dif")}${riga("Difesa · EPA per corsa", "epaCorsa", "dif")}</table>
    <div class="legenda"><span>posizione su ${n} squadre, 1 = la migliore · success rate = azioni con EPA positivo</span></div></details>`;
}

function bloccoPartita(g, T){
  const P = g.partita;
  if (!P) return "";
  const favorita = P.margine >= 0 ? g.casa : g.ospite;
  const tile = (titolo, valore, sotto, forza, pct, liv, dove) => `<div><div class="e">${titolo}</div><div class="n">${valore}</div><div class="e">${sotto}</div>${pct ? `<div class="pct"><b>${pct}%</b> delle volte ${dove} · ${liv}</div>` : ""}<div class="e fz2">forza ${num(forza, 2)}</div></div>`;
  const atteso = P.attesoCasa !== undefined && P.attesoCasa !== null ? `<div class="atteso">
    <div class="e">Punteggio atteso dai numeri</div>
    <div class="ris"><span>${stemma(T[g.ospite], "s")} ${esc(T[g.ospite].nome)} <b>${Math.round(P.attesoOspite)}</b></span><span class="trat">–</span><span><b>${Math.round(P.attesoCasa)}</b> ${esc(T[g.casa].nome)} ${stemma(T[g.casa], "s")}</span></div>
    <div class="e">di solito segnano ${num(P.normaOspite, 1)} e ${num(P.normaCasa, 1)} · più l'effetto delle difese · ${P.neutro ? "campo neutro" : P.campo ? `campo +${num(P.campo, 1)} per ${esc(T[g.casa].nome)}` : "senza vantaggio del campo"}${P.correzioneTotale ? ` · totale corretto di ${num(P.correzioneTotale, 1)} (storico college)` : ""}</div></div>` : "";
  return atteso + `<div class="indici partita">
    ${tile("Totale", segnoNum(P.totale) + " pt", P.totale >= 0 ? "difese che concedono" : "difese che chiudono", P.forzaTotale,
           Math.abs(P.totale) < 0.5 ? null : P.pctTotale, P.livelloTotale, P.totale >= 0 ? "sopra la norma" : "sotto la norma")}
    ${tile("Margine", Math.abs(P.margine) < 0.5 ? "equilibrio" : `${esc(T[favorita].nome)} +${num(Math.abs(P.margine), 1)}`, "rispetto alla norma", P.forzaMargine,
           Math.abs(P.margine) < 0.5 ? null : P.pctMargine, P.livelloMargine, `da quella parte`)}
  </div>`;
}

function tabellaGiocatori(g, T){
  const righe = lista => (lista || []).map(p => `<tr${p.vantaggio ? ' class="segnale"' : ""}>
    <td><b>${esc(p.nome)}</b> <span class="sotto">${esc(p.ruolo || "")}</span></td>
    <td>${num(p.mediaStagione)}</td><td>${num(p.mediaUltime3)} ${freccia(p.forma)}</td>
    <td>${p.previsione !== null && p.previsione !== undefined ? `<b>${num(p.previsione)}</b> <span class="sotto">±${p.errore}</span>` : "—"}</td>
    <td>${p.rangoDifesa ? `<span class="rk ${classeRank(p.rangoDifesa, p.squadreTotali)}">${p.rangoDifesa}ª</span>` : "—"}</td></tr>`).join("");
  const blocco = (lista, sq) => (lista || []).length ? `<div><div class="blocco">${stemma(T[sq], "s")}${esc(T[sq].nome)}</div>
    <table><tr><th>Giocatore</th><th>media</th><th>ultime 3</th><th>previsione</th><th>difesa avv.</th></tr>${righe(lista)}</table></div>` : "";
  const h = blocco(g.giocatoriOspite, g.ospite) + blocco(g.giocatoriCasa, g.casa);
  return h ? `<details><summary>Giocatori chiave</summary><div class="giocatori">${h}</div>
    <div class="legenda"><span>previsione = media della stagione + effetto della difesa che trova; ± = errore medio</span><span><span class="su">▲</span><span class="giu">▼</span> forma delle ultime 3: di solito si torna alla media, non è un segnale</span></div></details>` : "";
}

function tabellone(g, T){
  let h = `<details><summary>Tabellone reparti</summary>`;
  for (const [a, d] of [[g.ospite, g.casa], [g.casa, g.ospite]]) {
    h += `<div class="blocco">${stemma(T[a], "s")}Attaccano i ${esc(T[a].nome)}</div><div class="int"><span></span><span style="text-align:center">att.</span><span style="text-align:center">dif.</span><span style="text-align:right">vantaggio</span></div>`;
    for (const area of ORDINE_AREE) {
      const x = (g.reparti || []).find(y => y.area === area && y.att === a);
      if (!x) continue;
      const w = x.verso === "attacco" ? a : d;
      const chi = !x.verso ? `<span style="color:var(--fb-muted)">equilibrio</span>`
        : `<span style="color:${coloreTesto(T[w].colore)};font-weight:700">${x.verso === "attacco" ? "attacco" : "difesa"} ${esc(T[w].nome)}</span>`;
      h += `<div class="riga"><span>${AREE[area]}</span><span class="rk ${classeRank(x.ra, x.n)}">${x.ra}°</span><span class="rk ${classeRank(x.rd, x.n)}">${x.rd}ª</span><span class="chiv">${chi}</span></div>`;
    }
  }
  const n = ((g.reparti || [])[0] || {}).n || 32, q = Math.round(n * 10 / 32);
  return h + `<div class="legenda"><span><span class="rk buono">1–${q}</span> tra i migliori</span><span><span class="rk scarso">${n - Math.round(n * 11 / 32) + 1}–${n}</span> tra i peggiori</span><span>su ${n} squadre · il vantaggio dipende dalla difesa</span></div></details>`;
}

function idScheda(g){ return "p-" + String(g.ospite + "-" + g.casa + "-" + g.data).replace(/[^A-Za-z0-9-]/g, ""); }

function scheda(g){
  const T = {[g.casa]: squadra(g, g.casa), [g.ospite]: squadra(g, g.ospite)};
  const dec = g.campionato === "NFL" ? 3 : 1;
  const tile = sq => { const i = sq === g.casa ? g.indiceCasa : g.indiceOspite;
    return `<div>${stemma(T[sq])}<div><div class="n" style="color:${coloreTesto(T[sq].colore)}">${i && i.posizione ? i.posizione + "°" : "—"}</div><div class="e">indice ${i ? segno(i.netto, dec) : "—"}</div></div></div>`; };
  const evid = (g.vantaggi || []).slice(0, MAX_EVIDENZA);
  const colore = c => /^#?[0-9a-f]{6}$/i.test(String(c || "")) ? "#" + String(c).replace("#", "") : "";
  const cO = colore(g.coloreOspite), cC = colore(g.coloreCasa);
  return `<article class="scheda riquadro" id="${idScheda(g)}" style="${cO ? "--c-osp:" + cO + ";" : ""}${cC ? "--c-casa:" + cC : ""}">
    <div class="testa">${stemma(T[g.ospite], "s")}<div class="nomi">${esc(T[g.ospite].nome)} @ ${esc(T[g.casa].nome)}</div>${stemma(T[g.casa], "s")}<span class="quando">${esc(quando(g))}</span></div>
    <div class="indici">${tile(g.ospite)}${tile(g.casa)}</div>
    ${g.giudizio ? `<details class="giud"><summary>📝 Giudizio${sommario(g, T)}</summary><p class="giudizio">${esc(g.giudizio)}</p></details>` : ""}
    ${bloccoAssenze(g, T)}
    ${bloccoMeteo(g)}
    ${bloccoForza(g, T)}
    <div class="titolo">Partita: effetto delle difese</div>
    ${bloccoPartita(g, T)}
    <div class="titolo">Vantaggi in evidenza</div>
    ${evid.length ? evid.map(s => duelloEvidenza(g, T, s)).join("") : `<div class="nessuno">Nessuna difesa agli estremi: partita in equilibrio sui dati.</div>`}
    ${(g.vantaggi || []).length > MAX_EVIDENZA ? `<div class="sotto">Altri ${g.vantaggi.length - MAX_EVIDENZA} vantaggi nel tabellone e nei giocatori qui sotto.</div>` : ""}
    ${tabellaGiocatori(g, T)}
    ${tabellone(g, T)}
  </article>`;
}

/* ---------- i 3 migliori: NFL e college insieme, giocatori, handicap e totali, per forza ---------- */
/* Percentuali misurate (le stesse di fetch_duelli.py): servono solo se un file è di una versione precedente
   e non le contiene ancora, così una lega non sparisce dalla classifica mentre l'altra è già aggiornata. */
const SCALA = {NFL: {totale: [0.10, 0.20], margine: [0.07, 0.14]}, College: {totale: [0.20, 0.43], margine: [0.22, 0.45]}};
const PCT = {NFL: {totale: [50, 57, 63], margine: [55, 56, 54]}, College: {totale: [56, 63, 71], margine: [55, 62, 74]}};
function pctPartita(camp, tipo, P){
  const v = tipo === "totale" ? P.totale : P.margine;
  if (Math.abs(v) < 0.5) return 0;
  const dato = tipo === "totale" ? P.pctTotale : P.pctMargine;
  if (dato) return dato;
  const f = tipo === "totale" ? P.forzaTotale : P.forzaMargine, [b, a] = (SCALA[camp] || SCALA.NFL)[tipo];
  return (PCT[camp] || PCT.NFL)[tipo][f < b ? 0 : f < a ? 1 : 2];
}
const PCT_G = {NFL: {QB: [52, 53], RB: [51, 61], WR: [43, 60], TE: [48, 61]},
               College: {QB: [51, 59], RB: [54, 60], WR: [45, 61], TE: [45, 67]}};
const pctGiocatore = (camp, v) => v.pct || (((PCT_G[camp] || PCT_G.NFL)[v.ruolo === "RIC" ? "WR" : v.ruolo] || [0, 0])[v.verso === "attacco" ? 0 : 1]);
function candidati(){
  const out = [];
  for (const camp of ["NFL", "College"]) {
    const D = DATI[camp];
    if (!D) continue;
    for (const g of D.partite) {
      if (iniziata(g)) continue;
      const T = {[g.casa]: squadra(g, g.casa), [g.ospite]: squadra(g, g.ospite)};
      const P = g.partita;
      if (P) {
        out.push({camp, g, tipo: "Totale", forza: P.forzaTotale, pct: pctPartita(camp, "totale", P), testo: `${esc(T[g.ospite].nome)} @ ${esc(T[g.casa].nome)}: totale ${segnoNum(P.totale)} punti rispetto alla norma delle due squadre`});
        const fav = P.margine >= 0 ? g.casa : g.ospite;

      }

  // prima quanto spesso, nello storico, finisce dalla parte indicata; a parità, lo sbilanciamento più netto
  return out.sort((a, b) => (b.pct - a.pct) || (b.forza - a.forza));
}

/* ================== Charlie: il prezzo giusto contro la tua quota ==================
   Probabilità dalla linea del mercato americano (DraftKings da ESPN, o quella che inserisci) e dagli scarti
   misurati sullo storico 2019-2025 (Protocollo 8); assenze e vento solo con le misure dei Protocolli 6-7;
   prop dalla linea bet365.it senza margine e dalla forma della statistica (Protocollo 9).
   Il modello della scheda Matchup NON entra: contro la linea di chiusura non aggiunge informazione.
   Nessun salvataggio nel browser: la lista vive finché la pagina è aperta, il registro lo tiene il bot. */
let VISTA_CHARLIE = false;
const CH = {modo: "partite", parte: "attacco", lista: [], ultimo: null, seq: 0};
const LIBRI = [["sn","Snai"],["si","Sisal"],["ep","ePlay24"],["pw","Planetwin365"],["lo","Lottomatica"],["b3","Bet365"]];
const STAT_PROP = [["yardLanciate","Yard lanciate"],["yardCorsa","Yard di corsa"],["yardRicevute","Yard ricevute"],
  ["ricezioni","Ricezioni"],["tentativiCorsa","Tentativi di corsa"],["stessa","Altro (stessa linea di bet365)"]];
const CODICE_STAT = {yardLanciate:"py", yardCorsa:"ry", yardRicevute:"cy", ricezioni:"rc", tentativiCorsa:"ra", stessa:"xx"};
const numero = v => { const x = parseFloat(String(v ?? "").trim().replace(",", ".")); return isFinite(x) ? x : null; };
const pc = (p, d = 1) => p === null || p === undefined ? "—" : num(p * 100, d) + "%";
const Phi = x => 0.5 * (1 + Math.sign(x) * Math.sqrt(1 - Math.exp(-2 * x * x / Math.PI)));   // buona a ±0,3 punti %
function PhiInv(p){ let lo = -6, hi = 6; for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; if (Phi(m) < p) lo = m; else hi = m; } return (lo + hi) / 2; }

/* distribuzione da 199 quantili (0,5% ... 99,5%) */
function cdfQ(q, x){
  if (!q || !q.length) return null;
  if (x <= q[0]) return 0.005;
  if (x >= q[q.length - 1]) return 0.995;
  let lo = 0, hi = q.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (q[m] <= x) lo = m; else hi = m; }
  const fr = q[hi] === q[lo] ? 0.5 : (x - q[lo]) / (q[hi] - q[lo]);
  return (lo + 1 + fr) / 200;
}
function quantQ(q, p){
  const i = Math.min(q.length - 1, Math.max(0, p * 200 - 1));
  const a = Math.floor(i), b = Math.min(q.length - 1, a + 1);
  return q[a] + (q[b] - q[a]) * (i - a);
}
const fasciaDi = (fasce, v) => (fasce || []).filter(f => v >= f).length;

function tabCharlie(){ return (DATI[CAMPIONATO] || {}).charlie; }
function partiteCharlie(){ return ((DATI[CAMPIONATO] || {}).partite || []).filter(g => !iniziata(g)); }
function nomeP(g){ return `${squadra(g, g.ospite).nome || g.ospite} @ ${squadra(g, g.casa).nome || g.casa}`; }
const LIBRO = c => (LIBRI.find(l => l[0] === c) || [c, c])[1];

/* ---------- assenze e vento: gli spostamenti misurati ---------- */
const RUOLO_TAB = r => {
  r = String(r || "").toUpperCase();
  if (r === "QB") return "QB";
  if (["RB","HB","FB"].includes(r)) return "RB";
  if (r === "WR") return "WR";
  if (r === "TE") return CAMPIONATO === "College" ? "WR" : "TE";

  if (["DL","DE","DT","NT","EDGE","LB","ILB","OLB","MLB","DB","CB","S","FS","SS","SAF","NB"].includes(r)) return "DIF";
  return null;
};
function segnaliPartita(g){
  const T = tabCharlie(), out = [];
  if (!T) return out;
  for (const [lato, sq] of [["assenzeCasa", g.casa], ["assenzeOspite", g.ospite]]) {
    for (const x of ((g[lato] || {}).giocatori || [])) {
      const st = String(x.stato || "").toUpperCase();
      if (!["O","OFS","OUT","D","DOUBTFUL","S","INATTIVO"].includes(st)) continue;
      const rt = RUOLO_TAB(x.ruolo), m = rt && (T.assenze || {})[rt];
      const peso = x.peso || 0;
      const titolareQB = rt !== "QB" || peso >= (CAMPIONATO === "College" ? 4 : 3);
      const principale = !(CAMPIONATO === "College" && rt === "WR") || peso >= 4;
      out.push({tipo: "assenza", id: `a${out.length}`, sq, nome: x.nome, ruolo: x.ruolo, stato: x.statoIt || x.stato,
                misura: m && titolareQB && principale ? m : null, rt, data: x.data || ""});
    }
  }
  const e = ((g.meteo || {}).effetto) || {};
  if (e.avviso && e.punti) out.push({tipo: "vento", id: "vento", punti: e.punti, testo: e.testo,
                                     aff: CAMPIONATO === "NFL" ? "B" : "C"});
  // squadra già fuori dai playoff (Protocollo 11, gruppo B: −1,52 punti sulla linea, misura non superata → indizio)
  const po = g.playoff;
  if (po && po.casa && po.ospite && po.casa.fuori !== po.ospite.fuori) {
    const casaFuori = po.casa.fuori, sq = casaFuori ? g.casa : g.ospite, x = casaFuori ? po.casa : po.ospite;
    out.push({tipo: "playoff", id: "playoff", sq, punti: 1.5, aff: "C",
              testo: `${squadra(g, sq).nome || sq} è già fuori dai playoff (probabilità ${num(x.p * 100, 1)}%, la partita non la cambia)`});
  }
  // rinunce ai bowl (Protocollo 12, conferma non superata → indizio da spuntare): titolari della stagione regolare
  if (g.titolari && (g.titolari.casa || []).length && (g.titolari.ospite || []).length)
    out.push({tipo: "rinunce", id: "rinunce", titolari: g.titolari, pendenza: 1.0, aff: "C"});

}

/* Movimento della linea dall'apertura (ESPN, stessa richiesta della linea attuale) e cosa suggerisce per
   un'assenza: se la linea è ferma e la notizia è di questa settimana, probabilmente non è ancora nel prezzo. */
function movimentoLinea(g){
  const mk = g.mercato || {}, ap = mk.apertura || {};
  if (ap.margineCasa === null || ap.margineCasa === undefined || mk.margineCasa === null || mk.margineCasa === undefined) return null;
  return {dm: mk.margineCasa - ap.margineCasa, dt: (ap.totale ?? null) !== null && mk.totale !== null && mk.totale !== undefined ? mk.totale - ap.totale : null, ap};
}
function consiglioAssenza(g, s){
  const mv = movimentoLinea(g);
  if (!mv || !s.misura) return {testo: "", spunta: false};
  const casa = s.sq === g.casa, avv = squadra(g, casa ? g.ospite : g.casa).nome || (casa ? g.ospite : g.casa);
  const verso = casa ? -mv.dm : mv.dm;          // > 0: la linea si è mossa contro la squadra dell'assente
  const inizio = g.inizioUtc ? new Date(g.inizioUtc) : null;
  const recente = s.data && inizio ? (inizio - new Date(s.data + "T12:00:00Z")) / 864e5 <= 6 : false;
  if (Math.abs(mv.dm) < 0.5) return {spunta: recente, testo: recente
    ? "Dall'apertura la linea è ferma e la notizia è di questa settimana: probabilmente non è ancora nel prezzo (spuntata, controlla)."
    : "Dall'apertura la linea è ferma, ma la notizia non è di questa settimana: può essere già nel prezzo d'apertura."};
  if (verso >= s.misura.spread / 2) return {spunta: false,
    testo: `Dall'apertura la linea si è già mossa di ${num(Math.abs(mv.dm), 1)} verso ${avv}: probabilmente la notizia è già dentro.`};
  return {spunta: false, testo: `Dall'apertura la linea si è mossa di ${num(Math.abs(mv.dm), 1)} ${verso > 0 ? "verso " + avv + ", meno della misura" : "nell'altro verso"}: decidi tu.`};
}

/* ---------- modalità Partite ---------- */
function probPartita(inp){
  const T = tabCharlie(), g = inp.g, P = T.partite;
  let m0 = inp.margineCasa, t0 = inp.totale;
  const spost = {margine: 0, totale: 0, casa: 0, ospite: 0}, incert = [], usati = [];
  let peggiore = "A";
  const peggio = a => { if ("ABC".indexOf(a) > "ABC".indexOf(peggiore)) peggiore = a; };
  for (const s of inp.segnali) {
    if (s.tipo === "vento" && s.attivo) {
      spost.totale += s.punti; spost.casa += s.punti / 2; spost.ospite += s.punti / 2;
      incert.push(0.8); usati.push(`vento: ${segno(s.punti, 1)} punti sul totale`); peggio(s.aff);
    }
    if (s.tipo === "playoff" && s.attivo) {
      const casa = s.sq === g.casa;
      spost.margine += casa ? -s.punti : s.punti;
      spost[casa ? "casa" : "ospite"] -= s.punti / 2; spost[casa ? "ospite" : "casa"] += s.punti / 2;
      incert.push(0.7); usati.push(`indizio: ${squadra(g, s.sq).nome || s.sq} già fuori dai playoff (${segno(-s.punti, 1)} punti sulla linea)`); peggio("C");
    }
    if (s.tipo === "rinunce" && s.pesi && (s.pesi.casa || s.pesi.ospite)) {
      const d = (s.pesi.casa - s.pesi.ospite) * s.pendenza;      // > 0: pesano di più le rinunce della casa
      spost.margine -= d; spost.casa -= d / 2; spost.ospite += d / 2;
      incert.push(0.7); usati.push(`indizio rinunce ai bowl: peso ${num(s.pesi.casa, 1)} casa, ${num(s.pesi.ospite, 1)} ospite (${segno(-d, 1)} sul margine della casa)`); peggio("C");
    }
    if (s.tipo !== "assenza" || !s.misura) continue;
    const m = s.misura, casa = s.sq === g.casa, dir = casa ? -1 : 1;
    const proprio = casa ? "casa" : "ospite", altro = casa ? "ospite" : "casa";
    if (s.mossa) {                               // linea non ancora mossa: si aggiunge lo spostamento atteso
      if (s.rt === "DIF") { spost.margine += dir * m.spread; spost[altro] += m.squadra; spost.totale += m.squadra; }
      else { spost.margine += dir * m.spread; spost[proprio] -= m.squadra; spost.totale -= m.squadra; }
      incert.push(0.3); usati.push(`${s.nome}: linea non ancora mossa (${segno(-m.spread, 1)} sullo spread)`); peggio(m.affidabilita || "A");
    }
    if (s.fresca && m.indizio) {                 // indizio: sottovalutato anche alla chiusura
      spost.margine += dir * (m.indizioSpread || m.indizio); spost[proprio] -= m.indizio; spost.totale -= m.indizio;
      incert.push(0.7); usati.push(`${s.nome}: indizio notizia fresca (${segno(-m.indizio, 1)} punti alla squadra)`); peggio("C");
    }
  }
  let mercato, centro, linea, sopra;
  if (inp.mercato === "spread") {
    mercato = "margine";
    const casa = inp.lato === "casa";
    centro = m0 + spost.margine;                 // margine atteso della casa
    linea = casa ? -inp.linea : inp.linea;       // la casa vince la giocata se margine > −handicap
    sopra = casa;
  } else if (inp.mercato === "totale") {
    mercato = "totale"; centro = t0 + spost.totale; linea = inp.linea; sopra = inp.lato === "over";
  } else {
    mercato = "squadra";
    const casa = inp.lato.startsWith("casa");
    centro = (casa ? (t0 + m0) / 2 + spost.casa : (t0 - m0) / 2 + spost.ospite);
    linea = inp.linea; sopra = inp.lato.endsWith("over");
  }
  const tab = P[mercato];
  const rif = mercato === "margine" ? 0 : mercato === "totale" ? t0 : (inp.lato.startsWith("casa") ? (t0 + m0) / 2 : (t0 - m0) / 2);
  const q = tab.quantili[Math.min(tab.quantili.length - 1, fasciaDi(tab.fasce, rif))];
  const k = linea - centro;
  const pSopra = 1 - cdfQ(q, k);
  let p = sopra ? pSopra : 1 - pSopra;
  // linea intera: il pareggio rimborsa la puntata (frequenze misurate: 3 e 7 punti nell'NFL pesano molto)
  let pPush = 0;
  if (Number.isInteger(inp.linea)) {
    const pr = P.pareggi || {};
    pPush = mercato === "margine" ? (inp.linea === 0 ? (pr.margine0 || 0) : ((pr.margine || {})[Math.abs(inp.linea)] || 0.02))
      : (pr[mercato] || 0.03);
    p = Math.max(0.005, p - pPush / 2);
  }
  const dens = Math.max(0.005, (cdfQ(q, k + 1) - cdfQ(q, k - 1)) / 2);
  const sd = Math.sqrt(tab.oscillazione ** 2 + incert.reduce((t, x) => t + (x * dens) ** 2, 0));
  const larg = 1.645 * sd;
  if (larg > 0.05) peggio("C"); else if (larg > 0.03) peggio("B");
  return {p, pLo: Math.max(0.01, p - larg), pHi: Math.min(0.99, p + larg), aff: peggiore, usati, pPush,
          intera: Number.isInteger(inp.linea)};
}

/* ---------- modalità Giocatori ---------- */
function probProp(inp){
  const T = tabCharlie();
  let p0, aff = "A", note = [], incert = [];
  if (inp.qOver && inp.qUnder) p0 = (1 / inp.qOver) / (1 / inp.qOver + 1 / inp.qUnder);
  else if (inp.qOver) { p0 = 1 / (inp.qOver * (1 + T.margineBet365Prop)); aff = "B"; incert.push(0.02); note.push("una sola quota bet365: margine stimato al " + num(T.margineBet365Prop * 100) + "%"); }
  else if (inp.rifUSA) { p0 = 0.5; aff = "B"; incert.push(0.02); note.push(`riferimento ${inp.rifUSA} (linea americana principale da ESPN, senza quote): 50% alla linea`); }
  else return {errore: "Inserisci almeno la quota over di bet365."};
  let pOver = p0;
  if (inp.linea !== inp.linea365) {
    const f = (T.prop || {})[inp.stat];
    if (!f) return {errore: "Per questa statistica serve la stessa linea di bet365."};
    if (f.normale) {
      const mu = inp.linea365 + f.normale * PhiInv(p0);
      pOver = 1 - Phi((inp.linea - mu) / f.normale);
    } else {
      const q = f.rapporti[Math.min(f.rapporti.length - 1, fasciaDi(f.fasce, inp.linea365))];
      const c = inp.linea365 / Math.max(0.01, quantQ(q, 1 - p0));
      pOver = 1 - cdfQ(q, inp.linea / c);
    }
    incert.push(f.affidabilita === "A" ? 0.015 : 0.035);
    if ("ABC".indexOf(f.affidabilita) > "ABC".indexOf(aff)) aff = f.affidabilita;
    note.push(`linea spostata da ${num(inp.linea365, 1)} a ${num(inp.linea, 1)} con la forma della statistica (affidabilità ${f.affidabilita})`);
  }
  const ind = (T.indiziProp || {})[inp.stat];
  if (ind && inp.indizio) { pOver += ind.over; incert.push(0.02); note.push("indizio: " + ind.nota); if (aff === "A") aff = "B"; }
  pOver = Math.min(0.99, Math.max(0.01, pOver));
  const p = inp.lato === "over" ? pOver : 1 - pOver;
  const larg = 1.645 * Math.sqrt(incert.reduce((t, x) => t + x * x, 0) + 0.01 ** 2);
  return {p, pLo: Math.max(0.01, p - larg), pHi: Math.min(0.99, p + larg), aff, usati: note,
          intera: Number.isInteger(inp.linea)};
}

/* ---------- risultato, lista, combinate, registro ---------- */
function valuta(r, quota, puntata){
  const push = r.pPush || 0;                       // col pareggio la puntata torna: non è una perdita
  const ev = r.p * quota - 1 + push, evP = r.pLo * quota - 1 + push;
  return {...r, quota, puntata, ev, evP, giusta: (1 - push) / r.p};
}
function codNum(x, f){ const v = Math.round(x * f); return (v < 0 ? "m" : "") + Math.abs(v); }
function verdetto(v){
  if (v.evP > 0) return ["si", "Valore anche nel caso pessimistico"];
  if (v.ev > 0) return ["", "Valore solo nel caso centrale: incerto"];
  return ["no", "Niente valore a questa quota"];
}
function cartaRisultato(v, titolo){
  const [cls, frase] = verdetto(v);
  const ris = v.puntata ? ` · su ${num(v.puntata, 2)} € in media ${v.ev >= 0 ? "+" : "−"}${num(Math.abs(v.ev * v.puntata), 2)} €` : "";
  return `<div class="ch-ris ${cls}">
    <div style="font-weight:600">${esc(titolo)}</div>
    <div class="ch-num">
      <div><b>${pc(v.p)}</b><span>probabilità di vincere<br>${pc(v.pLo, 0)} – ${pc(v.pHi, 0)}</span></div>
      <div><b>${num(v.giusta, 2)}</b><span>quota giusta<br>tua: ${num(v.quota, 2)}</span></div>
      <div><b>${v.ev >= 0 ? "+" : "−"}${num(Math.abs(v.ev) * 100, 1)}%</b><span>valore atteso<br>pessimistico ${v.evP >= 0 ? "+" : "−"}${num(Math.abs(v.evP) * 100, 1)}%</span></div>
    </div>
    <div class="ch-verdetto">${frase} <span class="aff ${v.aff}" title="Affidabilità del numero">${v.aff}</span></div>
    <div class="sotto">Per pareggiare a quota ${num(v.quota, 2)} serve il ${pc((1 - (v.pPush || 0)) / v.quota)}${ris}.${v.pPush ? ` Linea intera: probabilità di pareggio ${pc(v.pPush)}, la puntata torna indietro (già contato).` : ""}</div>
    ${v.usati && v.usati.length ? `<ul class="ass">${v.usati.map(u => `<li>${esc(u)}</li>`).join("")}</ul>` : ""}
    <div class="ch-azioni"><button id="chAggiungi">Aggiungi alla lista</button><button id="chRegistra" class="on">Registra</button></div>
  </div>`;
}
/* «Il tuo giudizio» (16/11/2026): un solo comando per tutte le giocate, da −10 a +10 punti di probabilità sul
   numero finale di Charlie, con il motivo. La carta mostra i due numeri; il registro del bot li tiene entrambi e
   con /charlie dice, motivo per motivo, se il tuo giudizio migliora o peggiora la previsione. */
const MOTIVI_GIUD = [["o", "linea offensiva"], ["a", "assenze"], ["m", "meteo"], ["v", "motivazioni"], ["x", "altro"]];
function campoGiudizio(){
  const g = CH.giud || 0;
  return `<div class="ch-giud"><label>Il tuo giudizio: <b id="chGiudV">${g > 0 ? "+" : g < 0 ? "−" : ""}${Math.abs(g)}</b> punti

    <label>Motivo<select id="chGiudM">${MOTIVI_GIUD.map(([k, t]) => `<option value="${k}" ${CH.giudM === k ? "selected" : ""}>${t}</option>`).join("")}</select></label>
    <span class="sotto">Sposta la probabilità di Charlie se sai qualcosa che i numeri non vedono. A 0 non cambia nulla.</span></div>`;
}
const stringi = x => Math.min(0.99, Math.max(0.01, x));
function conGiudizio(v){
  const g = CH.giud || 0;
  if (!g) return null;
  const d = g / 100;
  return valuta({...v, p: stringi(v.p + d), pLo: stringi(v.pLo + d), pHi: stringi(v.pHi + d)}, v.quota, v.puntata);
}
function sufGiudizio(){
  const g = CH.giud || 0;
  return g ? `_g${g > 0 ? "p" : "m"}${Math.abs(g)}${CH.giudM || "x"}` : "";
}
function cartaGiudizio(vG){
  if (!vG) return "";
  const [cls, frase] = verdetto(vG), g = CH.giud, mot = (MOTIVI_GIUD.find(x => x[0] === (CH.giudM || "x")) || ["", "altro"])[1];
  return `<div class="ch-ris ${cls}" style="margin-top:8px">
    <div style="font-weight:600">Con il tuo giudizio (${g > 0 ? "+" : "−"}${Math.abs(g)} punti, ${esc(mot)})</div>

      <div><b>${vG.ev >= 0 ? "+" : "−"}${num(Math.abs(vG.ev) * 100, 1)}%</b><span>valore atteso<br>pessimistico ${vG.evP >= 0 ? "+" : "−"}${num(Math.abs(vG.evP) * 100, 1)}%</span></div>
    </div>

  </div>`;
}
function mostraRisultato(base){
  // base = {breve, v, libro, partita, codice}: v e codice sono quelli puri di Charlie
  const vG = conGiudizio(base.v);
  CH.ultimo = {id: ++CH.seq, ...base, codiceBase: base.codice, codice: base.codice + sufGiudizio(), vG};
  const out = document.getElementById("chEsito");
  out.innerHTML = cartaRisultato(base.v, base.breve).replace('<div class="ch-azioni">', cartaGiudizio(vG) + '<div class="ch-azioni">');

function colleghiGiudizio(){
  const r = document.getElementById("chGiud"), m = document.getElementById("chGiudM");
  if (!r) return;

    CH.giud = Number(r.value) || 0; CH.giudM = m.value;

function disegnaLista(){

      combo = `<div class="ch-griglia"><label>Quota della combinata (se il bookmaker la cambia)<input id="chQuotaCombo" inputmode="decimal" value="${num(qIn, 2)}"></label>

        ${cartaRisultato(CH.combo.v, `Combinata di ${scelti.length}: ${scelti.map(x => x.breve).join(" + ")}`).replace('<button id="chAggiungi">Aggiungi alla lista</button>', '').replace('id="chRegistra"', 'id="chRegistraCombo"')}
        ${(() => { if (!scelti.some(x => x.vG)) return "";

  const id = CH.partita && P.some(g => idScheda(g) === CH.partita) ? CH.partita : idScheda(P[0]);
  CH.partita = id;
  const g = P.find(x => idScheda(x) === id), G = (DATI[CAMPIONATO] || {}).giocatoriProp || {};
  const gioc = [...(G[g.ospite] || []).map(x => ({...x, sq: g.ospite})), ...(G[g.casa] || []).map(x => ({...x, sq: g.casa}))];
  const T = tabCharlie();
  const scelta = `<label class="largo">Partita<select id="chPartita">${P.map(x => `<option value="${idScheda(x)}" ${idScheda(x) === id ? "selected" : ""}>${esc(nomeP(x))} · ${esc(quando(x))}</option>`).join("")}</select></label>`;
  const parti = CAMPIONATO === "NFL" ? `<div class="ch-modi" style="margin-top:12px"><button data-parte="attacco" class="${CH.parte === "attacco" ? "on" : ""}">Attacco</button><button data-parte="difesa" class="${CH.parte === "difesa" ? "on" : ""}">Difesa</button></div>` : "";
  if (CAMPIONATO === "NFL" && CH.parte === "difesa") return `${parti}<div class="ch-griglia">${scelta}</div>${formDifesa(g)}`;
  return `${parti}<div class="ch-griglia">
    ${scelta}

    <label>Statistica<select id="chStat">${STAT_PROP.map(s => `<option value="${s[0]}">${s[1]}${s[0] !== "stessa" && ((T.prop || {})[s[0]] || {}).affidabilita ? " · " + T.prop[s[0]].affidabilita : ""}</option>`).join("")}</select></label>
    <div class="ch-rif largo" id="chUSA" style="grid-column:1/-1"></div>
    <label>Linea bet365.it<input id="chL365" inputmode="decimal" placeholder="es. 54,5"></label>
    <label>Quota over bet365.it<input id="chQo" inputmode="decimal" placeholder="es. 1,83"></label>
    <label>Quota under bet365.it<input id="chQu" inputmode="decimal" placeholder="es. 1,90"></label>
    <label>Giocata<select id="chLatoP"><option value="over">Over</option><option value="under">Under</option></select></label>
    <label>Linea del tuo bookmaker<input id="chLineaP" inputmode="decimal" placeholder="es. 49,5"></label>
    <label>Quota<input id="chQuotaP" inputmode="decimal" placeholder="es. 1,85"></label>
    <label>Bookmaker<select id="chLibroP">${LIBRI.map(l => `<option value="${l[0]}">${l[1]}</option>`).join("")}</select></label>
    <label>Puntata € (facoltativa)<input id="chPuntataP" inputmode="decimal"></label>
  </div>
  ${Object.keys(T.indiziProp || {}).length ? `<ul class="ch-segnali">${Object.entries(T.indiziProp).map(([k, x]) => `<li><input type="checkbox" id="chi-${k}"><label for="chi-${k}">${esc(x.nota)} <span class="aff B">B</span><div class="sotto">Vale solo per ${esc((STAT_PROP.find(s => s[0] === k) || [k, k])[1].toLowerCase())}: spunta per applicarlo.</div></label></li>`).join("")}</ul>` : ""}
  ${campoGiudizio()}
  <div class="ch-azioni"><button id="chCalcola" class="on">Calcola</button></div><div id="chEsito"></div>`;
}
/* Linea americana principale della prop (ESPN, di solito DraftKings): riferimento se bet365 non è inserito. */
function lineaUSA(g, chi, stat){
  const u = g && g.propUSA, x = u && chi && ((u.linee || {})[chi.id] || {})[stat];
  return x ? {...x, fonte: u.fonte || "mercato USA", ora: u.ora} : null;
}
function mostraUSA(){
  const box = document.getElementById("chUSA"); if (!box) return;
  const g = partiteCharlie().find(x => idScheda(x) === CH.partita);
  const G = (DATI[CAMPIONATO] || {}).giocatoriProp || {};
  const gioc = g ? [...(G[g.ospite] || []), ...(G[g.casa] || [])] : [];
  const chi = gioc[Number(document.getElementById("chGioc")?.value)], stat = document.getElementById("chStat")?.value;
  const u = lineaUSA(g, chi, stat);
  const ora = u && u.ora ? new Date(u.ora).toLocaleString("it-IT", {weekday:"short", hour:"2-digit", minute:"2-digit"}) : "";
  box.innerHTML = u ? `Linea americana (${esc(u.fonte)}): <b>${num(u.l, 1)}</b>${u.ap !== null && u.ap !== undefined ? ` · apertura ${num(u.ap, 1)}${u.ap !== u.l ? ` (mossa ${segno(u.l - u.ap, 1)})` : " (ferma)"}` : ""}${ora ? " · letta " + esc(ora) : ""}. Se lasci vuoti i campi bet365, Charlie parte da questa (50% alla linea, affidabilità B).`
    : (g && g.propUSA ? "Linea americana non pubblicata per questo giocatore e statistica: serve bet365." : "Linee americane delle prop non ancora lette per questa partita: serve bet365.");
}
function calcolaGiocatori(){
  const g = partiteCharlie().find(x => idScheda(x) === CH.partita), out = document.getElementById("chEsito");
  const G = (DATI[CAMPIONATO] || {}).giocatoriProp || {};
  const gioc = [...(G[g.ospite] || []).map(x => ({...x, sq: g.ospite})), ...(G[g.casa] || []).map(x => ({...x, sq: g.casa}))];
  const chi = gioc[Number(document.getElementById("chGioc").value)];
  const stat = document.getElementById("chStat").value;
  const l365 = numero(document.getElementById("chL365").value), qo = numero(document.getElementById("chQo").value), qu = numero(document.getElementById("chQu").value);
  const linea = numero(document.getElementById("chLineaP").value), quota = numero(document.getElementById("chQuotaP").value);
  if (!chi) { out.innerHTML = `<div class="errore">Scegli il giocatore.</div>`; return; }
  const usa = (l365 === null && !qo) ? lineaUSA(g, chi, stat) : null;
  if (!usa && (l365 === null || !qo)) { out.innerHTML = `<div class="errore">Inserisci linea e quota over di bet365.it (meglio anche l'under): la linea americana per questa prop non c'è.</div>`; return; }
  if (linea === null || !quota || quota <= 1) { out.innerHTML = `<div class="errore">Inserisci la linea e la quota del tuo bookmaker.</div>`; return; }
  const rif = usa ? usa.l : l365;
  const r = probProp({stat, linea365: rif, qOver: usa ? null : qo, qUnder: usa ? null : qu, rifUSA: usa ? usa.fonte : null, linea, lato: document.getElementById("chLatoP").value,
                      indizio: !!document.getElementById("chi-" + stat)?.checked});
  if (r.errore) { out.innerHTML = `<div class="errore">${esc(r.errore)}</div>`; return; }
  const v = valuta(r, quota, numero(document.getElementById("chPuntataP").value));
  const lato = document.getElementById("chLatoP").value;
  const breve = `${chi.n} ${lato} ${num(linea, 1)} ${(STAT_PROP.find(s => s[0] === stat) || ["", stat])[1].toLowerCase()} · ${nomeP(g)}`;
  const libro = document.getElementById("chLibroP").value;
  const codice = ["P", CAMPIONATO === "NFL" ? "N" : "C", (g.mercato || {}).espnId || "0", chi.id, CODICE_STAT[stat], lato[0],
    codNum(linea, 10), codNum(quota, 100), libro, codNum(v.puntata || 0, 100), codNum(v.p, 1000), codNum(rif, 10)].join("_");
  mostraRisultato({breve, v, libro, partita: idScheda(g), codice});
}

function colleghiRisultato(){
  document.getElementById("chAggiungi")?.addEventListener("click", () => {
    if (CH.ultimo && !CH.lista.some(x => x.codice === CH.ultimo.codice)) CH.lista.push({...CH.ultimo, combo: false});
    disegnaCharlie(true);
  });
  document.getElementById("chRegistra")?.addEventListener("click", async () => {
    const u = CH.ultimo; if (!u) return;
    const msg = await registra([u], u.v.puntata, u.v.quota);
    document.getElementById("chEsito").insertAdjacentHTML("beforeend", `<div class="sotto" style="margin-top:6px">${msg}</div>`);
  });
}

function disegnaCharlie(tieni){
  const ch = document.getElementById("charlie"), T = tabCharlie();
  if (!T) { ch.innerHTML = `<div class="vuoto">Charlie non ha ancora i dati per ${esc(CAMPIONATO)}: arrivano con il prossimo aggiornamento della sezione.</div>`; return; }
  const esitoPrima = tieni ? document.getElementById("chEsito")?.innerHTML : "";
  ch.innerHTML = `<div class="ch-testa"><div><h2>Charlie</h2><div class="sotto">Il prezzo giusto contro la tua quota · ${esc(CAMPIONATO)}</div></div>
    <div class="ch-modi"><button data-modo="partite" class="${CH.modo === "partite" ? "on" : ""}">Partite</button><button data-modo="giocatori" class="${CH.modo === "giocatori" ? "on" : ""}">Giocatori</button></div></div>
    ${CH.modo === "partite" ? formPartite() : formGiocatori()}
    <div id="chLista">${disegnaLista()}</div>
    <details><summary>Come ragiona Charlie</summary><div class="sotto" style="margin-top:6px">
      Il prezzo giusto parte dalla linea del mercato americano, il più efficiente: la probabilità di qualunque linea (anche spostata) viene dagli scarti tra risultato e linea su ${CAMPIONATO === "NFL" ? "1.960" : "8.036"} partite 2019-2025. Le assenze spostano il prezzo solo con le misure fatte contro la linea di chiusura; gli «indizi» sono segnali non ancora confermati. Il punteggio atteso della scheda Matchup qui non entra: contro la linea non aggiunge informazione.
      Per le prop il riferimento è bet365.it senza margine; se lasci vuoti i campi bet365 si usa la linea americana principale letta da ESPN (al 50%, affidabilità B); per una linea diversa conta la forma della statistica (yard ricevute, di corsa, ricezioni, tentativi: affidabilità A; yard lanciate e college: C).
      Valore pessimistico = con la probabilità al limite basso dell'intervallo. Affidabilità: A errore tipico sotto 3 punti %, B sotto 5, C oltre o con indizi. ${esc(T.fonte || "")}</div></details>`;
  ch.querySelectorAll("[data-modo]").forEach(b => b.addEventListener("click", () => { CH.modo = b.dataset.modo; disegnaCharlie(); }));
  const sp = document.getElementById("chPartita");
  if (sp) sp.addEventListener("change", () => { CH.partita = sp.value; disegnaCharlie(); });
  if (CH.modo === "partite" && document.getElementById("chMercato")) {
    latiPartite();
    document.getElementById("chMercato").addEventListener("change", latiPartite);
  }
  if (document.getElementById("chUSA")) {
    mostraUSA();
    ["chGioc", "chStat"].forEach(i => document.getElementById(i)?.addEventListener("change", mostraUSA));
  }
  document.getElementById("chCalcola")?.addEventListener("click", () => CH.modo === "partite" ? calcolaPartite() : calcolaGiocatori());
  colleghiGiudizio();
  ch.querySelectorAll("[data-parte]").forEach(b => b.addEventListener("click", () => { CH.parte = b.dataset.parte; disegnaCharlie(); }));
  if (document.getElementById("chDifMercato")) {
    latiDifesa();
    document.getElementById("chDifMercato").addEventListener("change", latiDifesa);
    document.getElementById("chCalcolaDif").addEventListener("click", calcolaDifesa);
    colleghiGiudizio();
  }
  if (esitoPrima && document.getElementById("chEsito")) { document.getElementById("chEsito").innerHTML = esitoPrima; colleghiRisultato(); }
  ch.querySelectorAll("[data-togli]").forEach(b => b.addEventListener("click", () => { CH.lista = CH.lista.filter(x => String(x.id) !== b.dataset.togli); disegnaCharlie(true); }));
  ch.querySelectorAll("[data-combo]").forEach(b => b.addEventListener("change", () => { const x = CH.lista.find(y => String(y.id) === b.dataset.combo); if (x) x.combo = b.checked; disegnaCharlie(true); }));
  ["chQuotaCombo", "chPuntataCombo"].forEach(i => document.getElementById(i)?.addEventListener("change", () => disegnaCharlie(true)));
  document.getElementById("chRegistraCombo")?.addEventListener("click", async () => {
    const c = CH.combo; if (!c) return;
    document.getElementById("chMsgCombo").innerHTML = await registra(c.voci, c.v.puntata, c.v.quota);
  });
}

/* ---------- Charlie, modalità Giocatori → Difesa (solo NFL, Protocollo 10) ----------
   Le probabilità le calcola il sito a ogni aggiornamento (sack, intercetti, placcaggi attesi); qui si confrontano
   con la quota bet365, l'unico che quota i difensori. «Prima → adesso» quando una notizia ha spostato il numero. */
const MERCATI_DIF = [["sk", "Realizza un sack (anche mezzo)"], ["in", "Intercetto"], ["tk", "Placcaggi + assist"],
  ["ts", "Placcaggi da solo"], ["ta", "Assist"], ["sq", "Sack di squadra (over/under)"]];
/* Sack di squadra (16/11/2026): Poisson sui sack attesi della difesa (Protocollo 10), con la correzione della prova
   2023-25: oltre 2,2 attesi i veri sono stati il 4% in più, oltre 3,0 il 9% in più. Squadra: almeno 4 nel 23% delle partite. */
function pSackSquadra(lam, linea, lato){
  const l = lam * (lam >= 3 ? 1.09 : lam >= 2.2 ? 1.04 : 1);
  let fin = 0, k = 0, pk = Math.exp(-l);
  const soglia = Math.floor(linea) + 1;                 // over: almeno floor(linea)+1 (linea intera: pari rimborsato)
  for (k = 0; k < soglia; k++) { fin += pk; pk *= l / (k + 1); }
  const pPari = Number.isInteger(linea) ? Math.exp(-l) * Math.pow(l, linea) / [...Array(linea + 1).keys()].slice(1).reduce((a, b) => a * b, 1) : 0;
  const over = 1 - fin, under = fin - pPari;
  return lato === "o" ? over : under;
}
function giocDifesa(g){
  const D = g.difesa || {};
  return [g.ospite, g.casa].flatMap(sq => ((D[sq] || {}).giocatori || []).map(x => ({...x, sq})));
}
function cellaVar(p, prima){
  const ora = pc(p, 0);
  return prima !== undefined && prima !== null ? `<span class="sotto">${pc(prima, 0)} →</span> <b>${ora}</b>` : ora;
}
function formDifesa(g){
  const D = g.difesa || {};
  if (!Object.keys(D).length) return `<div class="vuoto">Per questa partita i difensori non sono ancora calcolati (servono almeno 2 partite giocate da ogni squadra).</div>`;
  const tabella = sq => {
    const d = D[sq]; if (!d) return "";
    const v = d.giocatori.find(x => x.motivo);
    return `<div class="titolo">Difesa ${esc(squadra(g, sq).nome || sq)} <span class="sotto" style="text-transform:none;letter-spacing:0">· sack attesi della squadra ${num(d.sackAttesi, 1)}</span></div>
      ${v ? `<div class="ch-rif">📈 Numeri cambiati: ${esc(v.motivo)}</div>` : ""}
      <table><tr><th style="text-align:left">Difensore</th><th>Sack</th><th>Quota giusta</th><th>Intercetto</th><th>Placcaggi attesi</th></tr>
      ${d.giocatori.map(x => `<tr><td style="text-align:left">${esc(x.n)} <span class="sotto">${esc(x.r)}${x.dubbio ? " · in dubbio" : ""}</span></td>
        <td>${cellaVar(x.sack, x.sackPrima)}</td><td>${x.sack >= 0.02 ? num(1 / x.sack, 2) : "—"}</td>
        <td>${cellaVar(x.int, x.intPrima)}</td><td>${num(x.tk, 1)}</td></tr>`).join("")}</table>`;
  };
  const gioc = giocDifesa(g);
  return `${tabella(g.ospite)}${tabella(g.casa)}
    <div class="sotto" style="margin-top:6px">Sack: almeno 0,5 (regola bet365). Calcolo del duello: ritmo dell'attacco e della difesa, andamento atteso dalla linea americana, quota del giocatore. Intercetti ×1,28 se il QB titolare avversario è fuori. Assenze della linea offensiva: nessun effetto misurabile sui sack. Se il giocatore non gioca, bet365 annulla la giocata.</div>
    <div class="titolo">Confronta con bet365</div>
    <div class="ch-griglia">
      <label class="largo">Difensore<select id="chDif">${gioc.map((x, i) => `<option value="${i}">${esc(x.n)} · ${esc(x.r)} · ${esc(squadra(g, x.sq).nome || x.sq)}</option>`).join("")}</select></label>
      <label>Mercato<select id="chDifMercato">${MERCATI_DIF.map(m => `<option value="${m[0]}">${m[1]}</option>`).join("")}</select></label>
      <label>Giocata<select id="chDifLato"></select></label>
      <label id="chDifLineaL">Linea bet365<input id="chDifLinea" inputmode="decimal" placeholder="es. 5,5"></label>
      <label>Quota bet365<input id="chDifQuota" inputmode="decimal" placeholder="es. 2,75"></label>
      <label>Puntata € (facoltativa)<input id="chDifPuntata" inputmode="decimal"></label>
    </div>
    ${campoGiudizio()}
    <div class="ch-azioni"><button id="chCalcolaDif" class="on">Calcola</button></div><div id="chEsito"></div>`;
}
function latiDifesa(){
  const m = document.getElementById("chDifMercato").value, si = m === "sk" || m === "in";
  const g = partiteCharlie().find(x => idScheda(x) === CH.partita), sel = document.getElementById("chDif");
  if (g && sel) {
    const squadre = m === "sq", ora = sel.options.length && sel.options[0].value.startsWith("T:");
    if (squadre && !ora) sel.innerHTML = [g.ospite, g.casa].filter(sq => (g.difesa || {})[sq]).map(sq =>
      `<option value="T:${esc(sq)}">Difesa ${esc(squadra(g, sq).nome || sq)} · sack attesi ${num(g.difesa[sq].sackAttesi, 1)}</option>`).join("");
    if (!squadre && ora) sel.innerHTML = giocDifesa(g).map((x, i) => `<option value="${i}">${esc(x.n)} · ${esc(x.r)} · ${esc(squadra(g, x.sq).nome || x.sq)}</option>`).join("");
  }
  document.getElementById("chDifLato").innerHTML = si ? `<option value="s">Sì</option>` : `<option value="o">Over</option><option value="u">Under</option>`;
  document.getElementById("chDifLineaL").style.display = si ? "none" : "";
}
function calcolaDifesa(){
  const g = partiteCharlie().find(x => idScheda(x) === CH.partita), out = document.getElementById("chEsito");
  const m = document.getElementById("chDifMercato").value, lato = document.getElementById("chDifLato").value;
  const quota = numero(document.getElementById("chDifQuota").value);
  if (m === "sq") {
    const sq = String(document.getElementById("chDif").value).slice(2), d = (g.difesa || {})[sq];
    const linea = numero(document.getElementById("chDifLinea").value);
    if (!d || !d.sackAttesi) { out.innerHTML = `<div class="errore">Per questa difesa non ci sono i sack attesi.</div>`; return; }
    if (linea === null || !quota || quota <= 1) { out.innerHTML = `<div class="errore">Inserisci la linea dei sack (es. 3,5) e la quota bet365.</div>`; return; }
    const p = pSackSquadra(d.sackAttesi, linea, lato);
    const a = pSackSquadra(d.sackAttesi * 0.9, linea, lato), b = pSackSquadra(d.sackAttesi * 1.1, linea, lato);
    const nome = squadra(g, sq).nome || sq;
    const r = {p, pLo: Math.max(0.005, Math.min(a, b)), pHi: Math.min(0.99, Math.max(a, b)), aff: "B",
               usati: [`sack attesi della difesa ${nome}: ${num(d.sackAttesi, 2)} (ritmo dell'attacco avversario, della difesa e linea americana)`,
                       "conteggio di Poisson con la correzione della prova 2023-25 (+4% oltre 2,2 attesi, +9% oltre 3,0); intervallo con ±10% sugli attesi",
                       "la forma recente del QB non aggiunge niente (misurata): è già nella media della stagione"]};
    const v = valuta(r, quota, numero(document.getElementById("chDifPuntata").value));
    const codice = ["P", "N", (g.mercato || {}).espnId || "0", sq, "sq", lato, codNum(linea, 10), codNum(quota, 100), "b3",
      codNum(v.puntata || 0, 100), codNum(v.p, 1000), "0"].join("_");
    mostraRisultato({breve: `Sack ${nome} ${lato === "o" ? "over" : "under"} ${num(linea, 1)} · ${nomeP(g)}`, v, libro: "b3", partita: idScheda(g), codice});
    return;
  }
  const x = giocDifesa(g)[Number(document.getElementById("chDif").value)];
  if (!x || !quota || quota <= 1) { out.innerHTML = `<div class="errore">Scegli il difensore e inserisci la quota bet365.</div>`; return; }
  const T = ((tabCharlie() || {}).difesa) || {};
  let p, larg, linea = 0, testo;
  if (m === "sk" || m === "in") {
    p = m === "sk" ? x.sack : x.int;
    larg = m === "sk" ? Math.max(0.03, p * 0.12) : Math.max(0.015, p * 0.15);
    testo = `${x.n} ${m === "sk" ? "realizza un sack" : "intercetto"} · ${nomeP(g)}`;
  } else {
    linea = numero(document.getElementById("chDifLinea").value);
    if (linea === null) { out.innerHTML = `<div class="errore">Inserisci la linea dei placcaggi.</div>`; return; }
    const tipo = {tk: "totali", ts: "solo", ta: "assist"}[m], atteso = {tk: x.tk, ts: x.so, ta: x.as}[m];
    const f = (T.placcaggi || {})[tipo];
    if (!f || !atteso) { out.innerHTML = `<div class="errore">Per questo giocatore non c'è un atteso dei placcaggi.</div>`; return; }
    const q = f.rapporti[Math.min(f.rapporti.length - 1, fasciaDi(f.fasce, atteso))];
    const pOver = 1 - cdfQ(q, linea / atteso);
    p = lato === "o" ? pOver : 1 - pOver;
    larg = 0.035;
    testo = `${x.n} ${lato === "o" ? "over" : "under"} ${num(linea, 1)} ${(MERCATI_DIF.find(z => z[0] === m) || ["", ""])[1].toLowerCase()} (attesi ${num(atteso, 1)}) · ${nomeP(g)}`;
  }
  const r = {p, pLo: Math.max(0.005, p - larg), pHi: Math.min(0.99, p + larg), aff: "B",
             usati: [x.motivo ? "numeri cambiati: " + x.motivo : "", x.dubbio ? "in dubbio: se non gioca bet365 annulla la giocata" : "",
                     "probabilità del duello (Protocollo 10), tarata sullo storico; il confronto con bet365 lo dirà il registro"].filter(Boolean)};
  const v = valuta(r, quota, numero(document.getElementById("chDifPuntata").value));
  const codice = ["P", "N", (g.mercato || {}).espnId || "0", x.id, m, lato, codNum(linea, 10), codNum(quota, 100), "b3",
    codNum(v.puntata || 0, 100), codNum(v.p, 1000), "0"].join("_");
  mostraRisultato({breve: testo, v, libro: "b3", partita: idScheda(g), codice});
}
