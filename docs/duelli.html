<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PureStats · Matchup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Archivo:wght@600;800&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /* Stessa palette della sezione NFL di index.html (variabili --fb-*) */
  :root{
    --fb-bg:#E9EDF2; --fb-card:#FFFFFF; --fb-border:#CDD4DE; --fb-text:#111827; --fb-muted:#4B5563;
    --fb-acc:#B91C1C; --fb-acc-text:#FFFFFF; --fb-chip:#EEF0F3; --fb-chiptext:#374151;
    --fb-head:'Archivo',sans-serif;
    --buono-bg:#DCFCE7; --buono:#166534; --scarso-bg:#FEE2E2; --scarso:#991B1B;
    --att:#B91C1C; --dif:#1F2937;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --fb-bg:#0B0F1A; --fb-card:#131A2B; --fb-border:#232C42; --fb-text:#F5F7FB; --fb-muted:#A3ADC2;
      --fb-acc:#FF8A3D; --fb-acc-text:#1A0E05; --fb-chip:#1F2840; --fb-chiptext:#C9D1E3;
      --fb-head:'Barlow Condensed',sans-serif;
      --buono-bg:#14361F; --buono:#86EFAC; --scarso-bg:#3B1518; --scarso:#FCA5A5;
      --att:#E0552B; --dif:#3B4A6B;
      color-scheme:dark;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--fb-bg);color:var(--fb-text);font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.5}
  .pagina{max-width:820px;margin:0 auto;padding:16px 14px 48px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .marchio{display:block;font-family:var(--fb-head);font-weight:800;font-size:28px;letter-spacing:.03em;line-height:1;color:inherit;text-decoration:none}
  .marchio b{color:var(--fb-acc);font-weight:inherit}
  .sotto{font-size:13px;color:var(--fb-muted)}
  button,.bottone{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--fb-border);background:var(--fb-card);color:var(--fb-text);padding:8px 14px;min-height:40px;text-decoration:none;display:inline-flex;align-items:center}
  button.on{background:var(--fb-acc);color:var(--fb-acc-text);border-color:var(--fb-acc)}
  .scheda{background:var(--fb-card);border:1px solid var(--fb-border);border-radius:14px;padding:16px;margin-bottom:14px}
  .accesso{max-width:380px;margin:12vh auto 0}
  .accesso input{width:100%;font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--fb-border);background:var(--fb-bg);color:var(--fb-text);min-height:44px;margin:10px 0}
  .errore{color:var(--scarso);font-size:13px;min-height:20px}
  .barra{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
  .barra input[type=search]{flex:1;min-width:160px;font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--fb-border);background:var(--fb-card);color:var(--fb-text);min-height:40px}
  .barra label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--fb-muted)}
  .riepilogo{font-size:13px;color:var(--fb-muted);margin:-4px 0 12px}

  /* testa della partita */
  .testa{display:flex;align-items:center;gap:10px}
  .testa .nomi{font-family:var(--fb-head);font-weight:800;font-size:21px;line-height:1.1;flex:1;min-width:0}
  .quando{font-size:12px;color:var(--fb-muted);white-space:nowrap}
  .lg{width:32px;height:32px;object-fit:contain;flex:none}
  .lg.s{width:22px;height:22px}
  .lg.m{width:28px;height:28px}
  .bd{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex:none}
  .bd.s{width:22px;height:22px;font-size:8px}
  .bd.m{width:28px;height:28px;font-size:9px}

  /* indici */
  .indici{display:flex;gap:10px;margin:12px 0 4px}
  .indici>div{flex:1;background:var(--fb-chip);border-radius:10px;padding:8px 10px;display:flex;align-items:center;gap:10px}
  .indici .n{font-size:22px;font-weight:700;line-height:1}
  .indici .e{font-size:11px;color:var(--fb-muted)}

  /* duelli in evidenza: il cuore della scheda */
  .titolo{font-family:var(--fb-head);font-weight:800;font-size:15px;letter-spacing:.04em;text-transform:uppercase;margin:16px 0 8px}
  .duello{border:1px solid var(--fb-border);border-radius:12px;overflow:hidden;margin-bottom:10px}
  .duello .lati{display:grid;grid-template-columns:minmax(0,1fr) 34px minmax(0,1fr);align-items:stretch;margin-top:6px}
  .lato{padding:10px;display:flex;gap:8px;align-items:center;min-width:0}
  .lato.d{justify-content:flex-end;text-align:right}
  .lato .chi{font-size:14px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
  .lato .val{font-size:12px;line-height:1.3;opacity:.9}
  .lato .num{font-size:20px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
  .lato.vince{color:#fff}
  .lato.vince .su,.lato.vince .giu{color:#fff}
  .cosa{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fb-muted);padding:6px 10px 0}
  .duello.gioc{border-width:2px;border-color:var(--fb-acc)}
  .tondo{display:inline-flex;background:#fff;border-radius:50%;padding:3px;flex:none}
  .vs{display:flex;align-items:center;justify-content:center;font-family:var(--fb-head);font-weight:800;font-size:13px;color:var(--fb-muted)}
  .esito{font-size:12px;font-weight:700;padding:5px 10px;color:#fff;letter-spacing:.02em}
  .esito.attacco{background:var(--att)} .esito.difesa{background:var(--dif)}
  .nessuno{font-size:13px;color:var(--fb-muted);padding:8px 0}

  details{margin-top:10px;border-top:1px solid var(--fb-border);padding-top:6px}
  details.scheda{border-top:1px solid var(--fb-border)}
  summary{cursor:pointer;font-size:14px;font-weight:600;min-height:36px;display:flex;align-items:center}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td,th{padding:7px 4px;border-top:1px solid var(--fb-border);text-align:center;vertical-align:middle}
  th{font-size:11px;font-weight:600;color:var(--fb-muted)}
  td:first-child,th:first-child{text-align:left}
  tr.segnale td{background:var(--fb-chip)}
  .rk{display:inline-block;min-width:38px;text-align:center;font-weight:700;border-radius:6px;padding:2px 4px;font-variant-numeric:tabular-nums;background:var(--fb-chip)}
  .rk.buono{background:var(--buono-bg);color:var(--buono)}
  .rk.scarso{background:var(--scarso-bg);color:var(--scarso)}
  .su{color:var(--buono);font-weight:700} .giu{color:var(--scarso);font-weight:700}
  .blocco{display:flex;align-items:center;gap:8px;margin:12px 0 4px;font-size:14px;font-weight:600}
  .riga,.int{display:grid;grid-template-columns:minmax(0,1fr) 46px 46px 112px;gap:6px;align-items:center}
  .int{font-size:11px;color:var(--fb-muted)}
  .riga{padding:7px 0;border-top:1px solid var(--fb-border);font-size:13px}
  .chiv{font-size:12px;text-align:right}
  .legenda{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--fb-muted);margin-top:10px}
  .legenda .rk{min-width:0;padding:1px 6px}
  .vuoto{color:var(--fb-muted);text-align:center;padding:24px}
  .giocatori{display:grid;grid-template-columns:1fr;gap:4px 18px}
  @media (min-width:760px){ .giocatori{grid-template-columns:1fr 1fr} }
  .migliori{border:2px solid var(--fb-acc)}
  .atteso{text-align:center;margin:0 0 10px;padding:10px;border:1px solid var(--fb-border);border-radius:12px}
  .atteso .ris{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;font-size:17px;margin:4px 0}
  .atteso .ris b{font-family:var(--fb-head);font-size:26px}
  .atteso .ris span{display:inline-flex;align-items:center;gap:6px}
  .atteso .trat{color:var(--fb-muted)}
  .pct{font-size:13px;margin-top:4px}
  .pct b{font-family:var(--fb-head);font-size:18px}
  .fz2{opacity:.75;font-size:11px}
  .giudizio{margin:12px 0 0;padding:10px 12px;border-left:3px solid var(--fb-acc);background:color-mix(in srgb, var(--fb-acc) 7%, transparent);font-size:14.5px;line-height:1.5}
  .top{width:100%;display:flex;gap:10px;align-items:center;text-align:left;margin-top:8px;padding:10px;line-height:1.35;font-size:14px}
  .top .pos{font-family:var(--fb-head);font-weight:800;font-size:24px;color:var(--fb-acc);min-width:22px}
  .top .fz{font-size:11px;color:var(--fb-muted);text-align:center;white-space:nowrap}
  .top .fz b{font-size:16px;color:var(--fb-text)}
  .chip{display:inline-block;font-size:11px;font-weight:600;background:var(--fb-chip);color:var(--fb-chiptext);border-radius:6px;padding:1px 7px;margin-right:4px}
  .partita>div{display:block}
  .partita .n{font-size:18px}
  .su-in-cima{position:fixed;right:16px;bottom:20px;width:48px;height:48px;border-radius:50%;justify-content:center;
    background:var(--fb-acc);color:var(--fb-acc-text);border:0;font-size:22px;font-weight:700;opacity:0;pointer-events:none;
    transition:opacity .2s;box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:10}
  .su-in-cima.visibile{opacity:1;pointer-events:auto}
  footer{font-size:12px;color:var(--fb-muted);text-align:center;margin-top:20px}
  @media (max-width:420px){ .riga,.int{grid-template-columns:minmax(0,1fr) 40px 40px 96px} .testa .nomi{font-size:18px} .lato .num{font-size:18px} }
</style>
</head>
<body>
<div class="pagina">
  <header>
    <div>
      <a class="marchio" href="./" title="Torna a PureStats">PURE<b>STATS</b></a>
      <div class="sotto">Matchup · partite, vantaggi e giocatori · area privata</div>
    </div>
    <div style="display:flex;gap:8px">
      <a class="bottone" href="./">← Sito</a>
      <button id="esci" hidden>Esci</button>
    </div>
  </header>

  <form class="scheda accesso" id="accesso" action="#" method="post">
    <div style="font-weight:600">Inserisci la password</div>
    <!-- campo utente nascosto: serve al browser per proporre di salvare la password -->
    <input type="text" name="username" id="utente" autocomplete="username" value="purestats" hidden>
    <input type="password" name="password" id="password" autocomplete="current-password" aria-label="Password">
    <div class="errore" id="errore" role="alert"></div>
    <button type="submit" class="on" style="width:100%;justify-content:center">Entra</button>
  </form>

  <main id="contenuto" hidden>
    <div class="barra">
      <button data-camp="NFL" class="on">NFL</button>
      <button data-camp="College">College</button>
      <input type="search" id="cerca" placeholder="Cerca squadra" aria-label="Cerca squadra">
      <label><input type="checkbox" id="soloSegnali"> solo con vantaggi</label>
    </div>
    <div class="riepilogo" id="riepilogo"></div>
    <div id="migliori"></div>
    <div id="elenco"></div>
    <div id="pannelli"></div>
    <footer id="piede"></footer>
  </main>
  <button class="su-in-cima" id="suInCima" aria-label="Torna in cima" title="Torna in cima">↑</button>
</div>

<script>
/* Dati cifrati da scripts/fetch_duelli.py (un file per campionato): qui si rifanno gli stessi passaggi
   con WebCrypto. Nessun localStorage: la password resta nel gestore password del browser, se lo scegli. */
const AREE = {corse:"Corse", passaggi:"Passaggi", pressione:"Protezione QB", esplosive:"Giocate lunghe"};
const REPARTO_DIFESA = {corse:"difesa corse", passaggi:"difesa passaggi", pressione:"pressione sul QB", esplosive:"difesa giocate lunghe"};
const ORDINE_AREE = ["corse","passaggi","pressione","esplosive"];
const MAX_EVIDENZA = 5;
const DATI = {};
let CAMPIONATO = "NFL";

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const unisci = (...parti) => { const n = parti.reduce((t, p) => t + p.length, 0), o = new Uint8Array(n); let i = 0; for (const p of parti) { o.set(p, i); i += p.length; } return o; };

async function decifra(pacchetto, password){
  const sub = crypto.subtle;
  const base = await sub.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
  const chiave = new Uint8Array(await sub.deriveBits({name:"PBKDF2", hash:"SHA-256", salt:b64(pacchetto.sale), iterations:pacchetto.iterazioni}, base, 512));
  const kCif = chiave.slice(0, 32), kMac = chiave.slice(32);
  const nonce = b64(pacchetto.nonce), cifrato = b64(pacchetto.dati);
  const km = await sub.importKey("raw", kMac, {name:"HMAC", hash:"SHA-256"}, false, ["verify"]);
  if (!await sub.verify("HMAC", km, b64(pacchetto.mac), unisci(nonce, cifrato))) throw new Error("password");
  const blocchi = Math.ceil(cifrato.length / 32), richieste = [];
  for (let i = 0; i < blocchi; i++) {
    const c = new Uint8Array([i >>> 24 & 255, i >>> 16 & 255, i >>> 8 & 255, i & 255]);
    richieste.push(sub.digest("SHA-256", unisci(kCif, nonce, c)));
  }
  const flusso = unisci(...(await Promise.all(richieste)).map(x => new Uint8Array(x)));
  return JSON.parse(new TextDecoder().decode(cifrato.map((b, i) => b ^ flusso[i])));
}

async function scarica(lega, pw){
  const r = await fetch(`duelli_${lega}.dat?` + Date.now(), {cache:"no-store"});
  if (r.status === 404) return null;            // campionato non ancora calcolato
  if (!r.ok) throw new Error("file");
  return decifra(await r.json(), pw);
}

document.getElementById("accesso").addEventListener("submit", async ev => {
  ev.preventDefault();
  const err = document.getElementById("errore"), pw = document.getElementById("password").value;
  if (!pw) { err.textContent = "Scrivi la password."; return; }
  err.textContent = "Apro i dati…";
  try {
    if (!window.crypto || !crypto.subtle) throw new Error("browser");
    const [nfl, college] = await Promise.all([scarica("nfl", pw), scarica("college", pw)]);
    if (!nfl && !college) throw new Error("file");
    if (nfl) DATI.NFL = nfl;
    if (college) DATI.College = college;
  } catch (e) {
    err.textContent = e.message === "password" ? "Password sbagliata." :
      e.message === "browser" ? "Questo browser non supporta la decifratura: apri la pagina in https." :
      "Non riesco a scaricare i dati. Riprova tra poco.";
    return;
  }
  // Chrome e Android: proposta esplicita di salvare la password (gli altri browser lo fanno dal modulo)
  try { if (window.PasswordCredential) await navigator.credentials.store(new PasswordCredential({id:"purestats", password:pw, name:"PureStats Matchup"})); } catch (e) {}
  document.getElementById("password").value = "";
  document.getElementById("accesso").hidden = true;
  document.getElementById("contenuto").hidden = false;
  document.getElementById("esci").hidden = false;
  if (location.hash === "#College") CAMPIONATO = "College";
  if (!DATI[CAMPIONATO]) CAMPIONATO = DATI.NFL ? "NFL" : "College";
  disegna();
});
document.getElementById("password").addEventListener("input", () => document.getElementById("errore").textContent = "");
document.getElementById("esci").addEventListener("click", () => location.reload());
document.querySelectorAll("[data-camp]").forEach(b => b.addEventListener("click", () => { CAMPIONATO = b.dataset.camp; disegna(); }));
document.getElementById("soloSegnali").addEventListener("change", disegna);
document.getElementById("cerca").addEventListener("input", disegna);
/* Tasto per tornare in cima: compare dopo un po' di scorrimento */
const suInCima = document.getElementById("suInCima");
addEventListener("scroll", () => suInCima.classList.toggle("visibile", scrollY > 600), {passive: true});
suInCima.addEventListener("click", () => scrollTo({top: 0, behavior: "smooth"}));

/* ---------- utilità ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = (v, d = 0) => v === null || v === undefined ? "—" : Number(v).toLocaleString("it-IT", {minimumFractionDigits:d, maximumFractionDigits:d});
const segno = (v, d) => v === null || v === undefined ? "—" : (v > 0 ? "+" : v < 0 ? "−" : "") + num(Math.abs(v), d);
const scuro = () => matchMedia("(prefers-color-scheme: dark)").matches;
const valido = h => /^#[0-9a-f]{6}$/i.test(h || "");
const fondo = hex => valido(hex) ? hex : "#555555";
function coloreTesto(hex){
  if (!valido(hex)) return "var(--fb-text)";
  if (!scuro()) return hex;
  const n = [1,3,5].map(i => parseInt(hex.substr(i, 2), 16));
  return "rgb(" + n.map(v => Math.round(v + (255 - v) * .55)).join(",") + ")";
}
/* fondo del lato che vince il duello: colore della squadra, appena schiarito in modalità scura */
function fondoVince(hex){
  if (!valido(hex)) return "var(--att)";
  if (!scuro()) return hex;
  const n = [1,3,5].map(i => parseInt(hex.substr(i, 2), 16));
  return "rgb(" + n.map(v => Math.round(v + (255 - v) * .18)).join(",") + ")";
}
function squadra(g, sigla){
  const casa = sigla === g.casa;
  return {sigla, nome: casa ? g.nomeCasa : g.nomeOspite, logo: casa ? g.logoCasa : g.logoOspite, colore: casa ? g.coloreCasa : g.coloreOspite};
}
function stemma(t, taglia){
  const cl = taglia ? " " + taglia : "";
  const cerchio = `<span class="bd${cl}" style="background:${fondo(t.colore)}" aria-hidden="true">${esc(String(t.sigla).slice(0, 4).toUpperCase())}</span>`;
  if (/^https:\/\//.test(t.logo || "")) return `<img class="lg${cl}" src="${esc(t.logo)}" alt="${esc(t.nome)}" loading="lazy" data-ripiego="${esc(cerchio)}" onerror="ripiego(this)">`;
  return cerchio;
}
/* Logo non raggiungibile: al suo posto il cerchio con colore e sigla, come in index.html */
function ripiego(img){ img.insertAdjacentHTML("afterend", img.dataset.ripiego); img.remove(); }
const classeRank = (r, n) => r <= Math.round(n * 10 / 32) ? "buono" : r >= n - Math.round(n * 11 / 32) + 1 ? "scarso" : "";
const freccia = f => f === "in forma" ? '<span class="su">▲</span>' : f === "in calo" ? '<span class="giu">▼</span>' : "";

/* Le partite già cominciate spariscono subito, senza aspettare il prossimo aggiornamento dei dati.
   Data e ora sono italiane; senza ora la partita resta visibile fino alla fine del suo giorno. */
function iniziata(g){
  if (!g.data) return false;
  const ora = new Intl.DateTimeFormat("sv-SE", {timeZone:"Europe/Rome", year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", hour12:false}).format(new Date()).replace(" ", "T");
  return g.ora ? `${g.data}T${g.ora}` <= ora : g.data < ora.slice(0, 10);
}
function quando(g){
  if (!g.data) return "";
  const d = new Date(g.data + "T12:00:00");
  return d.toLocaleDateString("it-IT", {weekday:"short", day:"2-digit", month:"2-digit"}) + (g.ora ? " " + g.ora : "");
}

/* ---------- vantaggio in evidenza: due lati e un VS; il lato avvantaggiato prende il colore della sua squadra.
   Il vantaggio viene sempre dalla difesa che si trova davanti (la parte verificata sullo storico). ---------- */
const segnoNum = (v, d = 1) => (v > 0 ? "+" : v < 0 ? "−" : "") + num(Math.abs(v), d);
function duelloEvidenza(g, T, s){
  let sx, dx, cosa, testo;
  if (s.tipo === "giocatore") {
    const att = T[s.squadra], dif = T[s.difesa];
    cosa = `${esc(s.ruolo)} · ${esc(s.misura || "")}`;
    sx = {t: att, num: `${num(s.previsione)} yd`, chi: esc(s.nome), val: `previste · media ${num(s.media)}`};
    dx = {t: dif, num: `${s.rangoDifesa}ª`, chi: esc(dif.nome), val: `${REPARTO_DIFESA[s.areaDifesa] || "difesa"} su ${s.n}`};
    const pct = s.pct ? ` · storico: ${s.pct}% delle volte ${s.verso === "attacco" ? "sopra" : "sotto"} la sua media` : "";
    testo = s.verso === "attacco"
      ? `Vantaggio attacco · ${segnoNum(s.effetto)} yard per la difesa tra le peggiori${pct}`
      : `Vantaggio difesa · ${segnoNum(s.effetto)} yard per la difesa tra le migliori${pct}`;
  } else {
    const att = T[s.att], dif = T[s.dif];
    cosa = AREE[s.area];
    sx = {t: att, num: `${s.ra}°`, chi: esc(att.nome), val: "attacco"};
    dx = {t: dif, num: `${s.rd}ª`, chi: esc(dif.nome), val: `difesa su ${s.n}`};
    testo = s.verso === "attacco" ? `Vantaggio attacco ${esc(att.nome)} · difesa tra le peggiori` : `Vantaggio difesa ${esc(dif.nome)} · tra le migliori`;
  }
  const vinceSx = s.verso === "attacco";
  const lato = (x, destra, v) => `<div class="lato${destra ? " d" : ""}${v ? " vince" : ""}" style="${v ? `background:${fondoVince(x.t.colore)}` : ""}">
      ${destra ? "" : `<span class="tondo">${stemma(x.t, "m")}</span>`}<div style="min-width:0"><div class="num">${x.num}</div><div class="chi">${x.chi}</div><div class="val">${x.val}</div></div>${destra ? `<span class="tondo">${stemma(x.t, "m")}</span>` : ""}</div>`;
  return `<div class="duello${s.tipo === "giocatore" ? " gioc" : ""}"><div class="cosa">${cosa}</div><div class="lati">${lato(sx, false, vinceSx)}<div class="vs">VS</div>${lato(dx, true, !vinceSx)}</div><div class="esito ${s.verso}">${testo}</div></div>`;
}

/* margine e totale attesi per effetto delle due difese, in punti tarati sullo storico */
function bloccoPartita(g, T){
  const P = g.partita;
  if (!P) return "";
  const favorita = P.margine >= 0 ? g.casa : g.ospite;
  const tile = (titolo, valore, sotto, forza, pct, liv, dove) => `<div><div class="e">${titolo}</div><div class="n">${valore}</div><div class="e">${sotto}</div>${pct ? `<div class="pct"><b>${pct}%</b> delle volte ${dove} · ${liv}</div>` : ""}<div class="e fz2">forza ${num(forza, 2)}</div></div>`;
  const atteso = P.attesoCasa !== undefined && P.attesoCasa !== null ? `<div class="atteso">
    <div class="e">Punteggio atteso dai numeri</div>
    <div class="ris"><span>${stemma(T[g.ospite], "s")} ${esc(T[g.ospite].nome)} <b>${Math.round(P.attesoOspite)}</b></span><span class="trat">–</span><span><b>${Math.round(P.attesoCasa)}</b> ${esc(T[g.casa].nome)} ${stemma(T[g.casa], "s")}</span></div>
    <div class="e">di solito segnano ${num(P.normaOspite, 1)} e ${num(P.normaCasa, 1)} · più l'effetto delle difese · senza vantaggio del campo</div></div>` : "";
  return atteso + `<div class="indici partita">
    ${tile("Totale", segnoNum(P.totale) + " pt", P.totale >= 0 ? "difese che concedono" : "difese che chiudono", P.forzaTotale,
           Math.abs(P.totale) < 0.5 ? null : P.pctTotale, P.livelloTotale, P.totale >= 0 ? "sopra la norma" : "sotto la norma")}
    ${tile("Margine", Math.abs(P.margine) < 0.5 ? "equilibrio" : `${esc(T[favorita].nome)} +${num(Math.abs(P.margine), 1)}`, "rispetto alla norma", P.forzaMargine,
           Math.abs(P.margine) < 0.5 ? null : P.pctMargine, P.livelloMargine, `da quella parte`)}
  </div>`;
}

function tabellaGiocatori(g, T){
  const righe = lista => (lista || []).map(p => `<tr${p.vantaggio ? ' class="segnale"' : ""}>
    <td><b>${esc(p.nome)}</b> <span class="sotto">${esc(p.ruolo || "")}</span></td>
    <td>${num(p.mediaStagione)}</td><td>${num(p.mediaUltime3)} ${freccia(p.forma)}</td>
    <td>${p.previsione !== null && p.previsione !== undefined ? `<b>${num(p.previsione)}</b> <span class="sotto">±${p.errore}</span>` : "—"}</td>
    <td>${p.rangoDifesa ? `<span class="rk ${classeRank(p.rangoDifesa, p.squadreTotali)}">${p.rangoDifesa}ª</span>` : "—"}</td></tr>`).join("");
  const blocco = (lista, sq) => (lista || []).length ? `<div><div class="blocco">${stemma(T[sq], "s")}${esc(T[sq].nome)}</div>
    <table><tr><th>Giocatore</th><th>media</th><th>ultime 3</th><th>previsione</th><th>difesa avv.</th></tr>${righe(lista)}</table></div>` : "";
  const h = blocco(g.giocatoriOspite, g.ospite) + blocco(g.giocatoriCasa, g.casa);
  return h ? `<details><summary>Giocatori chiave</summary><div class="giocatori">${h}</div>
    <div class="legenda"><span>previsione = media della stagione + effetto della difesa che trova; ± = errore medio</span><span><span class="su">▲</span><span class="giu">▼</span> forma delle ultime 3: di solito si torna alla media, non è un segnale</span></div></details>` : "";
}

function tabellone(g, T){
  let h = `<details><summary>Tabellone reparti</summary>`;
  for (const [a, d] of [[g.ospite, g.casa], [g.casa, g.ospite]]) {
    h += `<div class="blocco">${stemma(T[a], "s")}Attaccano i ${esc(T[a].nome)}</div><div class="int"><span></span><span style="text-align:center">att.</span><span style="text-align:center">dif.</span><span style="text-align:right">vantaggio</span></div>`;
    for (const area of ORDINE_AREE) {
      const x = (g.reparti || []).find(y => y.area === area && y.att === a);
      if (!x) continue;
      const w = x.verso === "attacco" ? a : d;
      const chi = !x.verso ? `<span style="color:var(--fb-muted)">equilibrio</span>`
        : `<span style="color:${coloreTesto(T[w].colore)};font-weight:700">${x.verso === "attacco" ? "attacco" : "difesa"} ${esc(T[w].nome)}</span>`;
      h += `<div class="riga"><span>${AREE[area]}</span><span class="rk ${classeRank(x.ra, x.n)}">${x.ra}°</span><span class="rk ${classeRank(x.rd, x.n)}">${x.rd}ª</span><span class="chiv">${chi}</span></div>`;
    }
  }
  const n = ((g.reparti || [])[0] || {}).n || 32, q = Math.round(n * 10 / 32);
  return h + `<div class="legenda"><span><span class="rk buono">1–${q}</span> tra i migliori</span><span><span class="rk scarso">${n - Math.round(n * 11 / 32) + 1}–${n}</span> tra i peggiori</span><span>su ${n} squadre · il vantaggio dipende dalla difesa</span></div></details>`;
}

function idScheda(g){ return "p-" + String(g.ospite + "-" + g.casa + "-" + g.data).replace(/[^A-Za-z0-9-]/g, ""); }

function scheda(g){
  const T = {[g.casa]: squadra(g, g.casa), [g.ospite]: squadra(g, g.ospite)};
  const dec = g.campionato === "NFL" ? 3 : 1;
  const tile = sq => { const i = sq === g.casa ? g.indiceCasa : g.indiceOspite;
    return `<div>${stemma(T[sq])}<div><div class="n" style="color:${coloreTesto(T[sq].colore)}">${i && i.posizione ? i.posizione + "°" : "—"}</div><div class="e">indice ${i ? segno(i.netto, dec) : "—"}</div></div></div>`; };
  const evid = (g.vantaggi || []).slice(0, MAX_EVIDENZA);
  return `<article class="scheda" id="${idScheda(g)}">
    <div class="testa">${stemma(T[g.ospite], "s")}<div class="nomi">${esc(T[g.ospite].nome)} @ ${esc(T[g.casa].nome)}</div>${stemma(T[g.casa], "s")}<span class="quando">${esc(quando(g))}</span></div>
    <div class="indici">${tile(g.ospite)}${tile(g.casa)}</div>
    ${g.giudizio ? `<p class="giudizio">${esc(g.giudizio)}</p>` : ""}
    <div class="titolo">Partita: effetto delle difese</div>
    ${bloccoPartita(g, T)}
    <div class="titolo">Vantaggi in evidenza</div>
    ${evid.length ? evid.map(s => duelloEvidenza(g, T, s)).join("") : `<div class="nessuno">Nessuna difesa agli estremi: partita in equilibrio sui dati.</div>`}
    ${(g.vantaggi || []).length > MAX_EVIDENZA ? `<div class="sotto">Altri ${g.vantaggi.length - MAX_EVIDENZA} vantaggi nel tabellone e nei giocatori qui sotto.</div>` : ""}
    ${tabellaGiocatori(g, T)}
    ${tabellone(g, T)}
  </article>`;
}

/* ---------- i 3 migliori: NFL e college insieme, giocatori, handicap e totali, per forza ---------- */
/* Percentuali misurate (le stesse di fetch_duelli.py): servono solo se un file è di una versione precedente
   e non le contiene ancora, così una lega non sparisce dalla classifica mentre l'altra è già aggiornata. */
const SCALA = {NFL: {totale: [0.10, 0.20], margine: [0.07, 0.14]}, College: {totale: [0.20, 0.43], margine: [0.22, 0.45]}};
const PCT = {NFL: {totale: [50, 57, 63], margine: [56, 56, 56]}, College: {totale: [57, 63, 73], margine: [56, 61, 73]}};
function pctPartita(camp, tipo, P){
  const v = tipo === "totale" ? P.totale : P.margine;
  if (Math.abs(v) < 0.5) return 0;
  const dato = tipo === "totale" ? P.pctTotale : P.pctMargine;
  if (dato) return dato;
  const f = tipo === "totale" ? P.forzaTotale : P.forzaMargine, [b, a] = (SCALA[camp] || SCALA.NFL)[tipo];
  return (PCT[camp] || PCT.NFL)[tipo][f < b ? 0 : f < a ? 1 : 2];
}
const PCT_G = {NFL: {QB: [52, 53], RB: [51, 61], WR: [43, 60], TE: [48, 61]},
               College: {QB: [51, 59], RB: [54, 60], WR: [45, 61], TE: [45, 67]}};
const pctGiocatore = (camp, v) => v.pct || (((PCT_G[camp] || PCT_G.NFL)[v.ruolo === "RIC" ? "WR" : v.ruolo] || [0, 0])[v.verso === "attacco" ? 0 : 1]);
function candidati(){
  const out = [];
  for (const camp of ["NFL", "College"]) {
    const D = DATI[camp];
    if (!D) continue;
    for (const g of D.partite) {
      if (iniziata(g)) continue;
      const T = {[g.casa]: squadra(g, g.casa), [g.ospite]: squadra(g, g.ospite)};
      const P = g.partita;
      if (P) {
        out.push({camp, g, tipo: "Totale", forza: P.forzaTotale, pct: pctPartita(camp, "totale", P), testo: `${esc(T[g.ospite].nome)} @ ${esc(T[g.casa].nome)}: totale ${segnoNum(P.totale)} punti rispetto alla norma delle due squadre`});
        const fav = P.margine >= 0 ? g.casa : g.ospite;
        out.push({camp, g, tipo: "Handicap", forza: P.forzaMargine, pct: pctPartita(camp, "margine", P), testo: `${esc(T[g.ospite].nome)} @ ${esc(T[g.casa].nome)}: ${esc(T[fav].nome)} +${num(Math.abs(P.margine), 1)} punti di margine rispetto alla norma`});
      }
      for (const v of g.vantaggi || []) {
        if (v.tipo !== "giocatore") continue;
        out.push({camp, g, tipo: "Giocatore", forza: v.forza, pct: pctGiocatore(camp, v), testo: `${esc(v.nome)} (${esc(v.ruolo)}, ${esc(T[v.squadra].nome)}): ${num(v.previsione)} ${esc(v.misura || "yard")} previste, media ${num(v.media)}, ${segnoNum(v.effetto)} contro la ${v.rangoDifesa}ª ${REPARTO_DIFESA[v.areaDifesa] || "difesa"}`});
      }
    }
  }
  // prima quanto spesso, nello storico, finisce dalla parte indicata; a parità, lo sbilanciamento più netto
  return out.sort((a, b) => (b.pct - a.pct) || (b.forza - a.forza));
}
function migliori(){
  // i 3 si scelgono per percentuale storica, poi si mostrano in ordine di orario
  const top = candidati().slice(0, 3).sort((a, b) => ((a.g.data || "") + (a.g.ora || "99")).localeCompare((b.g.data || "") + (b.g.ora || "99")));
  if (!top.length) return "";
  return `<section class="scheda migliori"><div class="titolo" style="margin-top:0">Le 3 partite più sbilanciate</div>
    <div class="sotto" style="margin-bottom:8px">NFL e college insieme, tra giocatori, handicap e totali: i 3 che nello storico 2019–2025 sono finiti più spesso dalla parte indicata, in ordine di orario.</div>
    ${top.map((c, i) => `<button class="top" data-camp-top="${c.camp}" data-id="${idScheda(c.g)}"><span class="pos">${i + 1}</span>
      <span style="flex:1;min-width:0;text-align:left"><span class="chip">${c.camp}</span><span class="chip">${c.tipo}</span><span class="sotto">${esc(quando(c.g))}</span><br>${c.testo}</span>
      <span class="fz">storico<br><b>${c.pct ? c.pct + "%" : "—"}</b><br><span class="fz2">forza ${num(c.forza, 2)}</span></span></button>`).join("")}
    <div class="sotto" style="margin-top:8px">Percentuale = quante volte, nello storico 2019–2025, la partita o il giocatore è finito dalla parte indicata rispetto alla sua norma (totale e margine delle due squadre, media del giocatore). <b>Contro la linea del bookmaker</b> le stesse indicazioni finiscono dalla parte giusta circa il 50% delle volte (verifica del 13/11): sono una lettura della partita, non consigli di gioco. La forza serve solo a confrontare due casi con la stessa percentuale.</div></section>`;
}

/* ---------- pannelli in fondo: classifica indici, quarterback, giovani ---------- */
function pannelli(D){
  const loghi = D.loghi || {};
  const t = sq => ({sigla: sq, nome: (loghi[sq] || {}).breve || sq, logo: (loghi[sq] || {}).logo, colore: (loghi[sq] || {}).colore});
  let h = "";
  const I = D.indici;
  if (I && (I.squadre || []).length) {
    const dec = I.decimali === undefined ? 3 : I.decimali, et = I.etichette || {};
    h += `<details class="scheda"><summary>Classifica indici · ${esc(et.titolo || "forza delle squadre")}</summary>
      <p class="sotto">${esc(et.sotto || "EPA per azione: attacco e difesa, più alto = meglio.")}</p>
      <table><tr><th>#</th><th style="text-align:left">Squadra</th><th>${esc(et.netto || "Netto")}</th><th>Att.</th><th>Dif.</th></tr>
      ${I.squadre.map(x => `<tr><td>${x.posizione}</td><td style="text-align:left"><span style="display:inline-flex;gap:8px;align-items:center">${stemma(t(x.squadra), "s")}${esc(t(x.squadra).nome)}</span></td>
        <td><b>${segno(x.netto, dec)}</b></td><td>${segno(x.attacco, dec)}</td><td>${segno(x.difesa, dec)}</td></tr>`).join("")}</table></details>`;
  }
  if (I && (I.quarterback || []).length) {
    h += `<details class="scheda"><summary>Quarterback · EPA per lancio</summary><table><tr><th>#</th><th style="text-align:left">QB</th><th>EPA/lancio</th><th>Lanci</th></tr>
      ${I.quarterback.map((q, i) => `<tr><td>${i + 1}</td><td style="text-align:left"><span style="display:inline-flex;gap:8px;align-items:center">${stemma(t(q.squadra), "s")}${esc(q.nome)}</span></td><td><b>${segno(q.epaLancio, 3)}</b></td><td>${num(q.lanci)}</td></tr>`).join("")}</table></details>`;
  }
  const G = D.giovani || {};
  const lista = (tit, l, qb) => (l || []).length ? `<div class="blocco">${tit}</div><table>${l.map(p => `<tr><td><span style="display:inline-flex;gap:8px;align-items:center">${stemma(t(p.squadra), "s")}<b>${esc(p.nome)}</b> ${freccia(p.forma)}</span><div class="sotto">${esc(p.esperienza || "")}</div></td>
      <td style="text-align:right">${qb ? "EPA/lancio " + segno(p.epaLancio, 3) + "<br>" : ""}${num(p.mediaStagione, 1)} ${esc(p.misura || "")} a partita</td></tr>`).join("")}</table>` : "";
  if (G.QB || G.RB || G.RIC) h += `<details class="scheda"><summary>Giovani che spiccano</summary><p class="sotto">Rookie, 2° e 3° anno con il miglior rendimento della stagione</p>
      ${lista("Quarterback", G.QB, true)}${lista("Running back", G.RB)}${lista("Ricevitori", G.RIC)}</details>`;
  return h;
}

function disegna(){
  document.querySelectorAll("[data-camp]").forEach(b => { b.classList.toggle("on", b.dataset.camp === CAMPIONATO); b.hidden = !DATI[b.dataset.camp]; });
  const D = DATI[CAMPIONATO];
  const solo = document.getElementById("soloSegnali").checked;
  const q = document.getElementById("cerca").value.trim().toLowerCase();
  const tutte = D.partite.filter(g => !iniziata(g));
  const elenco = tutte.filter(g => (!solo || (g.vantaggi || []).length) &&
    (!q || [g.casa, g.ospite, g.nomeCasa, g.nomeOspite, g.conferenceCasa, g.conferenceOspite].some(x => String(x || "").toLowerCase().includes(q))));
  const nV = tutte.reduce((t, g) => t + (g.vantaggi || []).filter(s => s.tipo === "giocatore").length, 0);
  document.getElementById("riepilogo").textContent = `${elenco.length} partite su ${tutte.length} · ${nV} vantaggi sui giocatori`;
  document.getElementById("migliori").innerHTML = migliori();
  document.getElementById("elenco").innerHTML = elenco.length ? elenco.map(scheda).join("")
    : `<div class="scheda vuoto">${solo || q ? "Nessuna partita con questi filtri." : "Nessuna partita ancora da giocare con dati disponibili."}</div>`;
  document.getElementById("pannelli").innerHTML = pannelli(D);
  document.querySelectorAll("[data-camp-top]").forEach(b => b.addEventListener("click", () => {
    CAMPIONATO = b.dataset.campTop; document.getElementById("cerca").value = ""; document.getElementById("soloSegnali").checked = false;
    disegna(); const el = document.getElementById(b.dataset.id); if (el) el.scrollIntoView({behavior:"smooth", block:"start"});
  }));
  const t = new Date(D.aggiornato);
  document.getElementById("piede").textContent = `Aggiornato il ${t.toLocaleString("it-IT", {timeZone:"Europe/Rome", dateStyle:"short", timeStyle:"short"})} · Fonti: ${D.fonti} · Solo statistiche, nessuna quota.`;
}
</script>
