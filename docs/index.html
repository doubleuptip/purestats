<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PureStats · Premier League</title>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700;800&family=Archivo:wght@600;800&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --nero:#050706; --card:#0C110E; --card2:#111A14;
    --bordo:#1C2A1F; --testo:#E8F5E6; --muted:#6B8470;
    --rosso:#FF2D2D; --giallo:#FFD400;

    /* Accento: verde per il calcio, arancio per il football americano.
       Le due leghe statunitensi hanno metriche del tutto diverse, e il
       colore serve a segnalare che si sta guardando un'altra cosa. */
    --acc:#39FF14; --acc2:#1FA30C; --acc-rgb:57,255,20;
  }
  body.arancio{
    --acc:#FF9838; --acc2:#B35A0A; --acc-rgb:255,152,56;
    /* Grigi schiariti: sui fondi caldi i toni precedenti sparivano.
       --data è il tono ambra di date e campi da gioco, che portano
       un'informazione diversa dal resto del testo secondario. */
    --bordo:#3D2E1F; --testo:#FBF5EF; --muted:#B39B82; --data:#C98A4B;
    --card:#17110B; --card2:#1F1710; --nero:#070503;
  }
  /* Caratteri: un solo stile per tutto il sito dal 16/11/2026 (quello di NFL e College). Le regole usano queste
     due variabili; body.fb le porta a Inter per il testo e Archivo / Barlow Condensed per i titoli. */
  :root{--f-testo:'JetBrains Mono',monospace;--f-tit:'Teko',sans-serif}
  body.fb{--f-testo:'Inter',sans-serif;--f-tit:var(--fb-head)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--nero);color:var(--testo);font-family:var(--f-testo);padding-bottom:60px}

  header{position:sticky;top:0;z-index:20;background:rgba(5,7,6,.96);
    border-bottom:1px solid var(--bordo);backdrop-filter:blur(8px);padding:14px 14px 0}
  .logo{display:flex;align-items:center;gap:8px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc)}
  .logo span{font-family:var(--f-tit);font-size:32px;letter-spacing:.06em;line-height:1}
  .logo b{color:var(--acc);font-weight:inherit}
  .lega{display:flex;gap:9px;align-items:center;margin:6px 0 14px 0;
    overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .lega button{flex-shrink:0;white-space:nowrap}
  .lega button{font-family:var(--f-testo);font-size:12px;font-weight:700;
    letter-spacing:.1em;color:var(--muted);background:transparent;border:none;
    padding:4px 0;cursor:pointer;border-bottom:2px solid transparent}
  .lega button.on{color:var(--acc);border-bottom-color:var(--acc)}
  .lega span{color:var(--bordo);font-size:11px}

  /* --- PROSSIMA DESIGNAZIONE --- */
  .desig{background:rgba(var(--acc-rgb),.06);border:1px solid rgba(var(--acc-rgb),.3);
    border-radius:8px;padding:13px 15px;margin-bottom:18px}
  .desig-lab{font-size:10px;color:var(--acc);letter-spacing:.12em;font-weight:700;margin-bottom:7px}
  .desig-match{font-family:var(--f-tit);font-size:28px;line-height:1.1}
  .desig-quando{font-size:11px;color:var(--muted);margin-top:3px}
  .desig-ruolo{font-size:8px;color:var(--muted);margin-top:6px;letter-spacing:.05em}
  .desig+.desig{margin-top:-10px}

  nav{display:flex;gap:5px;flex-wrap:wrap}
  nav button{font-family:var(--f-testo);font-size:11px;font-weight:700;
    letter-spacing:.06em;color:var(--muted);background:transparent;
    border:1px solid var(--bordo);border-bottom:none;border-radius:5px 5px 0 0;
    padding:9px 13px;cursor:pointer}
  nav button.on{color:var(--nero);background:var(--acc);border-color:var(--acc)}

  main{padding:20px 14px 0}
  h1{font-family:var(--f-tit);font-size:34px;line-height:1;font-weight:600}
  .sub{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.6}

  /* --- KPI numerici --- */
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:16px 0 22px}
  .kpi{background:var(--card);border:1px solid var(--bordo);border-radius:7px;padding:11px 8px;text-align:center}
  .kpi b{display:block;font-family:var(--f-tit);font-size:26px;color:var(--acc);line-height:1}
  .kpi span{display:block;font-size:7px;color:var(--muted);letter-spacing:.09em;margin-top:4px}

  .titolo{display:flex;align-items:center;gap:8px;margin:22px 0 5px}
  .titolo i{width:3px;height:21px;background:var(--acc);box-shadow:0 0 8px var(--acc)}
  .titolo span{font-family:var(--f-tit);font-size:26px;letter-spacing:.03em;line-height:1}
  .titolo-sub{font-size:11px;color:var(--muted);margin:0 0 11px 11px;line-height:1.6}

  /* --- TABELLA NUMERICA --- */
  .tab{width:100%;border-collapse:collapse;font-size:13px;table-layout:auto}
  .tab thead th{font-size:10px;color:var(--muted);letter-spacing:.07em;font-weight:700;
    text-align:right;padding:0 6px 8px;border-bottom:1px solid var(--bordo);white-space:nowrap}
  .tab thead th:first-child{text-align:left;padding-left:10px;width:auto}
  /* Le colonne numeriche occupano solo lo spazio necessario, così il nome
     non viene mai compresso né troncato */
  .tab thead th:not(:first-child){width:1%}
  .tab tbody td:not(:first-child){white-space:nowrap;width:1%}
  /* Le sigle NFL e i nomi dei college sono già leggibili in piccolo:
     il corpo grande del calcio qui sprecherebbe spazio in larghezza. */
  body.arancio .nome{font-size:16px}
  body.arancio .tab{font-size:12px}
  .tab tbody td:first-child{text-align:left;padding-left:10px;
    white-space:normal;overflow-wrap:anywhere;text-overflow:clip}
  .tab thead th.ord{cursor:pointer;-webkit-user-select:none;user-select:none}
  .tab thead th.ord:active{color:var(--testo)}
  .tab thead th.attivo{color:var(--acc)}
  .tab thead th .dir{font-size:8px;margin-left:2px}
  .tab tbody td{padding:9px 6px;text-align:right;border-bottom:1px solid rgba(28,42,31,.5);
    font-variant-numeric:tabular-nums}
  .tab tbody tr{background:var(--card)}
  .tab tbody tr.click{cursor:pointer}
  .tab tbody tr.click:active{background:var(--card2)}
  .pos{color:var(--muted);font-size:11px;display:inline-block;min-width:20px}
  .nome{font-family:var(--f-tit);font-size:22px;letter-spacing:.02em;vertical-align:middle;line-height:1.15}
  .big{color:var(--acc);font-weight:700;font-size:13px}
  .gial{color:var(--giallo);font-weight:700}
  .ros{color:var(--rosso);font-weight:700}
  .neg{color:var(--acc)}
  .freccia{color:var(--muted);font-size:11px;padding-left:6px}

  /* --- SCHEDA ARBITRO --- */
  .back{font-family:var(--f-testo);font-size:10px;color:var(--acc);
    background:transparent;border:1px solid var(--bordo);border-radius:5px;
    padding:7px 12px;cursor:pointer;margin-bottom:16px;letter-spacing:.06em}
  .avatar{width:54px;height:54px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;position:relative;
    overflow:hidden;border:1px solid rgba(var(--acc-rgb),.3)}
  .avatar b{font-family:var(--f-tit);font-size:27px;line-height:1;
    letter-spacing:.04em;position:relative;z-index:2}
  .avatar canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1;opacity:.55}
  .scheda-testa{display:flex;align-items:center;gap:13px;min-width:0}

  .scheda-top{background:var(--card);border:1px solid rgba(var(--acc-rgb),.25);
    border-radius:9px;padding:16px;margin-bottom:18px}
  .scheda-nome{font-family:var(--f-tit);font-size:29px;line-height:1.05;letter-spacing:.02em;overflow-wrap:anywhere}
  .scheda-meta{font-size:11px;color:var(--muted);margin-top:4px}
  .dati{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--bordo);
    border:1px solid var(--bordo);border-radius:7px;overflow:hidden;margin-bottom:18px}
  .dato{background:var(--card);padding:12px 11px}
  .dato b{display:block;font-family:var(--f-tit);font-size:27px;color:var(--acc);line-height:1}
  .dato b.g{color:var(--giallo)} .dato b.r{color:var(--rosso)} .dato b.n{color:var(--testo)}
  .dato span{display:block;font-size:8px;color:var(--muted);letter-spacing:.07em;margin-top:5px;line-height:1.4}

  .conf{display:flex;align-items:center;justify-content:space-between;
    background:var(--card);border:1px solid var(--bordo);border-radius:7px;
    padding:12px 14px;margin-bottom:8px}
  .conf-lab{font-size:9px;color:var(--muted);letter-spacing:.06em}
  .conf-val{font-family:var(--f-tit);font-size:24px;line-height:1}

  /* --- RICERCA E FILTRI --- */
  .filtri{margin:16px 0 18px}
  .cerca{width:100%;background:var(--card);border:1px solid var(--bordo);border-radius:7px;
    padding:11px 13px;color:var(--testo);font-family:var(--f-testo);
    font-size:12px;outline:none}
  .cerca:focus{border-color:var(--acc);box-shadow:0 0 0 1px rgba(var(--acc-rgb),.2)}
  .cerca::placeholder{color:var(--muted)}
  .stagioni{display:flex;gap:5px;overflow-x:auto;margin-top:9px;padding-bottom:3px;
    -webkit-overflow-scrolling:touch}
  .stagioni button{flex-shrink:0;font-family:var(--f-testo);font-size:9px;
    font-weight:700;letter-spacing:.05em;color:var(--muted);background:var(--card);
    border:1px solid var(--bordo);border-radius:5px;padding:7px 11px;cursor:pointer;white-space:nowrap}
  .stagioni button.on{color:var(--nero);background:var(--acc);border-color:var(--acc)}
  .conteggio{font-size:9px;color:var(--muted);margin-top:9px;letter-spacing:.05em}

  .arb{color:var(--acc);font-weight:700}

  /* Sottomenù dei campionati di uno stesso paese */
  .sub-lega{display:flex;gap:6px;margin:0 0 12px 20px}
  .sub-lega button{font-family:var(--f-testo);font-size:10px;
    font-weight:700;letter-spacing:.08em;color:var(--muted);background:var(--card);
    border:1px solid var(--bordo);border-radius:5px;padding:6px 11px;cursor:pointer;
    white-space:nowrap}
  .sub-lega button.on{color:var(--nero);background:var(--acc);border-color:var(--acc)}

  /* --- GRUPPI COMPRIMIBILI --- */
  .gruppo{width:100%;display:flex;align-items:center;gap:9px;text-align:left;
    background:var(--card);border:1px solid var(--bordo);border-radius:8px;
    padding:11px 13px;margin-top:8px;cursor:pointer;
    font-family:var(--f-testo)}
  .gruppo.on{border-color:var(--acc)}
  .gruppo-tit{font-family:var(--f-tit);font-size:19px;color:var(--acc);line-height:1}
  .gruppo-sub{font-size:9px;color:var(--muted)}
  .gruppo-freccia{margin-left:auto;color:var(--muted);font-size:11px}
  .gruppo-corpo{margin-top:8px}

  .toggle-gio{width:100%;margin-top:9px;font-family:var(--f-testo);
    font-size:9px;color:var(--acc);background:transparent;border:1px solid var(--bordo);
    border-radius:4px;padding:5px;cursor:pointer;letter-spacing:.06em}

  /* --- GIOCATORI NELLA SCHEDA PARTITA --- */
  .rose{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:11px;
    padding-top:11px;border-top:1px solid var(--bordo)}
  .rosa-tit{font-size:8px;color:var(--acc);letter-spacing:.1em;font-weight:700;margin-bottom:6px}
  .gio{margin-bottom:7px;line-height:1.35}
  .gio-r.cat{min-width:0}
  .gio-r{margin-right:6px;display:inline-block;min-width:22px;font-size:8px;font-weight:700;
    color:var(--muted);letter-spacing:.06em}
  .gio-n{font-size:11px;color:var(--testo)}
  .gio-v{display:block;font-size:9px;color:var(--muted);margin-left:22px}
  .gio-v b{color:var(--acc);font-weight:700}

  /* L'attribuzione alla fonte è una condizione della licenza: va
     mostrata nella pagina, non solo nei dati. */
  .avviso-fonte{margin-top:20px;padding:12px 14px;background:var(--card2);
    border:1px solid var(--bordo);border-radius:8px;
    font-size:10px;color:var(--muted);line-height:1.7;text-align:center}

  /* --- CALENDARIO --- */
  .sottomenu{display:flex;gap:5px;overflow-x:auto;margin:14px 0 16px;padding-bottom:3px}
  .sottomenu button{flex-shrink:0;font-family:var(--f-testo);font-size:10px;
    font-weight:700;letter-spacing:.05em;color:var(--muted);background:var(--card);
    border:1px solid var(--bordo);border-radius:5px;padding:8px 12px;cursor:pointer;white-space:nowrap}
  .sottomenu button.on{color:var(--nero);background:var(--acc);border-color:var(--acc)}


  .gara{background:var(--card);border:1px solid var(--bordo);border-radius:8px;padding:11px 14px}
  .gara-quando{font-size:9px;color:var(--acc);letter-spacing:.08em;margin-bottom:6px}
  .gara-squadre{display:flex;align-items:center;justify-content:space-between}
  .gara-squadre span{font-family:var(--f-tit);font-size:19px;flex:1;line-height:1.15}
  body.arancio .gara-squadre span{font-size:20px}
  .gara-squadre .vs{flex:0 0 auto;font-family:var(--f-testo);font-size:9px;
    color:var(--muted);padding:0 10px;white-space:nowrap}
  /* Il punteggio va tenuto su una riga: spezzato in due si legge male
     e disallinea le due squadre. */
  body.arancio .gara-squadre .vs{font-size:13px;font-weight:700;
    color:var(--testo);padding:0 12px}
  .gara-arb{font-size:9px;color:var(--muted);margin-top:6px}
  body.arancio .gara-arb{font-size:10px;color:var(--data, var(--muted))}


  .chart-box{background:var(--card);border:1px solid var(--bordo);border-radius:8px;
    padding:14px 10px 10px;margin-bottom:20px}

  .empty{background:var(--card);border:1px dashed var(--bordo);border-radius:8px;
    padding:30px 20px;text-align:center}
  .loading{text-align:center;padding:60px 20px;color:var(--muted);font-size:11px}
  footer{font-size:8px;color:var(--muted);margin:32px 14px 0;
    padding-top:15px;border-top:1px solid var(--bordo);line-height:1.9}
  .pie-riga{text-align:center}
  .pie-apri{display:block;margin:14px auto 0;font-family:var(--f-testo);
    font-size:8px;letter-spacing:.1em;color:var(--acc);background:transparent;
    border:1px solid var(--bordo);border-radius:5px;padding:7px 14px;cursor:pointer}
  .pie-legale{margin-top:14px;padding:14px;background:var(--card);
    border:1px solid var(--bordo);border-radius:8px;text-align:left;font-size:9px;
    line-height:1.85}
  .pie-legale h4{font-family:var(--f-testo);font-size:8px;font-weight:700;
    letter-spacing:.1em;color:var(--acc);margin:14px 0 5px}
  .pie-legale h4:first-child{margin-top:0}
  .pie-legale ul{margin:0;padding-left:15px}
  .pie-legale li{margin-bottom:4px}
  .pie-legale b{color:var(--testo);font-weight:700}
  code{color:var(--acc);font-size:9px}

  /* ============ FOOTBALL: NUOVO ASPETTO ============
     Chiaro di giorno, scuro di notte: segue l'impostazione del dispositivo
     (come il tema automatico di Windows, Android e iOS). Il calcio non cambia. */
  body.fb{
    --fb-bg:#E9EDF2; --fb-card:#FFFFFF; --fb-text:#111827; --fb-muted:#4B5563; --fb-border:#CDD4DE;
    --fb-acc:#B91C1C; --fb-acc-text:#FFFFFF; --fb-pill:#E5E7EB; --fb-okbg:#DCFCE7; --fb-ok:#166534;
    --fb-chip:#EEF0F3; --fb-chiptext:#374151; --fb-lose:#6B7280; --fb-head:'Archivo',sans-serif;
    --nero:var(--fb-bg); --card:var(--fb-card); --card2:var(--fb-pill); --bordo:var(--fb-border);
    --testo:var(--fb-text); --muted:var(--fb-muted); --acc:var(--fb-acc); --acc2:var(--fb-acc);
    --acc-rgb:185,28,28; --data:var(--fb-muted); --rosso:#C81E1E; --giallo:#B7791F;
    font-family:'Inter',sans-serif;
  }
  @media (prefers-color-scheme: dark){
    body.fb{
      --fb-bg:#0B0F1A; --fb-card:#131A2B; --fb-text:#F5F7FB; --fb-muted:#A3ADC2; --fb-border:#232C42;
      --fb-acc:#FF8A3D; --fb-acc-text:#1A0E05; --fb-pill:#1B2338; --fb-okbg:#3A2412; --fb-ok:#FFB27A;
      --fb-chip:#1F2840; --fb-chiptext:#C9D1E3; --fb-lose:#8D97AD; --fb-head:'Barlow Condensed',sans-serif;
      --acc-rgb:255,138,61; --rosso:#FF7A7A; --giallo:#FFD400;
    }
  }
  body.fb header{background:var(--fb-bg)}
  body.fb .logo span{font-family:var(--fb-head);font-weight:800;color:var(--fb-text)}
  body.fb .dot{box-shadow:none}
  body.fb .lega button{font-family:'Inter',sans-serif;font-size:15px;font-weight:600}
  body.fb nav button{font-family:'Inter',sans-serif;font-size:15px;font-weight:600;padding:10px 16px}
  body.fb main{max-width:1200px;margin:0 auto;padding:24px 16px 0}
  body.fb .sub{font-size:16px;line-height:1.6}
  body.fb .titolo span{font-family:var(--fb-head);font-weight:800;font-size:30px}
  body.fb .titolo i{box-shadow:none}
  body.fb .titolo-sub{font-size:15px}
  body.fb .tab{font-size:16px}
  body.fb .tab thead th{font-size:13px}
  body.fb .tab tbody td{padding:12px 8px;border-bottom:1px solid var(--fb-border)}
  body.fb .tab tbody tr{background:var(--fb-card)}
  body.fb .kpi,body.fb .cerca,body.fb .gara,body.fb .scheda-top,body.fb .gruppo{border:1px solid var(--fb-border);background:var(--fb-card)}
  body.fb .kpi span{font-size:13px}
  body.fb .stagioni button,body.fb .sottomenu button{border:1px solid var(--fb-border);background:var(--fb-card)}
  body.fb .stagioni button.on,body.fb .sottomenu button.on{background:var(--fb-acc);color:var(--fb-acc-text);border-color:var(--fb-acc)}
  .fb-mini{display:block;font-size:13px;color:var(--fb-muted);margin-top:2px}
  body.fb .fb-box,body.fb .fb-game,body.fb .fb-tile,body.fb .fb-duel{box-shadow:0 1px 2px rgba(15,23,42,.06)}
  body.fb .nome{font-family:'Inter',sans-serif;font-weight:600;font-size:17px}
  body.fb .big{font-size:16px}
  body.fb .pos{font-size:14px}
  body.fb .gara{border-radius:14px;padding:16px 18px}
  body.fb .gara-squadre span{font-family:'Inter',sans-serif;font-weight:600;font-size:18px}
  body.fb .gara-arb,body.fb .gara-quando{font-size:14px}
  body.fb .gruppo-tit{font-family:var(--fb-head);font-size:24px}
  body.fb .gruppo-sub,body.fb .conteggio{font-size:14px}
  body.fb .stagioni button,body.fb .sottomenu button{font-family:'Inter',sans-serif;font-size:14px;padding:8px 12px}
  body.fb .cerca{font-family:'Inter',sans-serif;font-size:16px}
  body.fb .dato b,body.fb .kpi b{font-family:var(--fb-head)}
  body.fb .dato span,body.fb .kpi span{font-size:13px}
  body.fb .scheda-nome{font-family:var(--fb-head);font-weight:800}
  body.fb .scheda-meta,body.fb .conf-lab{font-size:14px}
  body.fb .rosa-tit{font-size:13px} body.fb .gio-n{font-size:15px} body.fb .gio-v{font-size:13px} body.fb .gio-r{font-size:12px}
  body.fb .toggle-gio,body.fb .back{font-family:'Inter',sans-serif;font-size:14px}
  body.fb #pie{font-family:'Inter',sans-serif}
  /* Le viste del calcio nascono con caratteri monospazio molto piccoli scritti nel codice (style="font-size:8px"):
     con lo stile unico (Inter) si portano alle misure di NFL e College. */
  body.fb main [style*="font-size:8px"],body.fb main [style*="font-size:9px"]{font-size:12px!important}
  body.fb main [style*="font-size:10px"]{font-size:13px!important}
  body.fb main [style*="font-size:11px"]{font-size:14px!important}

  /* blocchi nuovi */
  .fb-h1{font-family:var(--fb-head);font-weight:800;font-size:44px;line-height:1.05;color:var(--fb-text);margin:4px 0}
  .fb-h2{font-family:var(--fb-head);font-weight:800;font-size:28px;color:var(--fb-text);margin:0 0 6px}
  .fb-h3{font-size:14px;font-weight:700;color:var(--fb-muted);letter-spacing:.04em;margin:16px 0 4px}
  .fb-lead{font-size:17px;color:var(--fb-muted);margin:0 0 18px}
  .fb-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:24px}

  /* Logo PureStats (16/11/2026, disegno di Valerio ridisegnato in vettoriale): colori dal tema, rosso acceso di notte */
  :root{--logo-testo:#0B1428;--logo-rosso:#B91C1C}

  .logo-simbolo .lt{fill:var(--logo-testo)} .logo-simbolo .lr{fill:var(--logo-rosso);stroke:var(--logo-rosso)}
  .logo-simbolo .lr rect,.logo-simbolo .lr circle{stroke:none}
  body.fb .logo{gap:10px;text-decoration:none;cursor:pointer}

<script>
/* tasto «torna su»: compare dopo 600 px di pagina */
const suInCima = document.getElementById("suInCima");
addEventListener("scroll", () => suInCima.classList.toggle("visibile", scrollY > 600), {passive: true});
suInCima.addEventListener("click", () => scrollTo({top: 0, behavior: "smooth"}));
/* Colori e caratteri presi dal tema della pagina (variabili CSS), così grafici e testi colorati seguono lo stile
   unico del sito, chiaro o scuro. Si rileggono a ogni disegno. */
let FLUO="#39FF14",FLUO2="#1FA30C",GIALLO="#FFD400",ROSSO="#FF2D2D",
    MUTED="#6B8470",BORDO="#1C2A1F",TESTO="#E8F5E6",NERO="#050706",F_TESTO="JetBrains Mono",F_TIT="Teko",
    ACC_RGB="57,255,20";        /* il canvas dei grafici non capisce var(): il colore si legge dal tema */
function aggiornaColori(){
  const cs = getComputedStyle(document.body), v = (k, d) => (cs.getPropertyValue(k) || "").trim() || d;
  FLUO = v("--acc", FLUO); FLUO2 = v("--acc2", FLUO2); ROSSO = v("--rosso", ROSSO); ACC_RGB = v("--acc-rgb", ACC_RGB);
  MUTED = v("--muted", MUTED); BORDO = v("--bordo", BORDO); TESTO = v("--testo", TESTO); NERO = v("--nero", NERO);
  GIALLO = matchMedia("(prefers-color-scheme: dark)").matches ? "#FFD400" : "#B7791F";
  F_TESTO = v("--f-testo", F_TESTO).split(",")[0].replace(/['"]/g, "");
  F_TIT = v("--f-tit", F_TIT).split(",")[0].replace(/['"]/g, "");
}

let D=null, vista="arbitri", arbitroAperto=null, charts=[];
let ricerca="", stagione=null;
let annoFootball=null, gruppoFootball="tutti", squadraAperta=null;
let arbitroAleague=null;
let legaleAperto=false;

/* Cosa è aperto nella pagina. Con un calendario intero, mostrare tutto
   espanso significa migliaia di righe: si parte chiusi e si apre ciò
   che interessa. Gli insiemi sopravvivono ai ridisegni, quindi aprire
   una scheda non richiude le altre. */
const settimaneAperte = new Set();
const partiteAperte = new Set();   // null = non ancora scelta, si imposta al caricamento

/* La stagione in corso è quella predefinita: guardare le medie di tutta la
   storia raramente è ciò che serve per prima cosa. "Tutte" resta a un tocco. */
function stagionePredefinita(d){
  const s = d && d.stagioni;
  return (s && s.length) ? s[s.length - 1] : "tutte";
}

/* Campionati disponibili. Ciascuno ha il proprio file dati:
   se un file non esiste il campionato viene semplicemente nascosto. */
const LEGHE = [
  {id:"nfl",      nome:"NFL",           file:"data_nfl.json",      football:true},
  {id:"college",  nome:"COLLEGE FB",    file:"data_college.json",  football:true},
  // calcio (dal 17/11/2026): dati cifrati, menu visibili solo con il collegamento privato (#k=...)
  {id:"premier",  nome:"PREMIER LEAGUE", file:"data.dat",              privato:true},
  {id:"serie_a",  nome:"SERIE A",        file:"data_serie_a.dat",      privato:true},
  {id:"la_liga",  nome:"LALIGA",         file:"data_la_liga.dat",      privato:true},
  {id:"ligue_1",  nome:"LIGUE 1",        file:"data_ligue_1.dat",      privato:true},
  {id:"bundesliga",   nome:"BUNDESLIGA",   file:"data_bundesliga.dat",   gruppo:"GERMANIA", privato:true},
  {id:"bundesliga_2", nome:"BUNDESLIGA 2", file:"data_bundesliga_2.dat", gruppo:"GERMANIA", privato:true},
  {id:"super_lig", nome:"SÜPER LIG",     file:"data_super_lig.dat",    privato:true},
  {id:"aleague",  nome:"A-LEAGUE",      file:"data_aleague.dat",  soloArbitri:true, privato:true},
];

/* Accesso privato (17/11/2026): il collegamento …/purestats/#k=<password> sblocca il calcio e Matchup.
   La chiave resta solo in memoria e sparisce subito dalla barra degli indirizzi; niente localStorage.
   Cifratura uguale a Matchup (scripts/cifra_pagine.py → fetch_duelli.cifra). */
let CHIAVE = null, CHIAVE_DAL_LINK = false;
const MEMORIA_ACCESSO = "purestats_accesso";
(function leggiChiave(){
  // tutto quello che segue «k=» è la password (anche con & o altri simboli)
  const m = location.hash.match(/(?:^#|&)k=(.+)$/);
  if (m) {
    try { CHIAVE = decodeURIComponent(m[1]); } catch (e) { CHIAVE = m[1]; }
    history.replaceState(null, "", location.pathname + location.search);
    CHIAVE_DAL_LINK = true;
    return;
  }
  // accesso ricordato su questo dispositivo (accesso.html; unica eccezione alla regola «niente localStorage»)
  try { CHIAVE = localStorage.getItem(MEMORIA_ACCESSO) || null; } catch (e) { CHIAVE = null; }
})();
function esci(){
  try { localStorage.removeItem(MEMORIA_ACCESSO); } catch (e) {}
  location.replace(location.pathname);
}
if (!CHIAVE) for (let i = LEGHE.length - 1; i >= 0; i--) if (LEGHE[i].privato) LEGHE.splice(i, 1);

const pacchetti = {};          // file cifrati già scaricati, decifrati solo quando servono
const b64a = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const unisciByte = (...parti) => { const n = parti.reduce((t, x) => t + x.length, 0), o = new Uint8Array(n); let i = 0; for (const x of parti) { o.set(x, i); i += x.length; } return o; };
async function decifraPacchetto(pk, password){
  const sub = crypto.subtle;
  const base = await sub.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
  const k = new Uint8Array(await sub.deriveBits({name:"PBKDF2", hash:"SHA-256", salt:b64a(pk.sale), iterations:pk.iterazioni}, base, 512));
  const nonce = b64a(pk.nonce), cifrato = b64a(pk.dati);
  const km = await sub.importKey("raw", k.slice(32), {name:"HMAC", hash:"SHA-256"}, false, ["verify"]);
  if (!await sub.verify("HMAC", km, b64a(pk.mac), unisciByte(nonce, cifrato))) throw new Error("chiave");
  const richieste = [];
  for (let i = 0; i < Math.ceil(cifrato.length / 32); i++)
    richieste.push(sub.digest("SHA-256", unisciByte(k.slice(0, 32), nonce, new Uint8Array([i >>> 24 & 255, i >>> 16 & 255, i >>> 8 & 255, i & 255]))));
  const flusso = unisciByte(...(await Promise.all(richieste)).map(x => new Uint8Array(x)));
  return JSON.parse(new TextDecoder().decode(cifrato.map((b, i) => b ^ flusso[i])));
}
/* Scarica un file del sito: in chiaro (football) o cifrato (calcio, solo con la chiave) */
function scaricaDati(file, privato){
  if (!privato) return fetch(file + "?t=" + Date.now()).then(r => { if (!r.ok) throw new Error(file + " non trovato"); return r.json(); });
  if (!CHIAVE) return Promise.reject(new Error("riservato"));
  const pk = pacchetti[file] ? Promise.resolve(pacchetti[file])
    : fetch(file + "?t=" + Date.now()).then(r => { if (!r.ok) throw new Error(file + " non trovato"); return r.json(); });
  return pk.then(x => { pacchetti[file] = x; return decifraPacchetto(x, CHIAVE); });
}

/* Ordinamento: una configurazione per ciascuna tabella.
   dir = -1 decrescente (default per le medie), +1 crescente. */
let ord = {
  arbitri: {campo:"mediaCartellini", dir:-1},
  squadre: {campo:"mediaGialli",     dir:-1},
};

function ordina(tabella, campo){
  const o = ord[tabella];
  if(o.campo === campo) o.dir = -o.dir;   // stesso campo: inverte la direzione
  else {
    o.campo = campo;
    // I nomi partono da A-Z, i numeri dal valore più alto
    o.dir = (campo === "nome") ? 1 : -1;
  }
  render();
}

/* Confronto che gestisce numeri, testo e valori mancanti.
   I valori nulli finiscono sempre in fondo, in entrambe le direzioni. */
function confronta(a, b, campo, dir){
  const va = a[campo], vb = b[campo];
  const na = va===null||va===undefined||va==="";
  const nb = vb===null||vb===undefined||vb==="";
  if(na && nb) return 0;
  if(na) return 1;
  if(nb) return -1;
  if(typeof va === "string" || typeof vb === "string")
    return String(va).localeCompare(String(vb)) * (dir === -1 ? -1 : 1);
  return (va - vb) * (dir === -1 ? -1 : 1);
}

/* Genera un'intestazione cliccabile */
function th(tabella, campo, etichetta, primo){
  const o = ord[tabella];
  const attivo = o.campo === campo;
  const freccia = attivo ? (o.dir === -1 ? "▼" : "▲") : "";
  return `<th class="ord${attivo?" attivo":""}${primo?"":""}"
    onclick="ordina('${tabella}','${campo}')">${etichetta}<span class="dir">${freccia}</span></th>`;
}

/* ---------- AVATAR GENERATO DAL NOME ----------
   Ogni arbitro ottiene un motivo grafico unico e sempre identico,
   ricavato dalle lettere del suo nome. Nessuna immagine esterna,
   quindi nessun problema di diritti d'autore o di ritratto. */

function _semeDaNome(nome){
  // hash deterministico: lo stesso nome dà sempre lo stesso motivo
  let h = 2166136261;
  for(let i=0;i<nome.length;i++){
    h ^= nome.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function _iniziali(nome){
  const parti = String(nome||"").trim().split(/\s+/).filter(Boolean);
  if(!parti.length) return "?";
  if(parti.length === 1) return parti[0].slice(0,2).toUpperCase();
  return (parti[0][0] + parti[parti.length-1][0]).toUpperCase();
}

/* Tonalità derivata dal nome, mantenuta nella gamma verde del tema */
function _tinta(seme){
  const scarto = (seme % 60) - 30;      // da -30 a +29 gradi attorno al verde
  return 105 + scarto;
}

function avatar(nome, lato){
  const seme = _semeDaNome(nome||"");
  const tinta = _tinta(seme);
  const id = "av" + seme.toString(36);
  const sfondo = `hsl(${tinta} 45% 8%)`;
  const testo  = `hsl(${tinta} 90% 62%)`;

  // il canvas viene disegnato dopo l'inserimento nel DOM
  setTimeout(()=>disegnaAvatar(id, seme, tinta), 0);

  return `<div class="avatar" style="background:${sfondo};width:${lato}px;height:${lato}px">
    <canvas id="${id}" width="${lato*2}" height="${lato*2}"></canvas>
    <b style="color:${testo};font-size:${Math.round(lato*0.43)}px">${esc(_iniziali(nome))}</b>
  </div>`;
}

/* Disegna anelli concentrici, cerchi in orbita e un arco sul bordo.
   Tutti i parametri derivano dal seme, quindi il risultato è unico
   per ogni nome e sempre identico a sé stesso. */
function disegnaAvatar(id, seme, tinta){
  const c = document.getElementById(id);
  if(!c) return;
  const ctx = c.getContext("2d");
  const L = c.width, centro = L/2;
  let s = seme;
  const prossimo = ()=>{ s = (s * 1664525 + 1013904223) >>> 0; return s; };

  ctx.clearRect(0,0,L,L);

  // Anelli concentrici di spessore variabile: danno profondità
  const anelli = 2 + (prossimo() % 3);
  for(let i = anelli; i > 0; i--){
    const raggio = (L * 0.46) * (i / anelli);
    const chiarezza = 26 + (prossimo() % 30);
    ctx.beginPath();
    ctx.arc(centro, centro, raggio, 0, Math.PI * 2);
    ctx.fillStyle = `hsl(${tinta} 65% ${chiarezza}%)`;
    ctx.fill();
  }

  // Cerchi in orbita, disposti simmetricamente attorno al centro
  const quanti = 3 + (prossimo() % 4);
  const distanza = L * (0.24 + (prossimo() % 12) / 100);
  const rotazione = (prossimo() % 360) * Math.PI / 180;
  const raggioPunto = L * (0.055 + (prossimo() % 5) / 100);

  for(let i = 0; i < quanti; i++){
    const angolo = rotazione + (i * 2 * Math.PI / quanti);
    const x = centro + Math.cos(angolo) * distanza;
    const y = centro + Math.sin(angolo) * distanza;
    const chiarezza = 48 + (prossimo() % 26);
    ctx.beginPath();
    ctx.arc(x, y, raggioPunto, 0, Math.PI * 2);
    ctx.fillStyle = `hsl(${tinta} 78% ${chiarezza}%)`;
    ctx.fill();
  }

  // Arco spezzato sul bordo: elemento asimmetrico che rende unico il risultato
  const inizio = (prossimo() % 360) * Math.PI / 180;
  const ampiezza = (0.6 + (prossimo() % 100) / 100) * Math.PI;
  ctx.beginPath();
  ctx.arc(centro, centro, L * 0.42, inizio, inizio + ampiezza);
  ctx.strokeStyle = `hsl(${tinta} 85% 60%)`;
  ctx.lineWidth = L * 0.035;
  ctx.stroke();
}

function dataEstesa(iso){
  if(!iso) return "";
  const d=new Date(iso+"T12:00:00");
  if(isNaN(d.getTime())) return esc(iso);
  return d.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"});
}

  return scaricaDati(lega.file, lega.privato)
    .then(d=>{ cache[id]=d; return d; });
}

/* All'avvio prova a caricare tutti i campionati.
   Quelli senza dati restano visibili ma segnalati: nascondere in silenzio
   renderebbe impossibile capire che manca un file. */
Promise.all(LEGHE.map(l =>
  fetch(l.file+"?t="+Date.now())
    .then(r=>r.ok?r.json():null)
    .then(d=>{ if(d){ if(l.privato) pacchetti[l.file]=d; else cache[l.id]=d; } return {lega:l, ok:!!d}; })
    .catch(()=>({lega:l, ok:false}))
)).then(async esiti=>{
  // collegamento privato: si prova la chiave sul primo file del calcio; se è sbagliata il calcio resta nascosto
  const primoPrivato = esiti.find(e => e.ok && e.lega.privato);
  if (CHIAVE && !primoPrivato) avvisoChiave("Collegamento privato: i dati del calcio non si trovano, riprova tra poco.");
  if (CHIAVE && primoPrivato) {
    try {
      cache[primoPrivato.lega.id] = await decifraPacchetto(pacchetti[primoPrivato.lega.file], CHIAVE);
      if (CHIAVE_DAL_LINK) try { localStorage.setItem(MEMORIA_ACCESSO, CHIAVE); } catch (e) {}   // da ora si ricorda
    }
    catch (e) {
      if (e.message === "chiave") try { localStorage.removeItem(MEMORIA_ACCESSO); } catch (x) {}  // password cambiata
      console.warn("Collegamento privato: chiave non valida, il calcio resta nascosto.", e);
      avvisoChiave(e.message === "chiave" ? "Collegamento privato: password non valida."
        : !(window.crypto && crypto.subtle) ? "Collegamento privato: questo browser non può aprire i dati cifrati."
        : "Collegamento privato: non riesco ad aprire i dati, riprova tra poco.");
      CHIAVE = null;
      esiti.forEach(x => { if (x.lega.privato) x.ok = false; });
    }
  }
  // I campionati senza archivio vengono tolti dal menù invece di
  // comparire sbiaditi: con i paesi raggruppati, una voce disattivata
  // dentro un gruppo sarebbe più confusa che utile.
  const mancanti = esiti.filter(e=>!e.ok).map(e=>e.lega.id);
  if(mancanti.length){
    console.warn("Archivi non trovati:", mancanti.join(", "));
    for(let i=LEGHE.length-1; i>=0; i--){
      if(mancanti.includes(LEGHE[i].id)) LEGHE.splice(i,1);
    }
  }

  const primo = esiti.find(e=>e.ok);
  if(!primo){ mostraErrore(new Error("nessun archivio trovato")); return; }

  legaAttiva = primo.lega.id;
  D = cache[legaAttiva];
  stagione = stagionePredefinita(D);
  render();
});

  document.getElementById("pie").innerHTML =
    `<div class="pie-riga">
       Fonte: ${esc(D.fonte||"")}<br>

function testoLegale(){
  return `<div class="pie-legale">
    <h4>DA DOVE ARRIVANO I DATI</h4>
    <ul>${FONTI.map(([cosa,chi,lic])=>
      `<li><b>${esc(chi)}</b> — ${esc(cosa)}<br>${esc(lic)}</li>`).join("")}</ul>

    <h4>COSA PUOI RIUTILIZZARE</h4>
    I dati sportivi in sé sono fatti e non appartengono a PureStats:
    provengono dalle fonti elencate sopra e restano soggetti alle loro
    licenze. Chi vuole riutilizzarli deve rispettare le condizioni di
    ciascuna fonte, non le nostre. In particolare i dati NFL sono

/* Il menù elenca i paesi, non i singoli campionati: dove ce n'è più di
   uno compare una voce sola, e la scelta fra le divisioni avviene in un
   secondo livello. Senza, l'elenco in alto diventerebbe illeggibile. */
function vociMenu(){
  const voci = [];
  LEGHE.forEach(l => {
    const etichetta = l.gruppo || l.nome;
    const esistente = voci.find(v => v.etichetta === etichetta);
    if (esistente) esistente.leghe.push(l);
    else voci.push({etichetta, leghe: [l]});
  });
  return voci;
}

function disegnaMenu(){
  const attiva = LEGHE.find(l => l.id === legaAttiva);
  const gruppoAttivo = attiva ? (attiva.gruppo || attiva.nome) : null;

  document.getElementById("scelta-lega").innerHTML = vociMenu().map((v,i) =>
    (i ? `<span>·</span>` : "") +
    `<button id="lg-${v.leghe[0].id}" class="${v.etichetta===gruppoAttivo?"on":""}"
       onclick="vaiLega('${v.leghe[0].id}')">${v.etichetta}</button>`
  ).join("");

  // secondo livello, solo se il paese scelto ha più campionati
  const box = document.getElementById("sub-lega");
  if(!box) return;
  const voce = vociMenu().find(v => v.etichetta === gruppoAttivo);
  if(voce && voce.leghe.length > 1){
    box.style.display = "flex";
    box.innerHTML = voce.leghe.map(l =>
      `<button class="${l.id===legaAttiva?"on":""}"
         onclick="vaiLega('${l.id}')">${l.nome}</button>`).join("");
  } else {
    box.style.display = "none";
    box.innerHTML = "";
  }
}

function kpi(...v){
  return `<div class="kpis">${v.map(x=>
    `<div class="kpi"><b>${x[0]}</b><span>${x[1]}</span></div>`).join("")}</div>`;
}

function opz(titolo,orizz){
  return {responsive:true,maintainAspectRatio:false,indexAxis:orizz?"y":"x",
    plugins:{
      title:{display:true,text:titolo,color:TESTO,font:{family:F_TIT,size:18},padding:{bottom:10}},
      legend:{labels:{color:MUTED,font:{family:F_TESTO,size:11},boxWidth:9}},
      tooltip:{backgroundColor:NERO,borderColor:FLUO,borderWidth:1,titleColor:TESTO,bodyColor:TESTO,
        titleFont:{family:F_TESTO,size:12},bodyFont:{family:F_TESTO,size:12}}},
    scales:{
      x:{ticks:{color:MUTED,font:{family:F_TESTO,size:11}},grid:{color:BORDO}},
      y:{ticks:{color:MUTED,font:{family:F_TESTO,size:11}},grid:{color:BORDO}}}};
}

/* Restituisce l'arbitro con le medie della stagione selezionata,
   oppure i dati complessivi se il filtro è su "tutte". */
function perFiltro(a){
  if(stagione==="tutte") return {
    partite:a.partite, mediaGialli:a.mediaGialli, mediaRossi:a.mediaRossi,
    mediaCartellini:a.mediaCartellini, mediaFalli:a.mediaFalli,
    squilibrio:a.squilibrioCasaOspite
  };
  const s=(a.perStagione||[]).find(x=>x.stagione===stagione);
  if(!s) return null;
  return {
    partite:s.partite, mediaGialli:s.mediaGialli, mediaRossi:s.mediaRossi,
    mediaCartellini:s.media, mediaFalli:s.mediaFalli, squilibrio:s.squilibrio
  };
}

function arbitriFiltrati(){
  const q=ricerca.trim().toLowerCase();
  const o=ord.arbitri;
  return (D.arbitri||[])
    .map(a=>({arb:a, d:perFiltro(a)}))
    .filter(x=>x.d!==null)
    .filter(x=>!q||x.arb.nome.toLowerCase().includes(q))
    .map(x=>({...x, nome:x.arb.nome, ...x.d}))   // campi piatti per l'ordinamento
    .sort((x,y)=>confronta(x,y,o.campo,o.dir) || x.nome.localeCompare(y.nome));
}

function vScheda(){
  const a=(D.arbitri||[]).find(x=>x.nome===arbitroAperto);
  if(!a) return `<button class="back" onclick="chiudiArbitro()">‹ INDIETRO</button>
                 <div class="empty">Arbitro non trovato</div>`;

  const pos=(D.arbitri||[]).findIndex(x=>x.nome===arbitroAperto)+1;
  const totArb=(D.arbitri||[]).length;
  const conStorico=(D.arbitri||[]).filter(x=>x.partite>0);
  const baseMedia=conStorico.reduce((s,x)=>s+x.partite,0);
  const mediaLega=baseMedia?conStorico.reduce((s,x)=>s+(x.mediaGialli||0)*x.partite,0)/baseMedia:0;
  const scarto=a.mediaGialli!==null?(a.mediaGialli-mediaLega).toFixed(2):null;
  const unGialloOgni=a.gialliPerFallo?(100/a.gialliPerFallo).toFixed(1):null;

  let h=`<button class="back" onclick="chiudiArbitro()">‹ TUTTI GLI ARBITRI</button>

  <div class="scheda-top">
   <div class="scheda-testa">
    ${avatar(a.nome, 54)}
    <div>
    <div class="scheda-nome">${esc(a.nome)}</div>
    <div class="scheda-meta">${a.partite
      ? `${a.partite} partite dirette · ${pos}° su ${totArb} per severità`
      : `nessuna partita ancora in archivio`}</div>
    </div>
   </div>
  </div>`;

  // Designazioni note per partite non ancora giocate
  const pross=a.prossime||[];
  if(pross.length){
    pross.forEach((p,i)=>{
      const ruoli=[];
      if(p.quartoUomo) ruoli.push("IV: "+esc(p.quartoUomo));
      if(p.var) ruoli.push("VAR: "+esc(p.var));
      if(p.avar) ruoli.push("AVAR: "+esc(p.avar));
      h+=`<div class="desig">
        <div class="desig-lab">${i===0?"PROSSIMA DESIGNAZIONE":"POI"}</div>
        <div class="desig-match">${esc(p.casa)} – ${esc(p.ospite)}</div>
        <div class="desig-quando">${dataEstesa(p.data)}${p.ora?" · ore "+esc(p.ora):""}${
          p.giornata?" · giornata "+p.giornata:""}</div>
        ${ruoli.length?`<div class="desig-ruolo">${ruoli.join("  ·  ")}</div>`:""}
      </div>`;
    });
  }

  if(!a.partite){
    return h+`<div class="empty">
      <div style="font-size:10px;color:${MUTED};line-height:1.8">
        Nessuna partita diretta presente in archivio.<br>
        Le statistiche compariranno dopo la prima gara registrata.</div></div>`;
  }

  h+=`
  <div class="dati">
    <div class="dato"><b class="g">${n(a.mediaGialli)}</b><span>GIALLI A PARTITA</span></div>
    <div class="dato"><b class="r">${n(a.mediaRossi)}</b><span>ROSSI A PARTITA</span></div>
    <div class="dato"><b class="n">${a.gialli}</b><span>GIALLI TOTALI</span></div>
    <div class="dato"><b class="n">${a.rossi}</b><span>ROSSI TOTALI</span></div>
    <div class="dato"><b>${n(a.mediaFalli)}</b><span>FALLI FISCHIATI<br>A PARTITA</span></div>
    <div class="dato"><b>${unGialloOgni||"—"}</b><span>FALLI PER OGNI<br>AMMONIZIONE</span></div>
  </div>

  <div class="titolo"><i></i><span>CONFRONTI</span></div>
  <div class="titolo-sub">Come si colloca rispetto al resto del campionato</div>

  <div class="conf">
    <span class="conf-lab">SCARTO DALLA MEDIA DEL CAMPIONATO</span>
    <span class="conf-val" style="color:${scarto>0?ROSSO:FLUO}">${scarto===null?"—":seg(scarto)}</span>
  </div>
  <div class="conf">
    <span class="conf-lab">GIALLI ALLA SQUADRA DI CASA</span>
    <span class="conf-val" style="color:${TESTO}">${n(a.mediaGialliCasa)}</span>
  </div>
  <div class="conf">
    <span class="conf-lab">GIALLI ALLA SQUADRA OSPITE</span>
    <span class="conf-val" style="color:${a.mediaGialliOspite>a.mediaGialliCasa?ROSSO:TESTO}">${n(a.mediaGialliOspite)}</span>
  </div>
  <div class="conf">
    <span class="conf-lab">VITTORIE CASA CON LUI</span>
    <span class="conf-val" style="color:${FLUO}">${n(a.percVittorieCasa)}%</span>
  </div>`;

  if(a.perStagione&&a.perStagione.length>1){
    h+=`<div class="titolo"><i></i><span>ANDAMENTO PER STAGIONE</span></div>

        </tr></thead><tbody>`;

  if(a.elenco&&a.elenco.length){

        </tr></thead><tbody>`;
    a.elenco.forEach(p=>{
      const gt=(p.gialliCasa||0)+(p.gialliOspite||0);
      const rt=(p.rossiCasa||0)+(p.rossiOspite||0);
      const ft=(p.falliCasa||0)+(p.falliOspite||0);
      h+=`<tr>
        <td style="line-height:1.5">
          <span style="font-size:13px">${esc(p.casa)} – ${esc(p.ospite)}</span>
          <span style="display:block;font-size:10px;color:${MUTED}">${esc(p.data)}</span>
        </td>
        <td style="color:${FLUO};font-weight:700">${n(p.gc,"?")}-${n(p.go,"?")}</td>
        <td class="gial">${gt}</td>
        <td class="${rt>0?"ros":""}">${rt||"–"}</td>
        <td>${ft||"–"}</td>
      </tr>`;
    });
    h+=`</tbody></table>`;
  }
  return h;
}

    ? (lista.reduce((s,x)=>s+(x.mediaFatti||0),0)/lista.length).toFixed(1) : "—";

  let h=`<div class="sub" style="margin-top:0">
      ${esc(D.campionato||"")} · classifica per stagione</div>
    <div class="filtri">
      <input class="cerca" type="search" placeholder="Cerca squadra o conference…"
             value="${esc(ricerca)}" oninput="cercaSquadra(this.value)">
      ${barraAnni()}
      ${barraGruppi()}
      <div class="conteggio">
        ${lista.length} squadre · ${gio} presenze
        ${annoFootball!=="tutte"?" · stagione "+esc(annoFootball):" · tutte le stagioni"}
      </div>
    </div>`;

  if(!lista.length){
    return h+`<div class="empty"><div class="fb-note">
      Nessuna squadra ha giocato in questa stagione.</div></div>`;
  }

  h+=`${kpi([lista.length,"SQUADRE"],[gio,"PARTITE"],[pf,"PUNTI MEDI"])}
    <div class="titolo"><i></i><span>CLASSIFICA</span></div>
    <div class="titolo-sub">Tocca un'intestazione per ordinare · PF e PS = punti fatti e subiti a partita</div>
    <div class="fb-scroll"><table class="tab fb-classifica"><thead><tr>
      ${th("squadre","nome","Squadra",true)}
      ${th("squadre","partite","PG")}
      ${th("squadre","vittorie","V")}
      ${th("squadre","sconfitte","S")}
      ${th("squadre","percVittorie","%")}
      ${th("squadre","mediaFatti","PF")}
      ${th("squadre","mediaSubiti","PS")}
      ${th("squadre","differenza","DIFF")}
      <th></th>
    </tr></thead><tbody>`;

  lista.forEach((x,i)=>{
    h+=`<tr class="click" onclick="apriSquadra('${esc(x.nome).replace(/'/g,"\\'")}')">
      <td><span class="fb-cella-sq"><span class="pos">${i+1}</span>${stemma(x.nome,true)}<span><span class="nome lungo">${esc(x.sq.nomeCompleto||x.nome)}</span><span class="nome corto">${esc(breve(x.nome))}</span>${
        (x.sq.division||x.conferenza)
          ? `<span class="fb-mini">${esc(x.sq.division||x.conferenza)}</span>`
          : ""}</span></span></td>
      <td>${n(x.partite)}</td>
      <td class="big">${n(x.vittorie)}</td>
      <td>${n(x.sconfitte)}</td>
      <td>${n(x.percVittorie)}</td>
      <td>${n(x.mediaFatti)}</td>
      <td>${n(x.mediaSubiti)}</td>
      <td class="${x.differenza<0?"ros":""}">${x.differenza===null||x.differenza===undefined?"—":seg(x.differenza)}</td>
      <td class="freccia">›</td>
    </tr>`;
  });
  return h+`</tbody></table></div>`;
}

/* Elenco compatto dei giocatori di riferimento di una squadra.
   Servono a dare contesto alla partita: chi la decide, con il rendimento
   di stagione accanto. Non è l'organico completo, sono i tre o quattro
   nomi di cui si parla prima del calcio d'inizio. */
/* '2026-09-13' -> 'domenica 13 settembre' */
function dataBreve(iso){
  if(!iso) return "";
  const d=new Date(iso+"T12:00:00");
  if(isNaN(d.getTime())) return iso;
  return d.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"});
}

/* Il file delle partite riporta le sigle; il nome per esteso sta
   nell'anagrafica delle squadre. Le sigle sono chiare solo a chi segue
   il campionato da anni. */
function nomeSquadra(sigla){
  const s=(D.squadre||[]).find(x=>x.nome===sigla);
  return (s && s.nomeCompleto) || sigla;
}

/* College: i tabellini danno il migliore per categoria, non il ruolo (il QB che corre è il miglior corridore) */
const RUOLI_CATEGORIA={QB:"PASS",RB:"CORSA",WR:"RIC"};
function rosa(titolo, giocatori){
  if(!giocatori || !giocatori.length) return "";
  return `<div>
    <div class="rosa-tit">${esc(titolo)}</div>
    ${giocatori.map(g=>`<div class="gio">
      <span class="gio-r${legaAttiva==="college"?" cat":""}">${esc(legaAttiva==="college"?(RUOLI_CATEGORIA[g.ruolo]||g.ruolo):g.ruolo)}</span><span class="gio-n">${esc(g.nome)}</span>
      <span class="gio-v"><b>${n(g.valore)}</b> ${esc(g.misura)}${
        g.dettagli && g.dettagli.length ? " · "+esc(g.dettagli.join(", ")) : ""}</span>
    </div>`).join("")}
  </div>`;
}

function apriGruppo(chiave){
  settimaneAperte.has(chiave) ? settimaneAperte.delete(chiave) : settimaneAperte.add(chiave);
  render();
}
function apriPartita(chiave){
  partiteAperte.has(chiave) ? partiteAperte.delete(chiave) : partiteAperte.add(chiave);
  render();
}

function apriSquadra(nome){ squadraAperta=nome; window.scrollTo(0,0); render(); }
function chiudiSquadra(){ squadraAperta=null; window.scrollTo(0,0); render(); }

function vFootballPartite(){
  const P=D.ultimePartite||[];
  if(!P.length) return `<div class="sub" style="margin-top:0">Nessuna partita in archivio</div>`;

  if(annoFootball===null) annoFootball = annoPredefinito(D) || "tutte";
  const sue = annoFootball==="tutte" ? P : P.filter(p=>p.stagione===annoFootball);

  let h=`<div class="sub" style="margin-top:0">Calendario completo · tocca una settimana per aprirla</div>
    <div class="filtri">${barraAnni()}
      <div class="conteggio">${sue.length} partite
        ${annoFootball!=="tutte"?" · stagione "+esc(annoFootball):""}</div>
    </div>`;

  if(!sue.length){
    return h+`<div class="empty"><div class="fb-note">
      Nessuna partita in questa stagione.</div></div>`;
  }

  const gruppi=[];
  sue.forEach(p=>{
    const k = `${p.stagione}|${p.settimana||"?"}`;
    const ultimo = gruppi[gruppi.length-1];
    if(ultimo && ultimo.chiave===k) ultimo.gare.push(p);
    else gruppi.push({chiave:k, stagione:p.stagione, settimana:p.settimana,
                      tipo:p.tipo, gare:[p]});
  });

  h += `<div class="titolo"><i></i><span>WEEK</span></div>
        <div class="titolo-sub">${gruppi.length} week · tocca per vedere le partite</div>`;

  gruppi.forEach(g=>{
    const aperto = settimaneAperte.has(g.chiave);
    // 'Week' è il termine con cui si indica il turno nel football
    const titolo = g.settimana && g.settimana!=="?"
      ? `WEEK ${esc(g.settimana)}` : "PARTITE";
    const disputate = g.gare.filter(x=>x.pc!==null&&x.pc!==undefined).length;

    h += `<button class="gruppo${aperto?" on":""}" onclick="apriGruppo('${esc(g.chiave)}')">
      <span class="gruppo-tit">${titolo}</span>
      <span class="gruppo-sub">${g.gare.length} gare${
        disputate<g.gare.length?` · ${disputate} disputate`:""}${
        annoFootball==="tutte"?" · "+esc(g.stagione):""}</span>
      <span class="gruppo-freccia">${aperto?"▴":"▾"}</span>
    </button>`;

    if(!aperto) return;

    h += `<div class="gruppo-corpo grid">`;
    // dentro la week per orario d'inizio italiano (le partite senza ora in fondo alla loro giornata)
    const quandoIt = p => (p.dataIt||p.data||"") + "T" + (p.oraIt||"99");
    [...g.gare].sort((a,b)=>quandoIt(a).localeCompare(quandoIt(b))).forEach(p=>{
      const kp = `${p.stagione}|${p.settimana}|${p.casa}|${p.ospite}`;
      const disputata = p.pc!==null && p.pc!==undefined;
      const casa = p.giocatoriCasa || [];
      const osp  = p.giocatoriOspite || [];
      const conRose = casa.length || osp.length;
      const rosaAperta = partiteAperte.has(kp);

      h += `<div class="gara">
        <div class="gara-squadre">
          <span class="fb-sq-sx">${stemma(p.ospite,true)}<span class="nome lungo">${esc(nomeSquadra(p.ospite))}</span><span class="nome corto">${esc(breve(p.ospite))}</span></span>
          <span class="vs">${disputata?`${p.po}\u2013${p.pc}`:"@"}</span>
          <span class="fb-sq-dx"><span class="nome lungo">${esc(nomeSquadra(p.casa))}</span><span class="nome corto">${esc(breve(p.casa))}</span>${stemma(p.casa,true)}</span>
        </div>
        <div class="fb-stack">
          <div class="fb-team${disputata&&p.po>p.pc?" w":""}">${stemma(p.ospite,true)}<span class="n">${esc(breve(p.ospite))}</span><span class="s">${disputata?p.po:""}</span></div>
          <div class="fb-team${disputata&&p.pc>p.po?" w":""}">${stemma(p.casa,true)}<span class="n">${esc(breve(p.casa))}</span><span class="s">${disputata?p.pc:""}</span></div>
        </div>
        <div class="gara-arb">${disputata?"":"da giocare · "}${esc(dataBreve(p.dataIt||p.data))}${p.oraIt?" · ore "+esc(p.oraIt):(disputata?"":" · orario da definire")}${p.stadio?" · "+esc(p.stadio):""}</div>
        ${linkArticolo(p, p.stagione, p.settimana)?`<div class="ar-link-riga">${linkArticolo(p, p.stagione, p.settimana)}</div>`:""}
        ${conRose ? `<button class="toggle-gio" onclick="apriPartita('${esc(kp).replace(/'/g,"\\'")}')">
            ${rosaAperta?"▴ NASCONDI":"▾ MIGLIORI DELLA PARTITA"}</button>` : ""}
        ${conRose && rosaAperta
          ? `<div class="rose">${rosa(p.ospite, osp)}${rosa(p.casa, casa)}</div>` : ""}
      </div>`;
    });
    h += `</div>`;
  });
  return h;
}

/* ---------- GIORNATA, PROSSIMA E INDICI (football) ----------
   Dati statistici e di mercato pubblici: risultati con la linea di chiusura,
   prestazioni migliori, confronti tra giocatori, forza delle squadre.
   Nessuna giocata e nessuna segnalazione di valore. */

function _lum(hex){
  const h=(hex||"#555555").replace("#","");
  const c=[0,2,4].map(i=>parseInt(h.substr(i,2),16)/255).map(v=>v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4));
  return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2];
}
/* Logo ufficiale se c'è; altrimenti un cerchio con il colore e la sigla della squadra */
function stemma(sigla, piccolo){
  const l=(D.loghi||{})[sigla]||(D.loghiExtra||{})[sigla]||{};   // loghiExtra: squadre FCS (loghi ESPN)
  const cl=piccolo?" s":"";
  if(l.logo && /^https:\/\//.test(l.logo))
    return `<img class="fb-logo${cl}" src="${esc(l.logo)}" alt="" onerror="this.style.visibility='hidden'">`;
  const col=l.colore||"#555555", fg=_lum(col)>0.35?"#111111":"#FFFFFF";
  const sig=String(sigla||"").slice(0,4).toUpperCase();
  return `<span class="fb-badge${cl}" aria-hidden="true" style="background:${esc(col)};color:${fg}">${esc(sig)}</span>`;
}
function breve(sigla){ const l=(D.loghi||{})[sigla]; return (l&&l.breve)||nomeSquadra(sigla); }
function numIt(x,dec){
  if(x===null||x===undefined) return "—";
  const d = dec===undefined ? 1 : dec;
  let t=Number(x).toFixed(d).replace(".",",");
  if(d===1 && t.endsWith(",0")) t=t.slice(0,-2);
  return t;
}
const GIORNI_IT=["dom","lun","mar","mer","gio","ven","sab"], MESI_IT=["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
function giornoIt(iso){
  if(!iso) return "";
  const d=new Date(iso+"T12:00:00");
  return `${GIORNI_IT[d.getDay()]} ${d.getDate()} ${MESI_IT[d.getMonth()]}`;
}

function schedaRisultato(g){
  const giocata = g.pc!==null && g.pc!==undefined;
  const vinceOsp = giocata && g.po>g.pc, vinceCasa = giocata && g.pc>g.po;
  const riga=(sig,pt,w)=>`<div class="fb-team${w?" w":""}">${stemma(sig)}<span class="n">${esc(breve(sig))}</span><span class="s">${giocata?pt:""}</span></div>`;
  let chips="";
  if(giocata && g.favorita){
    const ok = g.battutaDa && g.battutaDa===g.favorita;
    chips += `<span class="fb-chip${ok?" ok":""}">Linea ${esc(g.favorita)} −${numIt(g.linea)} · ${
      ok?"rispettata":(g.battutaDa?"ribaltata da "+esc(g.battutaDa):"pari")}</span>`;
  } else if(g.favorita){
    chips += `<span class="fb-chip">Favorita ${esc(g.favorita)} di ${numIt(g.linea)}</span>`;
  }
  if(g.totaleLinea!==null && g.totaleLinea!==undefined){
    chips += giocata && g.totaleEsito
      ? `<span class="fb-chip">Totale ${numIt(g.totaleLinea)} · ${g.totaleEsito.toUpperCase()} (${g.pc+g.po})</span>`
      : `<span class="fb-chip">Totale ${numIt(g.totaleLinea)}</span>`;
  }
  chips += linkArticolo(g, g.stagione || (D.prossima||{}).stagione, g.settimana || (D.prossima||{}).settimana);
  // video ufficiale trovato: anteprima che diventa il lettore al tocco (si carica solo se lo si guarda)
  const vid = g.video && /^[A-Za-z0-9_-]{6,20}$/.test(g.video.id||"") ? g.video.id : "";
  if(vid){
    return `<article class="fb-game">
    <div class="fb-when">${esc(giornoIt(g.dataIt||g.data))}${(g.oraIt||g.ora)?" · "+esc(g.oraIt||g.ora):(giocata?"":" · orario da definire")}${giocata?" · Finale":" · da giocare"}</div>
    ${riga(g.ospite,g.po,vinceOsp)}${riga(g.casa,g.pc,vinceCasa)}
    ${chips?`<div class="fb-chips">${chips}</div>`:""}
    <a class="fb-video" href="https://www.youtube.com/watch?v=${vid}" target="_blank" rel="noopener" aria-label="Guarda gli highlights su YouTube: ${esc(g.video.titolo||"")}">
      <img src="https://i.ytimg.com/vi/${vid}/hqdefault.jpg" alt="" loading="lazy">
      <span class="play" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><polygon points="7 4 20 12 7 20 7 4"/></svg></span>
      <span class="tit">${esc(g.video.etichetta||"Highlights ufficiali NFL · si apre su YouTube")}</span>
    </a>
    ${momenti(g)}
  </article>`;
  }
  const hl = g.highlights && /^https:\/\/www\.youtube\.com\//.test(g.highlights)
    ? `<a class="fb-hl" href="${esc(g.highlights)}" target="_blank" rel="noopener">
         <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polygon points="6 4 20 12 6 20 6 4"/></svg>
         Cerca il video degli highlights</a>` : "";
  const mom = momenti(g);
  return `<article class="fb-game">
    <div class="fb-when">${esc(giornoIt(g.dataIt||g.data))}${(g.oraIt||g.ora)?" · "+esc(g.oraIt||g.ora):(giocata?"":" · orario da definire")}${giocata?" · Finale":" · da giocare"}</div>
    ${riga(g.ospite,g.po,vinceOsp)}${riga(g.casa,g.pc,vinceCasa)}
    ${chips?`<div class="fb-chips">${chips}</div>`:""}
    ${mom}${hl}
  </article>`;
}

/* momenti decisivi: le azioni che hanno spostato di più la probabilità di vittoria (dall'azione per azione) */
function momenti(g){
  return (g.momenti||[]).length ? `<details class="fb-mom"><summary>Momenti decisivi (${g.momenti.length})</summary>
    <ol>${g.momenti.map(m=>{
      const casa=breve(g.casa);
      const freccia = m.casaDopo>m.casaPrima ? "▲" : "▼";
      const clip = m.clip && /^[A-Za-z0-9_-]{6,20}$/.test(m.clip.id||"")
        ? `<a class="fb-clip" href="https://www.youtube.com/watch?v=${m.clip.id}" target="_blank" rel="noopener">
             <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="6 4 20 12 6 20 6 4"/></svg>
             Guarda la giocata</a>` : "";
      return `<li><span class="q">${esc(m.quarto)}° quarto · ${esc(m.tempo)} · ${esc(m.squadra||"")}${m.touchdown?" · TOUCHDOWN":""}</span>
        ${esc(m.testo||m.descrizione)}${clip}
        <span class="wp">Probabilità di vittoria ${esc(casa)}: ${m.casaPrima}% ${freccia} ${m.casaDopo}%</span></li>`;}).join("")}</ol></details>` : "";
}

/* La NFL non permette di guardare i suoi video fuori da YouTube: l'anteprima apre il video
   su YouTube (sul telefono nell'app, se installata). */

function listaLeader(titolo, lista){
  if(!lista || !lista.length) return "";
  return `<h3 class="fb-h3">${titolo}</h3><ul class="fb-list">${lista.slice(0,5).map(x=>`
    <li class="fb-row">${stemma(x.squadra,true)}
      <span class="fb-row-t">${esc(x.nome)}<small>contro ${esc(x.avversario||"")}${x.dettagli?" · "+esc(x.dettagli):""}</small></span>
      <span class="fb-num">${numIt(x.valore, x.valore%1?1:0)}</span></li>`).join("")}</ul>`;
}

/* Giornata (16/11/2026, impaginazione A): in alto i numeri della week e il podio, poi il tabellone con tutte le
   partite in schede uguali, poi le sezioni a schede (una alla volta, sempre a tutta larghezza: niente buchi). */
let schedaGiornata="giocate";
function vFootballGiornata(){
  const G=D.giornata;
  if(!G) return `<p class="fb-lead">Nessuna giornata disponibile</p>`;
  const r=G.riepilogo||{}, ss=G.squadreSettimana, sorp=(G.sorprese||[])[0];
  const conConf=(G.partite||[]).some(g=>g.confCasa);
  const nelGruppo=g=>gruppoFootball==="tutti"||g.confCasa===gruppoFootball||g.confOspite===gruppoFootball;
  const ris=(G.partite||[]).filter(nelGruppo);
  const numeri=`<div class="fb-tiles gio-numeri">
    <div class="fb-tile"><b>${n(r.partite)}</b><span>Partite giocate</span></div>
    <div class="fb-tile"><b>${n(r.favoriteCoperte)}</b><span>Favorite oltre la linea</span></div>
    <div class="fb-tile"><b>${n(r.over)}<small> / ${n(r.under)}</small></b><span>Over / under</span></div>
    ${sorp?`<div class="fb-tile"><b>+${numIt(sorp.scarto)}</b><span>Sorpresa: ${esc(breve(sorp.battutaDa))} oltre la linea</span></div>`
          :`<div class="fb-tile"><b>—</b><span>Sorpresa della week</span></div>`}
  </div>`;
  const podio=ss&&(ss.migliori||[]).length?`<h2 class="fb-h2">Le squadre della week</h2>
    <div class="gio-podio">${ss.migliori.slice(0,3).map((x,i)=>`<div class="fb-tile gio-pos">
      <span class="gio-n">${i+1}°</span>${stemma(x.squadra)}<div><b>${esc(breve(x.squadra))}</b>
      <span>${segnoGio(x.netto)} · contro ${esc(breve(x.avversario))}</span></div></div>`).join("")}</div>`:"";
  return `
  <h1 class="fb-h1">${esc(D.campionato||"")} · Week ${esc(G.settimana)}${G.completa?"":" (in corso)"}</h1>
  <p class="fb-lead">Stagione ${esc(G.stagione)} · risultati con la linea di chiusura del mercato</p>
  ${numeri}${podio}
  <h2 class="fb-h2">Risultati <span class="gio-conta">${ris.length} partite</span></h2>
  ${conConf?barraGruppi():""}
  <div class="gio-tab">${ris.map(schedaTabellone).join("")}</div>
  <div id="gio-sezioni">${sezioniGiornata(G)}</div>`;
}
function segnoGio(v,c){ return v===null||v===undefined?"—":(v>0?"+":"")+numIt(v,c===undefined?2:c); }
function scegliSchedaGiornata(k){
  schedaGiornata=k;
  const el=document.getElementById("gio-sezioni");
  if(el) el.innerHTML=sezioniGiornata(D.giornata);       // solo le sezioni: la pagina non salta in cima
}

/* Una partita nel tabellone: sempre la stessa forma (niente anteprima grande del video, che allungava la scheda) */
function schedaTabellone(g){
  const giocata = g.pc!==null && g.pc!==undefined;
  const vinceOsp = giocata && g.po>g.pc, vinceCasa = giocata && g.pc>g.po;
  const riga=(sig,pt,w)=>`<div class="fb-team${w?" w":""}">${stemma(sig,true)}<span class="n">${esc(breve(sig))}</span><span class="s">${giocata?pt:""}</span></div>`;
  let esito="";
  if(giocata && g.favorita){
    const ok = g.battutaDa && g.battutaDa===g.favorita;
    esito += `<span class="fb-chip${ok?" ok":""}">${esc(g.favorita)} −${numIt(g.linea)} · ${ok?"rispettata":(g.battutaDa?"ribaltata":"pari")}</span>`;
  } else if(g.favorita) esito += `<span class="fb-chip">${esc(g.favorita)} −${numIt(g.linea)}</span>`;
  if(g.totaleLinea!==null && g.totaleLinea!==undefined)
    esito += `<span class="fb-chip">${giocata&&g.totaleEsito?(g.totaleEsito==="over"?"Over ":g.totaleEsito==="under"?"Under ":"Pari ")+numIt(g.totaleLinea):"Totale "+numIt(g.totaleLinea)}</span>`;
  const vid = g.video && /^[A-Za-z0-9_-]{6,20}$/.test(g.video.id||"") ? g.video.id : "";
  const play=`<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="6 4 20 12 6 20 6 4"/></svg>`;
  const video = vid ? `<a class="gio-azione" href="https://www.youtube.com/watch?v=${vid}" target="_blank" rel="noopener" title="${esc(g.video.titolo||"")}">${play} Highlights</a>`
    : g.highlights && /^https:\/\/www\.youtube\.com\//.test(g.highlights) ? `<a class="gio-azione" href="${esc(g.highlights)}" target="_blank" rel="noopener">${play} Cerca video</a>` : "";
  const mom = momenti(g);
  return `<article class="fb-game gio-gara">

}

  if(!schede.length) return "";

}

function stRating(a){                                      // rating NFL dei passatori
  if(!a.attempts) return null;
  const c=x=>Math.max(0,Math.min(2.375,x)), t=a.attempts;
  return (c((a.completions/t-.3)*5)+c((a.passing_yards/t-3)*.25)+c(a.passing_tds/t*20)+c(2.375-a.passing_interceptions/t*25))/6*100;
}

const ST_NOMI = {passaggi:"Passaggi",corse:"Corse",ricezioni:"Ricezioni",difesa:"Difesa",calci:"Calci",punt:"Punt",ritorni:"Ritorni"};

function stCarica(file){
  if(!ST_CACHE[file]) ST_CACHE[file] = fetch("stats/"+file+"?t="+Math.floor(Date.now()/600000))
    .then(r=>{ if(!r.ok) throw new Error(file); return r.json(); })
    .catch(e=>{ delete ST_CACHE[file]; throw e; });
  return ST_CACHE[file];
}
function stIndice(lega){
  if(ST_INDICE[lega]) return Promise.resolve(ST_INDICE[lega]);
  return fetch(`stats/indice_${lega}.json?t=`+Math.floor(Date.now()/600000)).then(r=>r.ok?r.json():null).then(d=>{ if(d) ST_INDICE[lega]=d; return d; });
}
function stSettimane(tutte){
  if(ST.periodo==="tutta") return null;
  if(ST.periodo.startsWith("u")) return new Set(tutte.slice(-Number(ST.periodo.slice(1))));
  return new Set([Number(ST.periodo.slice(1))]);
}
/* somma le righe del periodo per giocatore o per squadra */
function stAggrega(dati, tutte){
  const w=stSettimane(tutte), basi=dati.basi, mx=new Set(dati.max||[]), gruppi=new Map();
  for(const r of dati.righe){
    if(w && !w.has(r[1])) continue;
    const sq=r[2], avv=r[3];
    let chiave;
    if(ST.modo==="giocatori"){ if(ST.squadra && dati.squadre[sq]!==ST.squadra) continue; chiave=r[0]; }
    else chiave = ST.lato==="fatte" ? sq : avv;
    let a=gruppi.get(chiave);
    if(!a){ a={id:chiave, settimane:new Set(), ultimaW:-1, sq:null}; basi.forEach(b=>a[b]=0); gruppi.set(chiave,a); }
    basi.forEach((b,i)=>{ const v=r[4+i]; a[b] = mx.has(b) ? Math.max(a[b],v) : a[b]+v; });
    a.settimane.add(r[1]+"|"+(ST.modo==="giocatori"?"":sq+"-"+avv));
    if(r[1]>=a.ultimaW){ a.ultimaW=r[1]; a.sq=dati.squadre[sq]; }
  }
  const out=[...gruppi.values()];
  out.forEach(a=>{ a.g = ST.modo==="giocatori" ? new Set([...a.settimane].map(x=>x.split("|")[0])).size : a.settimane.size;
    if(ST.modo==="squadre") a.sq = dati.squadre[a.id]; });
  return out;
}
function stValore(col, a){
  const v=col[2](a);
  if(v===null||v===undefined||!isFinite(v)) return null;
  return (ST.misura==="pg" && !col[4] && a.g) ? v/a.g : v;
}
function stFmt(v, col){
  if(v===null) return "—";
  const dec = ST.misura==="pg" && !col[4] ? Math.max(col[3]||0,1) : (col[3]||0);
  const s = v.toLocaleString("it-IT",{minimumFractionDigits:dec,maximumFractionDigits:dec,useGrouping:"always"});
  return col[0]==="epa" && v>0 ? "+"+s : s;
}


/* ===================== ARTICOLI (dal 19/11/2026): anteprime e cronache scritte da Claude su fatti verificati ===================== */
let ART=null, ART_APERTO=null;
const ART_CACHE={};
function caricaArticoli(){
  if(ART!==null) return;
  ART=[];
  scaricaDati("articoli/indice.json").then(x=>{ ART=Array.isArray(x)?x:[]; render(); }).catch(()=>{});
}
function articoliDi(g, stagione, settimana){
  // gli articoli di una partita (anteprima e cronaca), riconosciuti da stagione, week e squadre
  if(!ART) { caricaArticoli(); return []; }
  const st = stagione || g.stagione, w = settimana || g.settimana;
  const pref = st && w ? `${st}_${String(w).padStart(2,"0")}_${g.ospite}_${g.casa}_` : null;
  return ART.filter(a=>a.lega===legaAttiva && (pref ? a.id.startsWith(pref) : (a.ospite===g.ospite && a.casa===g.casa)))
            .sort((x,y)=>x.tipo==="anteprima"?-1:1);
}
function linkArticolo(g, stagione, settimana){
  const lista = articoliDi(g, stagione, settimana);
  if(!lista.length) return "";
  return lista.map(a=>`<a class="ar-link ${esc(a.tipo)}" href="#articolo=${esc(a.id)}" onclick="event.stopPropagation();apriArticolo('${esc(a.id)}');return false">📰 ${a.tipo==="cronaca"?"Cronaca":"Anteprima"}</a>`).join("");
}
function apriArticolo(id){
  ART_APERTO=id; vista="articoli"; arbitroAperto=null;
  try{ history.replaceState(null,"","#articolo="+id); }catch(e){}
  window.scrollTo(0,0); render();
}
function chiudiArticolo(){
  ART_APERTO=null;
  try{ history.replaceState(null,"",location.pathname); }catch(e){}
  window.scrollTo(0,0); render();
}
function dataLungaIt(iso){ return iso ? giornoIt(iso) : ""; }
function vArticoli(){
  caricaArticoli();
  if(ART_APERTO) return vArticolo(ART_APERTO);
  const lista=(ART||[]).filter(a=>a.lega===legaAttiva);
  return `<h1 class="fb-h1">Articoli</h1>
  <p class="fb-lead">Anteprime e cronache delle partite più importanti della settimana.</p>
  ${lista.length?`<div class="ar-elenco">${lista.map(a=>`
    <a class="ar-voce" href="#articolo=${esc(a.id)}" onclick="apriArticolo('${esc(a.id)}');return false">
      <span class="ar-loghi">${stemma(a.ospite,true)}${stemma(a.casa,true)}</span>
      <span class="ar-testo"><span class="ar-tag ${esc(a.tipo)}">${a.tipo==="cronaca"?"Cronaca":"Anteprima"}</span>
      <b>${esc(a.titolo)}</b><small>${esc(breve(a.ospite))}–${esc(breve(a.casa))} · Week ${esc(a.settimana)} · ${esc(dataLungaIt(a.dataIt))}</small></span>

/* Scheda del giocatore: numeri della stagione con la posizione nella lega, grafico e partite week per week */
function stScheda(dati, tutte){
  const spec=ST_COL[legaAttiva][ST.cat], g=dati.giocatori[ST.scheda]||["?",""];
  const salva={...ST}; ST.modo="giocatori"; ST.squadra=""; ST.cerca=""; ST.misura="tot";
  const tutti=stAggrega(dati, tutte), io=tutti.find(a=>a.id===ST.scheda);
  const pool = spec.q ? tutti.filter(spec.q[0]) : tutti;
  Object.assign(ST,{modo:salva.modo,squadra:salva.squadra,cerca:salva.cerca,misura:salva.misura});
  if(!io) return `<button class="st-altri" onclick="stChiudi()">← Torna alla classifica</button><p class="fb-lead">Nessuna partita nel periodo scelto.</p>`;
  const ST_KPI = {passaggi:["yds","td","rat","eff","epa","ypa"],corse:["yds","td","ypc","epa","lng"],ricezioni:["yds","rec","td","ypr"],
    difesa:["tk","sk","int","ff","hur"],calci:["fgm","pct","lng","xpm"],punt:["avg","net","i20","lng"],ritorni:["kry","pry","td","kra"]};
  const principali = ST_KPI[ST.cat].map(k=>spec.c.find(c=>c[0]===k)).filter(Boolean).slice(0,4);
  const kpi = principali.map(c=>{
    const v=c[2](io); if(v===null||!isFinite(v)) return "";
    const valori=pool.map(a=>c[2](a)).filter(x=>x!==null&&isFinite(x)).sort((a,b)=>b-a);
    const pos=valori.findIndex(x=>x<=v)+1, media=valori.length?valori.reduce((s,x)=>s+x,0)/valori.length:null;
    const nota = pos && pool.includes(io) ? `${pos}° su ${valori.length}` : (media!==null?`media ${numIt(media,c[3]||0)}`:"");
    return `<div><b>${stFmt(v,c)}</b><span>${esc(c[1])}</span><em>${nota}</em></div>`; }).join("");
  const mie = dati.righe.filter(r=>r[0]===ST.scheda).sort((a,b)=>a[1]-b[1]);
  const somma = r => { const a={g:1}; dati.basi.forEach((b,i)=>a[b]=r[4+i]); return a; };
  const cg = spec.c.find(c=>c[0]===(ST.ord||spec.o))||spec.c[0];
  const vals = mie.map(r=>cg[2](somma(r))||0), mx=Math.max(1,...vals.map(Math.abs));
  const barre = mie.map((r,i)=>`<div class="st-bar" title="Week ${r[1]}: ${stFmt(vals[i],cg)}"><i style="height:${Math.round(Math.abs(vals[i])/mx*100)}%"></i><span>${r[1]}</span></div>`).join("");
  const partite = mie.slice().reverse().map(r=>{ const a=somma(r);
    return `<tr><td>W${r[1]}</td><td class="st-nome">${stemma(dati.squadre[r[3]],true)}<span>${esc(breve(dati.squadre[r[3]]))}</span></td>${spec.c.map(c=>`<td>${stFmt(c[2](a)===undefined?null:(isFinite(c[2](a))?c[2](a):null),c)}</td>`).join("")}</tr>`; }).join("");
  return `<button class="st-altri" style="margin:0 0 14px" onclick="stChiudi()">← Torna alla classifica</button>
  <div class="st-testata">${stemma(io.sq)}<div><h1>${esc(g[0])}</h1><span class="st-nota">${esc(breve(io.sq))}${g[1]?" · "+esc(g[1]):""} · ${ST_NOMI[ST.cat]} · stagione ${ST.stagione}${ST.periodo==="tutta"?"":" · numeri: "+(ST.periodo.startsWith("u")?"ultime "+ST.periodo.slice(1)+" week":"week "+ST.periodo.slice(1))}</span></div></div>
  <div class="st-cat">${Object.keys(ST_COL[legaAttiva]).map(c=>`<button class="${ST.cat===c?"on":""}" onclick="stAggiorna('cat','${c}')">${ST_NOMI[c]}</button>`).join("")}</div>
  <div class="st-kpi">${kpi}</div>
  <div class="st-scheda"><div class="st-grafico"><b>${esc(cg[1].toUpperCase())} WEEK PER WEEK</b><div class="st-barre">${barre}</div></div>
  <div class="st-tab"><table><thead><tr><th>Week</th><th class="st-nome">Avversario</th>${spec.c.map(c=>`<th>${esc(c[1])}</th>`).join("")}</tr></thead><tbody>${partite}</tbody></table></div></div>`;
}

/* Un giocatore nel confronto: rendimento stagione, ultime 3, passato, esperienza e forma */
function rigaGiocatore(p){
  const tagEsp = p.esperienza ? `<span class="fb-tag${p.giovane?" g":""}">${esc(p.esperienza)}</span>` : "";
  const tagForma = p.forma==="in forma" ? `<span class="fb-tag up">▲ in forma</span>`
                 : p.forma==="in calo" ? `<span class="fb-tag">▼ in calo</span>` : "";
  let m = `${esc(p.misura)}: stagione ${numIt(p.mediaStagione)} · ultime 3 ${numIt(p.mediaUltime3)}`
        + (p.mediaPassato!==null && p.mediaPassato!==undefined ? ` · stagioni prima ${numIt(p.mediaPassato)}` : "");
  if(p.ruolo==="QB" && p.epaLancio!==undefined){
    m += `<br>EPA a lancio: stagione ${p.epaLancio===null?"—":numIt(p.epaLancio,3)} · ultime 3 ${
      p.epaLancioUltime3===null?"—":numIt(p.epaLancioUltime3,3)}${
      p.epaLancioPassato!==null&&p.epaLancioPassato!==undefined?" · prima "+numIt(p.epaLancioPassato,3):""} · ${n(p.td)} TD, ${n(p.int)} INT`;
  }
  if(p.nota) m += `<br>${esc(p.nota)}`;
  return `<div class="fb-pl"><b>${esc(p.nome)}</b> <span class="fb-tag">${esc(p.ruolo)}</span>${tagEsp}${tagForma}<span class="m">${m}</span></div>`;
}

/* Il campionato australiano fornisce le sole classifiche arbitrali,
   già aggregate dalla fonte: non ci sono partite né squadre, quindi

function vArbitriAleague(){
  const A = D.arbitri || [];
  if(!A.length){
    return `<div class="sub" style="margin-top:0">Nessun dato disponibile</div>`;
  }

  const q = ricerca.trim().toLowerCase();
  const o = ord.arbitri;
  const lista = A
    .filter(a=>!q || a.nome.toLowerCase().includes(q)
                  || (a.nazionalita||"").toLowerCase().includes(q))
    .slice()
    .sort((a,b)=>confronta(a,b,o.campo,o.dir) || a.nome.localeCompare(b.nome));

  const conMedia = lista.filter(a=>a.mediaCartellini!==null&&a.mediaCartellini!==undefined);
  const media = conMedia.length
    ? (conMedia.reduce((s,a)=>s+a.mediaCartellini,0)/conMedia.length).toFixed(2) : "—";
  const partite = lista.reduce((s,a)=>s+(a.partite||0),0);

  let h = `<div class="sub" style="margin-top:0">
      ${esc(D.campionato||"")} · medie fornite dalla fonte</div>
    <div class="filtri">
      <input class="cerca" type="search" placeholder="Cerca arbitro…"
             value="${esc(ricerca)}" oninput="cercaSquadra(this.value)">
      <div class="conteggio">${lista.length} arbitri · ${partite} presenze
        ${D.stagione && D.stagione!=="tutte" ? " · stagione "+esc(D.stagione) : ""}</div>
    </div>
    ${kpi([lista.length,"ARBITRI"],[partite,"PRESENZE"],[media,"CART / PARTITA"])}
    <div class="titolo"><i></i><span>CLASSIFICA SEVERITÀ</span></div>
    <div class="titolo-sub">Tocca un'intestazione per ordinare</div>
    <table class="tab"><thead><tr>
      ${th("arbitri","nome","Arbitro",true)}
      ${th("arbitri","partite","PG")}
      ${th("arbitri","mediaCartellini","CART")}
      ${th("arbitri","mediaGialli","GIA")}
      ${th("arbitri","rossi","ROS")}
      <th></th>
    </tr></thead><tbody>`;

  lista.forEach((a,i)=>{
    const storico = (a.perStagione||[]).length;
    h += `<tr class="click" onclick="apriArbitroAleague('${esc(a.nome).replace(/'/g,"\\'")}')">
      <td><span class="pos">${i+1}</span><span class="nome">${esc(a.nome)}</span>${
        storico?`<span style="display:block;font-size:8px;color:${MUTED}">${storico} stagioni</span>`:""}</td>
      <td>${n(a.partite)}</td>
      <td class="big">${n(a.mediaCartellini)}</td>
      <td class="gia">${n(a.mediaGialli)}</td>
      <td class="${a.rossi>0?"ros":""}">${n(a.rossi)}</td>
      <td class="freccia">›</td>
    </tr>`;
  });
  h += `</tbody></table>`;

  if(D.attribuzione){
    h += `<div class="avviso-fonte">${esc(D.attribuzione)}</div>`;
  }
  return h;
}

function caricaCalendario(){
  if(calendario) return Promise.resolve(calendario);
  return scaricaDati("calendario.dat", true)
    .then(d=>{ calendario=d; return d; });
}

function quandoEsteso(iso, ora){
  if(!iso) return "";
  const d=new Date(iso+"T12:00:00");
  if(isNaN(d.getTime())) return esc(iso);
  const g=d.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"});
  return ora ? `${g} · ore ${esc(ora)}` : g;
}

/* Quanto manca alla partita, in forma leggibile */
function traQuanto(iso){
  if(!iso) return "";
  const d=new Date(iso+"T12:00:00");
  if(isNaN(d.getTime())) return "";
  const oggi=new Date(); oggi.setHours(12,0,0,0);
  const gg=Math.round((d-oggi)/86400000);
  if(gg<=0) return "oggi";
  if(gg===1) return "domani";
  if(gg<7) return "fra "+gg+" giorni";
  return "";
}

  const C = (calendario.campionati||{})[legaAttiva];
  const gare = (C && C.partite) || [];

  let h = `<div class="sub" style="margin-top:0">
    Prossime partite${calendario.fusoOrario?" · orari in "+esc(calendario.fusoOrario):""}
    <br>fonte ${esc(calendario.fonte||"")}</div>`;

  if(!gare.length){
    return h + `<div class="empty" style="margin-top:16px">
      <div style="font-size:10px;color:${MUTED};line-height:1.8">
        Nessuna partita in programma nei prossimi
        ${calendario.giorniAvanti||45} giorni.<br>
        Il file viene aggiornato ogni giorno.</div></div>`;
  }

  // raggruppa per giorno, così le partite dello stesso turno stanno insieme
  const perGiorno = [];
  gare.forEach(g=>{
    const ultimo = perGiorno[perGiorno.length-1];
    if(ultimo && ultimo.data===g.data) ultimo.gare.push(g);
    else perGiorno.push({data:g.data, gare:[g]});
  });

  h += `<div class="titolo"><i></i><span>PROSSIME PARTITE</span></div>
        <div class="titolo-sub">${gare.length} gare · tocca un giorno per aprirlo</div>`;

  perGiorno.forEach((gruppo, i)=>{
    const chiave = "cal|" + gruppo.data;
    // Il primo giorno resta aperto: è quello che si guarda per primo.
    const aperto = settimaneAperte.has(chiave) || (i===0 && !settimaneAperte.size);
    const manca = traQuanto(gruppo.data);
    const conArbitro = gruppo.gare.filter(g=>g.arbitro).length;

    h += `<button class="gruppo${aperto?" on":""}" onclick="apriGruppo('${esc(chiave)}')">
      <span class="gruppo-tit">${esc(quandoEsteso(gruppo.data,null)).toUpperCase()}</span>
      <span class="gruppo-sub">${gruppo.gare.length} gare${
        manca?" · "+esc(manca):""}${conArbitro?` · ${conArbitro} con arbitro`:""}</span>
      <span class="gruppo-freccia">${aperto?"▴":"▾"}</span>
    </button>`;

    if(!aperto) return;

    h += `<div class="gruppo-corpo grid">`;
    gruppo.gare.forEach(g=>{
      h += `<div class="gara">
        <div class="gara-squadre">
          <span>${esc(g.casa)}</span>
          <span class="vs">${g.ora?esc(g.ora):"VS"}</span>
          <span style="text-align:right">${esc(g.ospite)}</span>
        </div>
        ${g.arbitro?`<div class="gara-arb">arbitro: <span style="color:${FLUO}">${esc(g.arbitro)}</span>${
          g.var?` · VAR: ${esc(g.var)}`:""}</div>`:""}
      </div>`;
    });
    h += `</div>`;
  });
  return h;
}

/* ================= PARTITE ================= */
function vPartite(){
  const P=D.ultimePartite||[];
  if(!P.length) return `<div class="sub" style="margin-top:0">Nessuna partita in archivio</div>`;

  const conScheda=new Set((D.arbitri||[]).map(a=>a.nome));

  let h=`<div class="sub" style="margin-top:0">Le più recenti registrate</div>
    <div class="titolo"><i></i><span>RISULTATI</span></div>
    <div class="titolo-sub">G = gialli casa-ospite · R = rossi totali · tocca l'arbitro per la scheda</div>
    <table class="tab"><thead><tr>
      <th>Partita</th><th>Ris</th><th>G</th><th>R</th><th>Arbitro</th>
    </tr></thead><tbody>`;

  P.forEach(p=>{
    const rt=(p.rossiCasa||0)+(p.rossiOspite||0);
    const arb=(p.arbitro||"").trim();
    let cella;
    if(!arb){
      cella=`<span style="font-size:12px;color:${MUTED}">—</span>`;
    } else if(conScheda.has(arb)){
      cella=`<span class="arb" style="font-size:12px;cursor:pointer"
        onclick="vaiArbitro('${esc(arb).replace(/'/g,"\\'")}')">${esc(arb)}</span>`;
    } else {
      // arbitro noto ma senza statistiche disciplinari: mostrato, non cliccabile
      cella=`<span style="font-size:12px;color:${MUTED}">${esc(arb)}</span>`;
    }
    h+=`<tr>
      <td style="line-height:1.5">
        <span style="font-size:10px">${esc(p.casa)} – ${esc(p.ospite)}</span>
        <span style="display:block;font-size:8px;color:${MUTED}">${esc(p.data)}</span>
      </td>
      <td style="color:${FLUO};font-weight:700">${n(p.gc,"?")}-${n(p.go,"?")}</td>
      <td class="gial">${n(p.gialliCasa,"–")}-${n(p.gialliOspite,"–")}</td>
      <td class="${rt>0?"ros":""}">${rt||"–"}</td>
      <td style="text-align:right">${cella}</td>
    </tr>`;
  });
  return h+`</tbody></table>`;
}
</script>
