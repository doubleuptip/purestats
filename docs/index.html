<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PureStats · Premier League</title>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --nero:#050706; --card:#0C110E; --card2:#111A14;
    --bordo:#1C2A1F; --testo:#E8F5E6; --muted:#6B8470;
    --rosso:#FF2D2D; --giallo:#FFD400;

    /* Accento: verde per il calcio, arancio per il football americano.
       Le due leghe statunitensi hanno metriche del tutto diverse, e il
       colore serve a segnalare che si sta guardando un'altra cosa. */
    --acc:#39FF14; --acc2:#1FA30C; --acc-rgb:57,255,20;
  }
  body.arancio{
    --acc:#FF9838; --acc2:#B35A0A; --acc-rgb:255,152,56;
    /* Grigi schiariti: sui fondi caldi i toni precedenti sparivano.
       --data è il tono ambra di date e campi da gioco, che portano
       un'informazione diversa dal resto del testo secondario. */
    --bordo:#3D2E1F; --testo:#FBF5EF; --muted:#B39B82; --data:#C98A4B;
    --card:#17110B; --card2:#1F1710; --nero:#070503;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--nero);color:var(--testo);font-family:'JetBrains Mono',monospace;padding-bottom:60px}

  header{position:sticky;top:0;z-index:20;background:rgba(5,7,6,.96);
    border-bottom:1px solid var(--bordo);backdrop-filter:blur(8px);padding:14px 14px 0}
  .logo{display:flex;align-items:center;gap:8px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc)}
  .logo span{font-family:'Teko',sans-serif;font-size:32px;letter-spacing:.06em;line-height:1}
  .logo b{color:var(--acc);font-weight:inherit}
  .lega{display:flex;gap:9px;align-items:center;margin:6px 0 14px 20px;
    overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .lega button{flex-shrink:0;white-space:nowrap}
  .lega button{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;
    letter-spacing:.1em;color:var(--muted);background:transparent;border:none;
    padding:4px 0;cursor:pointer;border-bottom:2px solid transparent}
  .lega button.on{color:var(--acc);border-bottom-color:var(--acc)}
  .lega span{color:var(--bordo);font-size:11px}

  /* --- PROSSIMA DESIGNAZIONE --- */
  .desig{background:rgba(var(--acc-rgb),.06);border:1px solid rgba(var(--acc-rgb),.3);
    border-radius:8px;padding:13px 15px;margin-bottom:18px}
  .desig-lab{font-size:10px;color:var(--acc);letter-spacing:.12em;font-weight:700;margin-bottom:7px}
  .desig-match{font-family:'Teko',sans-serif;font-size:28px;line-height:1.1}
  .desig-quando{font-size:11px;color:var(--muted);margin-top:3px}
  .desig-ruolo{font-size:8px;color:var(--muted);margin-top:6px;letter-spacing:.05em}
  .desig+.desig{margin-top:-10px}

  nav{display:flex;gap:5px;flex-wrap:wrap}
  nav button{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;
    letter-spacing:.06em;color:var(--muted);background:transparent;
    border:1px solid var(--bordo);border-bottom:none;border-radius:5px 5px 0 0;
    padding:9px 13px;cursor:pointer}
  nav button.on{color:var(--nero);background:var(--acc);border-color:var(--acc)}

  main{padding:20px 14px 0}
  h1{font-family:'Teko',sans-serif;font-size:34px;line-height:1;font-weight:600}
  .sub{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.6}

  /* --- KPI numerici --- */
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:16px 0 22px}
  .kpi{background:var(--card);border:1px solid var(--bordo);border-radius:7px;padding:11px 8px;text-align:center}
  .kpi b{display:block;font-family:'Teko',sans-serif;font-size:26px;color:var(--acc);line-height:1}
  .kpi span{display:block;font-size:7px;color:var(--muted);letter-spacing:.09em;margin-top:4px}

  .titolo{display:flex;align-items:center;gap:8px;margin:22px 0 5px}
  .titolo i{width:3px;height:21px;background:var(--acc);box-shadow:0 0 8px var(--acc)}
  .titolo span{font-family:'Teko',sans-serif;font-size:26px;letter-spacing:.03em;line-height:1}
  .titolo-sub{font-size:11px;color:var(--muted);margin:0 0 11px 11px;line-height:1.6}

  /* --- TABELLA NUMERICA --- */
  .tab{width:100%;border-collapse:collapse;font-size:13px;table-layout:auto}
  .tab thead th{font-size:10px;color:var(--muted);letter-spacing:.07em;font-weight:700;
    text-align:right;padding:0 6px 8px;border-bottom:1px solid var(--bordo);white-space:nowrap}
  .tab thead th:first-child{text-align:left;padding-left:10px;width:auto}
  /* Le colonne numeriche occupano solo lo spazio necessario, così il nome
     non viene mai compresso né troncato */
  .tab thead th:not(:first-child){width:1%}
  .tab tbody td:not(:first-child){white-space:nowrap;width:1%}
  /* Le sigle NFL e i nomi dei college sono già leggibili in piccolo:
     il corpo grande del calcio qui sprecherebbe spazio in larghezza. */
  body.arancio .nome{font-size:16px}
  body.arancio .tab{font-size:12px}
  .tab tbody td:first-child{text-align:left;padding-left:10px;
    white-space:normal;overflow-wrap:anywhere;text-overflow:clip}
  .tab thead th.ord{cursor:pointer;-webkit-user-select:none;user-select:none}
  .tab thead th.ord:active{color:var(--testo)}
  .tab thead th.attivo{color:var(--acc)}
  .tab thead th .dir{font-size:8px;margin-left:2px}
  .tab tbody td{padding:9px 6px;text-align:right;border-bottom:1px solid rgba(28,42,31,.5);
    font-variant-numeric:tabular-nums}
  .tab tbody tr{background:var(--card)}
  .tab tbody tr.click{cursor:pointer}
  .tab tbody tr.click:active{background:var(--card2)}
  .pos{color:var(--muted);font-size:11px;display:inline-block;min-width:20px}
  .nome{font-family:'Teko',sans-serif;font-size:22px;letter-spacing:.02em;vertical-align:middle;line-height:1.15}
  .big{color:var(--acc);font-weight:700;font-size:13px}
  .gial{color:var(--giallo);font-weight:700}
  .ros{color:var(--rosso);font-weight:700}
  .neg{color:var(--acc)}
  .freccia{color:var(--muted);font-size:11px;padding-left:6px}

  /* --- SCHEDA ARBITRO --- */
  .back{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--acc);
    background:transparent;border:1px solid var(--bordo);border-radius:5px;
    padding:7px 12px;cursor:pointer;margin-bottom:16px;letter-spacing:.06em}
  .avatar{width:54px;height:54px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;position:relative;
    overflow:hidden;border:1px solid rgba(var(--acc-rgb),.3)}
  .avatar b{font-family:'Teko',sans-serif;font-size:27px;line-height:1;
    letter-spacing:.04em;position:relative;z-index:2}
  .avatar canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1;opacity:.55}
  .scheda-testa{display:flex;align-items:center;gap:13px;min-width:0}

  .scheda-top{background:var(--card);border:1px solid rgba(var(--acc-rgb),.25);
    border-radius:9px;padding:16px;margin-bottom:18px}
  .scheda-nome{font-family:'Teko',sans-serif;font-size:29px;line-height:1.05;letter-spacing:.02em;overflow-wrap:anywhere}
  .scheda-meta{font-size:11px;color:var(--muted);margin-top:4px}
  .dati{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--bordo);
    border:1px solid var(--bordo);border-radius:7px;overflow:hidden;margin-bottom:18px}
  .dato{background:var(--card);padding:12px 11px}
  .dato b{display:block;font-family:'Teko',sans-serif;font-size:27px;color:var(--acc);line-height:1}
  .dato b.g{color:var(--giallo)} .dato b.r{color:var(--rosso)} .dato b.n{color:var(--testo)}
  .dato span{display:block;font-size:8px;color:var(--muted);letter-spacing:.07em;margin-top:5px;line-height:1.4}

  .conf{display:flex;align-items:center;justify-content:space-between;
    background:var(--card);border:1px solid var(--bordo);border-radius:7px;
    padding:12px 14px;margin-bottom:8px}
  .conf-lab{font-size:9px;color:var(--muted);letter-spacing:.06em}
  .conf-val{font-family:'Teko',sans-serif;font-size:24px;line-height:1}

  /* --- RICERCA E FILTRI --- */
  .filtri{margin:16px 0 18px}
  .cerca{width:100%;background:var(--card);border:1px solid var(--bordo);border-radius:7px;
    padding:11px 13px;color:var(--testo);font-family:'JetBrains Mono',monospace;
    font-size:12px;outline:none}
  .cerca:focus{border-color:var(--acc);box-shadow:0 0 0 1px rgba(var(--acc-rgb),.2)}
  .cerca::placeholder{color:var(--muted)}
  .stagioni{display:flex;gap:5px;overflow-x:auto;margin-top:9px;padding-bottom:3px;
    -webkit-overflow-scrolling:touch}
  .stagioni button{flex-shrink:0;font-family:'JetBrains Mono',monospace;font-size:9px;
    font-weight:700;letter-spacing:.05em;color:var(--muted);background:var(--card);
    border:1px solid var(--bordo);border-radius:5px;padding:7px 11px;cursor:pointer;white-space:nowrap}
  .stagioni button.on{color:var(--nero);background:var(--acc);border-color:var(--acc)}
  .conteggio{font-size:9px;color:var(--muted);margin-top:9px;letter-spacing:.05em}

  .arb{color:var(--acc);font-weight:700}

  /* Sottomenù dei campionati di uno stesso paese */
  .sub-lega{display:flex;gap:6px;margin:0 0 12px 20px}
  .sub-lega button{font-family:'JetBrains Mono',monospace;font-size:10px;
    font-weight:700;letter-spacing:.08em;color:var(--muted);background:var(--card);
    border:1px solid var(--bordo);border-radius:5px;padding:6px 11px;cursor:pointer;
    white-space:nowrap}
  .sub-lega button.on{color:var(--nero);background:var(--acc);border-color:var(--acc)}

  /* --- GRUPPI COMPRIMIBILI --- */
  .gruppo{width:100%;display:flex;align-items:center;gap:9px;text-align:left;
    background:var(--card);border:1px solid var(--bordo);border-radius:8px;
    padding:11px 13px;margin-top:8px;cursor:pointer;
    font-family:'JetBrains Mono',monospace}
  .gruppo.on{border-color:var(--acc)}
  .gruppo-tit{font-family:'Teko',sans-serif;font-size:19px;color:var(--acc);line-height:1}
  .gruppo-sub{font-size:9px;color:var(--muted)}
  .gruppo-freccia{margin-left:auto;color:var(--muted);font-size:11px}
  .gruppo-corpo{margin-top:8px}

  .toggle-gio{width:100%;margin-top:9px;font-family:'JetBrains Mono',monospace;
    font-size:9px;color:var(--acc);background:transparent;border:1px solid var(--bordo);
    border-radius:4px;padding:5px;cursor:pointer;letter-spacing:.06em}

  /* --- GIOCATORI NELLA SCHEDA PARTITA --- */
  .rose{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:11px;
    padding-top:11px;border-top:1px solid var(--bordo)}
  .rosa-tit{font-size:8px;color:var(--acc);letter-spacing:.1em;font-weight:700;margin-bottom:6px}
  .gio{margin-bottom:7px;line-height:1.35}
  .gio-r{display:inline-block;min-width:22px;font-size:8px;font-weight:700;
    color:var(--muted);letter-spacing:.06em}
  .gio-n{font-size:11px;color:var(--testo)}
  .gio-v{display:block;font-size:9px;color:var(--muted);margin-left:22px}
  .gio-v b{color:var(--acc);font-weight:700}

  /* L'attribuzione alla fonte è una condizione della licenza: va
     mostrata nella pagina, non solo nei dati. */
  .avviso-fonte{margin-top:20px;padding:12px 14px;background:var(--card2);
    border:1px solid var(--bordo);border-radius:8px;
    font-size:10px;color:var(--muted);line-height:1.7;text-align:center}

  /* --- CALENDARIO --- */
  .sottomenu{display:flex;gap:5px;overflow-x:auto;margin:14px 0 16px;padding-bottom:3px}
  .sottomenu button{flex-shrink:0;font-family:'JetBrains Mono',monospace;font-size:10px;
    font-weight:700;letter-spacing:.05em;color:var(--muted);background:var(--card);
    border:1px solid var(--bordo);border-radius:5px;padding:8px 12px;cursor:pointer;white-space:nowrap}
  .sottomenu button.on{color:var(--nero);background:var(--acc);border-color:var(--acc)}


  .gara{background:var(--card);border:1px solid var(--bordo);border-radius:8px;padding:11px 14px}
  .gara-quando{font-size:9px;color:var(--acc);letter-spacing:.08em;margin-bottom:6px}
  .gara-squadre{display:flex;align-items:center;justify-content:space-between}
  .gara-squadre span{font-family:'Teko',sans-serif;font-size:19px;flex:1;line-height:1.15}
  body.arancio .gara-squadre span{font-size:20px}
  .gara-squadre .vs{flex:0 0 auto;font-family:'JetBrains Mono',monospace;font-size:9px;
    color:var(--muted);padding:0 10px;white-space:nowrap}
  /* Il punteggio va tenuto su una riga: spezzato in due si legge male
     e disallinea le due squadre. */
  body.arancio .gara-squadre .vs{font-size:13px;font-weight:700;
    color:var(--testo);padding:0 12px}
  .gara-arb{font-size:9px;color:var(--muted);margin-top:6px}
  body.arancio .gara-arb{font-size:10px;color:var(--data, var(--muted))}


  .chart-box{background:var(--card);border:1px solid var(--bordo);border-radius:8px;
    padding:14px 10px 10px;margin-bottom:20px}

  .empty{background:var(--card);border:1px dashed var(--bordo);border-radius:8px;
    padding:30px 20px;text-align:center}
  .loading{text-align:center;padding:60px 20px;color:var(--muted);font-size:11px}
  footer{font-size:8px;color:var(--muted);margin:32px 14px 0;
    padding-top:15px;border-top:1px solid var(--bordo);line-height:1.9}
  .pie-riga{text-align:center}
  .pie-apri{display:block;margin:14px auto 0;font-family:'JetBrains Mono',monospace;
    font-size:8px;letter-spacing:.1em;color:var(--acc);background:transparent;
    border:1px solid var(--bordo);border-radius:5px;padding:7px 14px;cursor:pointer}
  .pie-legale{margin-top:14px;padding:14px;background:var(--card);
    border:1px solid var(--bordo);border-radius:8px;text-align:left;font-size:9px;
    line-height:1.85}
  .pie-legale h4{font-family:'JetBrains Mono',monospace;font-size:8px;font-weight:700;
    letter-spacing:.1em;color:var(--acc);margin:14px 0 5px}
  .pie-legale h4:first-child{margin-top:0}
  .pie-legale ul{margin:0;padding-left:15px}
  .pie-legale li{margin-bottom:4px}
  .pie-legale b{color:var(--testo);font-weight:700}
  code{color:var(--acc);font-size:9px}
</style>
</head>
<body>

<header>
  <div class="logo"><div class="dot"></div><span>PURE<b>STATS</b></span></div>
  <div class="lega" id="scelta-lega"></div>
  <div class="sub-lega" id="sub-lega" style="display:none"></div>
  <nav>
    <button id="n-arb" class="on" onclick="vai('arbitri')">ARBITRI</button>
    <button id="n-squ" onclick="vai('squadre')">SQUADRE</button>
    <button id="n-par" onclick="vai('partite')">PARTITE</button>
    <button id="n-cal" onclick="vai('calendario')">CALENDARIO</button>
  </nav>
</header>

<main><div id="app" class="loading">Caricamento archivio…</div></main>
<footer id="pie"></footer>

<script>
const FLUO="#39FF14",FLUO2="#1FA30C",GIALLO="#FFD400",ROSSO="#FF2D2D",
      MUTED="#6B8470",BORDO="#1C2A1F",TESTO="#E8F5E6",NERO="#050706";

let D=null, vista="arbitri", arbitroAperto=null, charts=[];
let ricerca="", stagione=null;
let annoFootball=null, gruppoFootball="tutti", squadraAperta=null;
let arbitroAleague=null;
let legaleAperto=false;

/* Cosa è aperto nella pagina. Con un calendario intero, mostrare tutto
   espanso significa migliaia di righe: si parte chiusi e si apre ciò
   che interessa. Gli insiemi sopravvivono ai ridisegni, quindi aprire
   una scheda non richiude le altre. */
const settimaneAperte = new Set();
const partiteAperte = new Set();   // null = non ancora scelta, si imposta al caricamento

/* La stagione in corso è quella predefinita: guardare le medie di tutta la
   storia raramente è ciò che serve per prima cosa. "Tutte" resta a un tocco. */
function stagionePredefinita(d){
  const s = d && d.stagioni;
  return (s && s.length) ? s[s.length - 1] : "tutte";
}

/* Campionati disponibili. Ciascuno ha il proprio file dati:
   se un file non esiste il campionato viene semplicemente nascosto. */
const LEGHE = [
  {id:"premier",  nome:"PREMIER LEAGUE", file:"data.json"},
  {id:"serie_a",  nome:"SERIE A",        file:"data_serie_a.json"},
  {id:"la_liga",  nome:"LALIGA",         file:"data_la_liga.json"},
  {id:"ligue_1",  nome:"LIGUE 1",        file:"data_ligue_1.json"},
  {id:"bundesliga",   nome:"BUNDESLIGA",   file:"data_bundesliga.json",   gruppo:"GERMANIA"},
  {id:"bundesliga_2", nome:"BUNDESLIGA 2", file:"data_bundesliga_2.json", gruppo:"GERMANIA"},
  {id:"aleague",  nome:"A-LEAGUE",      file:"data_aleague.json",  soloArbitri:true},
  {id:"nfl",      nome:"NFL",           file:"data_nfl.json",      football:true},
  {id:"college",  nome:"COLLEGE FB",    file:"data_college.json",  football:true},
];
let legaAttiva = null;
const cache = {};
let calendario = null;   // un file solo, comune a tutti i campionati

/* Ordinamento: una configurazione per ciascuna tabella.
   dir = -1 decrescente (default per le medie), +1 crescente. */
let ord = {
  arbitri: {campo:"mediaCartellini", dir:-1},
  squadre: {campo:"mediaGialli",     dir:-1},
};

function ordina(tabella, campo){
  const o = ord[tabella];
  if(o.campo === campo) o.dir = -o.dir;   // stesso campo: inverte la direzione
  else {
    o.campo = campo;
    // I nomi partono da A-Z, i numeri dal valore più alto
    o.dir = (campo === "nome") ? 1 : -1;
  }
  render();
}

/* Confronto che gestisce numeri, testo e valori mancanti.
   I valori nulli finiscono sempre in fondo, in entrambe le direzioni. */
function confronta(a, b, campo, dir){
  const va = a[campo], vb = b[campo];
  const na = va===null||va===undefined||va==="";
  const nb = vb===null||vb===undefined||vb==="";
  if(na && nb) return 0;
  if(na) return 1;
  if(nb) return -1;
  if(typeof va === "string" || typeof vb === "string")
    return String(va).localeCompare(String(vb)) * (dir === -1 ? -1 : 1);
  return (va - vb) * (dir === -1 ? -1 : 1);
}

/* Genera un'intestazione cliccabile */
function th(tabella, campo, etichetta, primo){
  const o = ord[tabella];
  const attivo = o.campo === campo;
  const freccia = attivo ? (o.dir === -1 ? "▼" : "▲") : "";
  return `<th class="ord${attivo?" attivo":""}${primo?"":""}"
    onclick="ordina('${tabella}','${campo}')">${etichetta}<span class="dir">${freccia}</span></th>`;
}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const n=(v,d="—")=>v===null||v===undefined?d:v;
const seg=v=>v>0?"+"+v:String(v);

/* ---------- AVATAR GENERATO DAL NOME ----------
   Ogni arbitro ottiene un motivo grafico unico e sempre identico,
   ricavato dalle lettere del suo nome. Nessuna immagine esterna,
   quindi nessun problema di diritti d'autore o di ritratto. */

function _semeDaNome(nome){
  // hash deterministico: lo stesso nome dà sempre lo stesso motivo
  let h = 2166136261;
  for(let i=0;i<nome.length;i++){
    h ^= nome.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function _iniziali(nome){
  const parti = String(nome||"").trim().split(/\s+/).filter(Boolean);
  if(!parti.length) return "?";
  if(parti.length === 1) return parti[0].slice(0,2).toUpperCase();
  return (parti[0][0] + parti[parti.length-1][0]).toUpperCase();
}

/* Tonalità derivata dal nome, mantenuta nella gamma verde del tema */
function _tinta(seme){
  const scarto = (seme % 60) - 30;      // da -30 a +29 gradi attorno al verde
  return 105 + scarto;
}

function avatar(nome, lato){
  const seme = _semeDaNome(nome||"");
  const tinta = _tinta(seme);
  const id = "av" + seme.toString(36);
  const sfondo = `hsl(${tinta} 45% 8%)`;
  const testo  = `hsl(${tinta} 90% 62%)`;

  // il canvas viene disegnato dopo l'inserimento nel DOM
  setTimeout(()=>disegnaAvatar(id, seme, tinta), 0);

  return `<div class="avatar" style="background:${sfondo};width:${lato}px;height:${lato}px">
    <canvas id="${id}" width="${lato*2}" height="${lato*2}"></canvas>

/* Disegna anelli concentrici, cerchi in orbita e un arco sul bordo.
   Tutti i parametri derivano dal seme, quindi il risultato è unico
   per ogni nome e sempre identico a sé stesso. */
function disegnaAvatar(id, seme, tinta){
  const c = document.getElementById(id);
  if(!c) return;
  const ctx = c.getContext("2d");
  const L = c.width, centro = L/2;
  let s = seme;
  const prossimo = ()=>{ s = (s * 1664525 + 1013904223) >>> 0; return s; };

  ctx.clearRect(0,0,L,L);

  // Anelli concentrici di spessore variabile: danno profondità
  const anelli = 2 + (prossimo() % 3);
  for(let i = anelli; i > 0; i--){
    const raggio = (L * 0.46) * (i / anelli);
    const chiarezza = 26 + (prossimo() % 30);
    ctx.beginPath();
    ctx.arc(centro, centro, raggio, 0, Math.PI * 2);
    ctx.fillStyle = `hsl(${tinta} 65% ${chiarezza}%)`;
    ctx.fill();
  }

  // Cerchi in orbita, disposti simmetricamente attorno al centro
  const quanti = 3 + (prossimo() % 4);
  const distanza = L * (0.24 + (prossimo() % 12) / 100);
  const rotazione = (prossimo() % 360) * Math.PI / 180;
  const raggioPunto = L * (0.055 + (prossimo() % 5) / 100);

  for(let i = 0; i < quanti; i++){
    const angolo = rotazione + (i * 2 * Math.PI / quanti);
    const x = centro + Math.cos(angolo) * distanza;
    const y = centro + Math.sin(angolo) * distanza;
    const chiarezza = 48 + (prossimo() % 26);
    ctx.beginPath();
    ctx.arc(x, y, raggioPunto, 0, Math.PI * 2);
    ctx.fillStyle = `hsl(${tinta} 78% ${chiarezza}%)`;
    ctx.fill();
  }

  // Arco spezzato sul bordo: elemento asimmetrico che rende unico il risultato
  const inizio = (prossimo() % 360) * Math.PI / 180;
  const ampiezza = (0.6 + (prossimo() % 100) / 100) * Math.PI;
  ctx.beginPath();
  ctx.arc(centro, centro, L * 0.42, inizio, inizio + ampiezza);
  ctx.strokeStyle = `hsl(${tinta} 85% 60%)`;
  ctx.lineWidth = L * 0.035;
  ctx.stroke();
}

function dataEstesa(iso){
  if(!iso) return "";
  const d=new Date(iso+"T12:00:00");
  if(isNaN(d.getTime())) return esc(iso);
  return d.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"});
}

  return fetch(lega.file+"?t="+Date.now())
    .then(r=>{ if(!r.ok) throw new Error(lega.file+" non trovato"); return r.json(); })
    .then(d=>{ cache[id]=d; return d; });
}

/* All'avvio prova a caricare tutti i campionati.
   Quelli senza dati restano visibili ma segnalati: nascondere in silenzio
   renderebbe impossibile capire che manca un file. */
Promise.all(LEGHE.map(l =>
  fetch(l.file+"?t="+Date.now())
    .then(r=>r.ok?r.json():null)
    .then(d=>{ if(d) cache[l.id]=d; return {lega:l, ok:!!d}; })
    .catch(()=>({lega:l, ok:false}))
)).then(esiti=>{
  // I campionati senza archivio vengono tolti dal menù invece di
  // comparire sbiaditi: con i paesi raggruppati, una voce disattivata
  // dentro un gruppo sarebbe più confusa che utile.
  const mancanti = esiti.filter(e=>!e.ok).map(e=>e.lega.id);
  if(mancanti.length){
    console.warn("Archivi non trovati:", mancanti.join(", "));
    for(let i=LEGHE.length-1; i>=0; i--){
      if(mancanti.includes(LEGHE[i].id)) LEGHE.splice(i,1);
    }
  }

  const primo = esiti.find(e=>e.ok);
  if(!primo){ mostraErrore(new Error("nessun archivio trovato")); return; }

  legaAttiva = primo.lega.id;
  D = cache[legaAttiva];
  stagione = stagionePredefinita(D);
  render();
});

function perFiltro(a){
  if(stagione==="tutte") return {
    partite:a.partite, mediaGialli:a.mediaGialli, mediaRossi:a.mediaRossi,
    mediaCartellini:a.mediaCartellini, mediaFalli:a.mediaFalli,
    squilibrio:a.squilibrioCasaOspite
  };
  const s=(a.perStagione||[]).find(x=>x.stagione===stagione);
  if(!s) return null;
  return {
    partite:s.partite, mediaGialli:s.mediaGialli, mediaRossi:s.mediaRossi,
    mediaCartellini:s.media, mediaFalli:s.mediaFalli, squilibrio:s.squilibrio
  };
}

function arbitriFiltrati(){
  const q=ricerca.trim().toLowerCase();

    .map(a=>({arb:a, d:perFiltro(a)}))
    .filter(x=>x.d!==null)
    .filter(x=>!q||x.arb.nome.toLowerCase().includes(q))
    .map(x=>({...x, nome:x.arb.nome, ...x.d}))   // campi piatti per l'ordinamento
    .sort((x,y)=>confronta(x,y,o.campo,o.dir) || x.nome.localeCompare(y.nome));

/* ================= SCHEDA ARBITRO ================= */
function vScheda(){
  const a=(D.arbitri||[]).find(x=>x.nome===arbitroAperto);
  if(!a) return `<button class="back" onclick="chiudiArbitro()">‹ INDIETRO</button>
                 <div class="empty">Arbitro non trovato</div>`;

  const pos=(D.arbitri||[]).findIndex(x=>x.nome===arbitroAperto)+1;
  const totArb=(D.arbitri||[]).length;
  const conStorico=(D.arbitri||[]).filter(x=>x.partite>0);
  const baseMedia=conStorico.reduce((s,x)=>s+x.partite,0);
  const mediaLega=baseMedia?conStorico.reduce((s,x)=>s+(x.mediaGialli||0)*x.partite,0)/baseMedia:0;
  const scarto=a.mediaGialli!==null?(a.mediaGialli-mediaLega).toFixed(2):null;
  const unGialloOgni=a.gialliPerFallo?(100/a.gialliPerFallo).toFixed(1):null;

  let h=`<button class="back" onclick="chiudiArbitro()">‹ TUTTI GLI ARBITRI</button>

  <div class="scheda-top">
   <div class="scheda-testa">
    ${avatar(a.nome, 54)}
    <div>
    <div class="scheda-nome">${esc(a.nome)}</div>
    <div class="scheda-meta">${a.partite
      ? `${a.partite} partite dirette · ${pos}° su ${totArb} per severità`
      : `nessuna partita ancora in archivio`}</div>
    </div>
   </div>
  </div>`;

  // Designazioni note per partite non ancora giocate
  const pross=a.prossime||[];
  if(pross.length){
    pross.forEach((p,i)=>{
      const ruoli=[];
      if(p.quartoUomo) ruoli.push("IV: "+esc(p.quartoUomo));
      if(p.var) ruoli.push("VAR: "+esc(p.var));
      if(p.avar) ruoli.push("AVAR: "+esc(p.avar));
      h+=`<div class="desig">
        <div class="desig-lab">${i===0?"PROSSIMA DESIGNAZIONE":"POI"}</div>
        <div class="desig-match">${esc(p.casa)} – ${esc(p.ospite)}</div>
        <div class="desig-quando">${dataEstesa(p.data)}${p.ora?" · ore "+esc(p.ora):""}${
          p.giornata?" · giornata "+p.giornata:""}</div>
        ${ruoli.length?`<div class="desig-ruolo">${ruoli.join("  ·  ")}</div>`:""}
      </div>`;
    });
  }

  if(!a.partite){
    return h+`<div class="empty">
      <div style="font-size:10px;color:${MUTED};line-height:1.8">
        Nessuna partita diretta presente in archivio.<br>
        Le statistiche compariranno dopo la prima gara registrata.</div></div>`;
  }

/* ================= SQUADRE ================= */
function squadraPerFiltro(s){
  if(stagione==="tutte") return {
    partite:s.partite, mediaGialli:s.mediaGialli, mediaRossi:s.mediaRossi,
    mediaFalli:s.mediaFalli, mediaGialliCasa:s.mediaGialliCasa,
    mediaGialliOspite:s.mediaGialliOspite, rossi:s.rossi, gialli:s.gialli
  };
  const x=(s.perStagione||[]).find(y=>y.stagione===stagione);
  if(!x) return null;
  return {
    partite:x.partite, mediaGialli:x.mediaGialli, mediaRossi:x.mediaRossi,
    mediaFalli:x.mediaFalli, mediaGialliCasa:x.mediaGialliCasa,
    mediaGialliOspite:x.mediaGialliOspite, rossi:x.rossi, gialli:x.gialli
  };
}

function barraStagioni(){
  const stag=D.stagioni||[];
  if(stag.length<2) return "";
  return `<div class="stagioni">
    <button class="${stagione==="tutte"?"on":""}" onclick="filtraStagione('tutte')">TUTTE</button>
    ${stag.slice().reverse().map(s=>`<button class="${stagione===s?"on":""}"
      onclick="filtraStagione('${esc(s)}')">${esc(s)}</button>`).join("")}

function vSquadre(){
  const base=D.squadre||[];
  if(!base.length) return `<div class="sub" style="margin-top:0">Nessun dato disponibile</div>`;

  const q=ricerca.trim().toLowerCase();
  const o=ord.squadre;
  const lista=base
    .map(s=>({sq:s, d:squadraPerFiltro(s)}))
    .filter(x=>x.d!==null)
    .filter(x=>!q||x.sq.nome.toLowerCase().includes(q))
    .map(x=>({...x, nome:x.sq.nome, ...x.d}))
    .sort((a,b)=>confronta(a,b,o.campo,o.dir) || a.nome.localeCompare(b.nome));

  const conMedia=lista.filter(x=>x.mediaGialli!==null&&x.mediaGialli!==undefined);

    <div class="filtri">

             value="${esc(ricerca)}" oninput="cercaSquadra(this.value)">
      ${barraStagioni()}
      <div class="conteggio">
        ${lista.length} ${lista.length===1?"squadra":"squadre"}

      Nessuna squadra ha giocato in questa stagione.</div></div>`;
  }

  h+=`${kpi([lista.length,"SQUADRE"],[mg,"GIALLI MEDI"],[rossi,"ROSSI TOTALI"])}
    <div class="titolo"><i></i><span>CLASSIFICA DISCIPLINARE</span></div>
    <div class="titolo-sub">Tocca un'intestazione per ordinare · CASA e OSP = gialli medi per campo</div>
    <table class="tab"><thead><tr>
      ${th("squadre","nome","Squadra",true)}
      ${th("squadre","partite","PG")}
      ${th("squadre","mediaGialli","GIA")}
      ${th("squadre","mediaGialliCasa","CASA")}
      ${th("squadre","mediaGialliOspite","OSP")}
      ${th("squadre","mediaFalli","FAL")}
      ${th("squadre","rossi","ROS")}
    </tr></thead><tbody>`;

  lista.forEach((x,i)=>{
    h+=`<tr>
      <td><span class="pos">${i+1}</span><span class="nome">${esc(x.nome)}</span></td>
      <td>${x.partite}</td>
      <td class="big">${n(x.mediaGialli)}</td>

      <td class="${x.mediaGialliOspite>x.mediaGialliCasa?"ros":""}">${n(x.mediaGialliOspite)}</td>
      <td>${n(x.mediaFalli)}</td>

/* ============ FOOTBALL AMERICANO (NFL e College) ============ */

/* Le stagioni sono anni singoli, non a cavallo come nel calcio:
   il sottomenù parte dalla più recente. */
function annoPredefinito(d){
  const s = d && d.stagioni;
  return (s && s.length) ? s[0] : null;
}

function scegliAnno(a){ annoFootball=a; render(); }
function scegliGruppo(g){ gruppoFootball=g; render(); }

/* Conference per la NFL, conference universitarie per il college:
   in entrambi i casi è il raggruppamento con cui si legge la classifica. */

    <button class="${gruppoFootball==="tutti"?"on":""}" onclick="scegliGruppo('tutti')">TUTTE</button>

      onclick="scegliGruppo('${esc(x)}')">${esc(x)}</button>`).join("")}
  </div>`;
}

function barraAnni(){
  const anni=(D.stagioni||[]);
  if(anni.length<2) return "";
  return `<div class="stagioni">
    <button class="${annoFootball==="tutte"?"on":""}" onclick="scegliAnno('tutte')">TUTTE</button>

/* Dati della squadra per l'anno scelto, o complessivi se "tutte" */

  };

      ${th("squadre","sconfitte","S")}
      ${th("squadre","percVittorie","%")}
      ${th("squadre","mediaFatti","PF")}
      ${th("squadre","mediaSubiti","PS")}
      ${th("squadre","differenza","DIFF")}
      <th></th>

  lista.forEach((x,i)=>{
    h+=`<tr class="click" onclick="apriSquadra('${esc(x.nome).replace(/'/g,"\\'")}')">

      <td class="freccia">›</td>
    </tr>`;
  });
  return h+`</tbody></table>`;
}

/* Elenco compatto dei giocatori di riferimento di una squadra.
   Servono a dare contesto alla partita: chi la decide, con il rendimento
   di stagione accanto. Non è l'organico completo, sono i tre o quattro
   nomi di cui si parla prima del calcio d'inizio. */
/* '2026-09-13' -> 'domenica 13 settembre' */
function dataBreve(iso){
  if(!iso) return "";
  const d=new Date(iso+"T12:00:00");
  if(isNaN(d.getTime())) return iso;
  return d.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"});
}

/* Il file delle partite riporta le sigle; il nome per esteso sta
   nell'anagrafica delle squadre. Le sigle sono chiare solo a chi segue
   il campionato da anni. */
function nomeSquadra(sigla){
  const s=(D.squadre||[]).find(x=>x.nome===sigla);
  return (s && s.nomeCompleto) || sigla;
}

function rosa(titolo, giocatori){
  if(!giocatori || !giocatori.length) return "";
  return `<div>
    <div class="rosa-tit">${esc(titolo)}</div>
    ${giocatori.map(g=>`<div class="gio">
      <span class="gio-r">${esc(g.ruolo)}</span><span class="gio-n">${esc(g.nome)}</span>
      <span class="gio-v"><b>${n(g.valore)}</b> ${esc(g.misura)}${
        g.dettagli && g.dettagli.length ? " · "+esc(g.dettagli.join(", ")) : ""}</span>
    </div>`).join("")}
  </div>`;
}

function apriGruppo(chiave){
  settimaneAperte.has(chiave) ? settimaneAperte.delete(chiave) : settimaneAperte.add(chiave);
  render();
}
function apriPartita(chiave){
  partiteAperte.has(chiave) ? partiteAperte.delete(chiave) : partiteAperte.add(chiave);
  render();
}

function apriSquadra(nome){ squadraAperta=nome; window.scrollTo(0,0); render(); }
function chiudiSquadra(){ squadraAperta=null; window.scrollTo(0,0); render(); }

function vFootballPartite(){
  const P=D.ultimePartite||[];
  if(!P.length) return `<div class="sub" style="margin-top:0">Nessuna partita in archivio</div>`;

  if(annoFootball===null) annoFootball = annoPredefinito(D) || "tutte";
  const sue = annoFootball==="tutte" ? P : P.filter(p=>p.stagione===annoFootball);

  let h=`<div class="sub" style="margin-top:0">Calendario completo · tocca una settimana per aprirla</div>
    <div class="filtri">${barraAnni()}
      <div class="conteggio">${sue.length} partite
        ${annoFootball!=="tutte"?" · stagione "+esc(annoFootball):""}</div>
    </div>`;

  if(!sue.length){
    return h+`<div class="empty"><div style="font-size:10px;color:${MUTED};line-height:1.8">
      Nessuna partita in questa stagione.</div></div>`;
  }

  const gruppi=[];
  sue.forEach(p=>{
    const k = `${p.stagione}|${p.settimana||"?"}`;
    const ultimo = gruppi[gruppi.length-1];
    if(ultimo && ultimo.chiave===k) ultimo.gare.push(p);
    else gruppi.push({chiave:k, stagione:p.stagione, settimana:p.settimana,
                      tipo:p.tipo, gare:[p]});
  });

  h += `<div class="titolo"><i></i><span>WEEK</span></div>
        <div class="titolo-sub">${gruppi.length} week · tocca per vedere le partite</div>`;

  gruppi.forEach(g=>{
    const aperto = settimaneAperte.has(g.chiave);
    // 'Week' è il termine con cui si indica il turno nel football
    const titolo = g.settimana && g.settimana!=="?"
      ? `WEEK ${esc(g.settimana)}` : "PARTITE";
    const disputate = g.gare.filter(x=>x.pc!==null&&x.pc!==undefined).length;

    h += `<button class="gruppo${aperto?" on":""}" onclick="apriGruppo('${esc(g.chiave)}')">
      <span class="gruppo-tit">${titolo}</span>
      <span class="gruppo-sub">${g.gare.length} gare${
        disputate<g.gare.length?` · ${disputate} disputate`:""}${
        annoFootball==="tutte"?" · "+esc(g.stagione):""}</span>
      <span class="gruppo-freccia">${aperto?"▴":"▾"}</span>
    </button>`;

    if(!aperto) return;

    h += `<div class="gruppo-corpo grid">`;
    g.gare.forEach(p=>{
      const kp = `${p.stagione}|${p.settimana}|${p.casa}|${p.ospite}`;
      const disputata = p.pc!==null && p.pc!==undefined;
      const casa = p.giocatoriCasa || [];
      const osp  = p.giocatoriOspite || [];
      const conRose = casa.length || osp.length;
      const rosaAperta = partiteAperte.has(kp);

      h += `<div class="gara">
        <div class="gara-squadre">
          <span>${esc(nomeSquadra(p.ospite))}</span>
          <span class="vs">${disputata?`${p.po}\u2013${p.pc}`:"@"}</span>
          <span style="text-align:right">${esc(nomeSquadra(p.casa))}</span>
        </div>
        <div class="gara-arb">${esc(dataBreve(p.data))}${p.stadio?" · "+esc(p.stadio):""}</div>
        ${conRose ? `<button class="toggle-gio" onclick="apriPartita('${esc(kp).replace(/'/g,"\\'")}')">
            ${rosaAperta?"▴ NASCONDI":"▾ MIGLIORI DELLA PARTITA"}</button>` : ""}
        ${conRose && rosaAperta
          ? `<div class="rose">${rosa(p.ospite, osp)}${rosa(p.casa, casa)}</div>` : ""}
      </div>`;
    });
    h += `</div>`;
  });
  return h;
}

    <th>Stagione</th><th>PG</th><th>V</th><th>S</th><th>%</th>
    <th>PF</th><th>PS</th><th>CASA</th><th>FUORI</th>
  </tr></thead><tbody>`;

  (s.perStagione||[]).forEach(x=>{
    h+=`<tr>
      <td><span class="nome">${esc(x.stagione)}</span>${
        x.conferenza?`<span style="display:block;font-size:8px;color:${MUTED}">${esc(x.conferenza)}</span>`:""}</td>
      <td>${n(x.partite)}</td>
      <td class="big">${n(x.vittorie)}</td>
      <td>${n(x.sconfitte)}</td>
      <td>${n(x.percVittorie)}</td>
      <td>${n(x.mediaFatti)}</td>
      <td>${n(x.mediaSubiti)}</td>
      <td>${x.vittorieCasa!==null&&x.vittorieCasa!==undefined?`${x.vittorieCasa}/${x.partiteCasa}`:"—"}</td>
      <td>${x.vittorieFuori!==null&&x.vittorieFuori!==undefined?`${x.vittorieFuori}/${x.partiteFuori}`:"—"}</td>
    </tr>`;
  });
  return h+`</tbody></table>`;
}

/* ================= A-LEAGUE ================= */

/* Il campionato australiano fornisce le sole classifiche arbitrali,
   già aggregate dalla fonte: non ci sono partite né squadre, quindi
   niente scheda arbitro con l'elenco delle gare dirette. */
function vArbitriAleague(){
  const A = D.arbitri || [];
  if(!A.length){
    return `<div class="sub" style="margin-top:0">Nessun dato disponibile</div>`;
  }

  const q = ricerca.trim().toLowerCase();
  const o = ord.arbitri;
  const lista = A
    .filter(a=>!q || a.nome.toLowerCase().includes(q)
                  || (a.nazionalita||"").toLowerCase().includes(q))
    .slice()
    .sort((a,b)=>confronta(a,b,o.campo,o.dir) || a.nome.localeCompare(b.nome));

  const conMedia = lista.filter(a=>a.mediaCartellini!==null&&a.mediaCartellini!==undefined);
  const media = conMedia.length
    ? (conMedia.reduce((s,a)=>s+a.mediaCartellini,0)/conMedia.length).toFixed(2) : "—";
  const partite = lista.reduce((s,a)=>s+(a.partite||0),0);

  let h = `<div class="sub" style="margin-top:0">
      ${esc(D.campionato||"")} · medie fornite dalla fonte</div>
    <div class="filtri">
      <input class="cerca" type="search" placeholder="Cerca arbitro…"
             value="${esc(ricerca)}" oninput="cercaSquadra(this.value)">
      <div class="conteggio">${lista.length} arbitri · ${partite} presenze
        ${D.stagione && D.stagione!=="tutte" ? " · stagione "+esc(D.stagione) : ""}</div>
    </div>
    ${kpi([lista.length,"ARBITRI"],[partite,"PRESENZE"],[media,"CART / PARTITA"])}
    <div class="titolo"><i></i><span>CLASSIFICA SEVERITÀ</span></div>
    <div class="titolo-sub">Tocca un'intestazione per ordinare</div>
    <table class="tab"><thead><tr>
      ${th("arbitri","nome","Arbitro",true)}
      ${th("arbitri","partite","PG")}
      ${th("arbitri","mediaCartellini","CART")}
      ${th("arbitri","mediaGialli","GIA")}
      ${th("arbitri","rossi","ROS")}
      <th></th>
    </tr></thead><tbody>`;

  lista.forEach((a,i)=>{
    const storico = (a.perStagione||[]).length;
    h += `<tr class="click" onclick="apriArbitroAleague('${esc(a.nome).replace(/'/g,"\\'")}')">
      <td><span class="pos">${i+1}</span><span class="nome">${esc(a.nome)}</span>${
        storico?`<span style="display:block;font-size:8px;color:${MUTED}">${storico} stagioni</span>`:""}</td>
      <td>${n(a.partite)}</td>
      <td class="big">${n(a.mediaCartellini)}</td>
      <td class="gia">${n(a.mediaGialli)}</td>
      <td class="${a.rossi>0?"ros":""}">${n(a.rossi)}</td>
      <td class="freccia">›</td>
    </tr>`;
  });
  h += `</tbody></table>`;

  if(D.attribuzione){
    h += `<div class="avviso-fonte">${esc(D.attribuzione)}</div>`;
  }
  return h;
}

function apriArbitroAleague(nome){ arbitroAleague=nome; window.scrollTo(0,0); render(); }
function chiudiArbitroAleague(){ arbitroAleague=null; window.scrollTo(0,0); render(); }

/* Scheda di un singolo arbitro australiano: medie complessive e, se le
   stagioni sono state scaricate, l'andamento nel tempo. */
function vSchedaAleague(){
  const a=(D.arbitri||[]).find(x=>x.nome===arbitroAleague);
  if(!a) return `<button class="back" onclick="chiudiArbitroAleague()">‹ INDIETRO</button>
                 <div class="empty">Arbitro non trovato</div>`;

  const pos=(D.arbitri||[]).findIndex(x=>x.nome===arbitroAleague)+1;
  const storico=a.perStagione||[];

  let h=`<button class="back" onclick="chiudiArbitroAleague()">‹ TUTTI GLI ARBITRI</button>

  <div class="scheda-top">
    <div class="scheda-testa">
      ${avatar(a.nome, 54)}
      <div>
        <div class="scheda-nome">${esc(a.nome)}</div>
        <div class="scheda-meta">${a.partite} partite dirette · ${pos}° per severità${
          a.nazionalita?" · "+esc(a.nazionalita):""}</div>
      </div>
    </div>
  </div>

  <div class="dati">
    <div class="dato"><b>${n(a.mediaGialli)}</b><span>GIALLI MEDI</span></div>
    <div class="dato"><b>${n(a.mediaRossi)}</b><span>ROSSI MEDI</span></div>
    <div class="dato"><b class="n">${a.gialli}</b><span>GIALLI TOTALI</span></div>
    <div class="dato"><b class="n">${a.rossi}</b><span>ROSSI TOTALI</span></div>
  </div>

  <div class="conf">
    <span class="conf-lab">CARTELLINI PER PARTITA</span>
    <span class="conf-val">${n(a.mediaCartellini)}</span>
  </div>`;

  if(storico.length){
    h+=`<div class="titolo"><i></i><span>STAGIONE PER STAGIONE</span></div>
      <div class="titolo-sub">Andamento nel tempo</div>
      <table class="tab"><thead><tr>
        <th>Stagione</th><th>PG</th><th>CART</th><th>GIA</th><th>ROS</th>
      </tr></thead><tbody>`;
    storico.forEach(x=>{
      h+=`<tr>
        <td><span class="nome">${esc(x.stagione)}</span></td>
        <td>${n(x.partite)}</td>
        <td class="big">${n(x.mediaCartellini)}</td>
        <td class="gia">${n(x.mediaGialli)}</td>
        <td class="${x.rossi>0?"ros":""}">${n(x.rossi)}</td>
      </tr>`;
    });
    h+=`</tbody></table>`;
  } else {
    h+=`<div class="empty" style="margin-top:16px">
      <div style="font-size:10px;color:${MUTED};line-height:1.8">
        Nessun dettaglio per stagione.<br>
        Si ottiene indicando le stagioni nella variabile STAGIONI_ALEAGUE.</div></div>`;
  }

  if(D.attribuzione){
    h += `<div class="avviso-fonte">${esc(D.attribuzione)}</div>`;
  }
  return h;
}

/* ================= CALENDARIO ================= */

function caricaCalendario(){
  if(calendario) return Promise.resolve(calendario);
  return fetch("calendario.json?t="+Date.now())
    .then(r=>{ if(!r.ok) throw new Error("calendario.json non trovato"); return r.json(); })
    .then(d=>{ calendario=d; return d; });
}

function quandoEsteso(iso, ora){
  if(!iso) return "";
  const d=new Date(iso+"T12:00:00");
  if(isNaN(d.getTime())) return esc(iso);
  const g=d.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"});
  return ora ? `${g} · ore ${esc(ora)}` : g;
}

/* Quanto manca alla partita, in forma leggibile */
function traQuanto(iso){
  if(!iso) return "";
  const d=new Date(iso+"T12:00:00");
  if(isNaN(d.getTime())) return "";
  const oggi=new Date(); oggi.setHours(12,0,0,0);
  const gg=Math.round((d-oggi)/86400000);
  if(gg<=0) return "oggi";
  if(gg===1) return "domani";
  if(gg<7) return "fra "+gg+" giorni";
  return "";
}

function vCalendario(){
  if(!calendario){
    caricaCalendario().then(()=>render()).catch(()=>{
      const a=document.getElementById("app"); a.className="";
      a.innerHTML=`<div class="empty">
        <div style="font-size:26px;margin-bottom:10px">⚑</div>
        <div class="nome" style="font-size:20px;margin-bottom:10px">CALENDARIO NON DISPONIBILE</div>
        <div style="font-size:10px;color:${MUTED};line-height:1.9">
          Manca il file <code>docs/calendario.json</code>.<br>
          Lancia il workflow "Aggiorna calendario" dal tab Actions.</div></div>`;
    });
    return `<div class="loading">Caricamento calendario…</div>`;
  }

  const C = (calendario.campionati||{})[legaAttiva];
  const gare = (C && C.partite) || [];

  let h = `<div class="sub" style="margin-top:0">
    Prossime partite${calendario.fusoOrario?" · orari in "+esc(calendario.fusoOrario):""}
    <br>fonte ${esc(calendario.fonte||"")}</div>`;

  if(!gare.length){
    return h + `<div class="empty" style="margin-top:16px">
      <div style="font-size:10px;color:${MUTED};line-height:1.8">
        Nessuna partita in programma nei prossimi
        ${calendario.giorniAvanti||45} giorni.<br>
        Il file viene aggiornato ogni giorno.</div></div>`;
  }

  // raggruppa per giorno, così le partite dello stesso turno stanno insieme
  const perGiorno = [];
  gare.forEach(g=>{
    const ultimo = perGiorno[perGiorno.length-1];
    if(ultimo && ultimo.data===g.data) ultimo.gare.push(g);
    else perGiorno.push({data:g.data, gare:[g]});
  });

  h += `<div class="titolo"><i></i><span>PROSSIME PARTITE</span></div>
        <div class="titolo-sub">${gare.length} gare · tocca un giorno per aprirlo</div>`;

  perGiorno.forEach((gruppo, i)=>{
    const chiave = "cal|" + gruppo.data;
    // Il primo giorno resta aperto: è quello che si guarda per primo.
    const aperto = settimaneAperte.has(chiave) || (i===0 && !settimaneAperte.size);
    const manca = traQuanto(gruppo.data);
    const conArbitro = gruppo.gare.filter(g=>g.arbitro).length;

    h += `<button class="gruppo${aperto?" on":""}" onclick="apriGruppo('${esc(chiave)}')">
      <span class="gruppo-tit">${esc(quandoEsteso(gruppo.data,null)).toUpperCase()}</span>
      <span class="gruppo-sub">${gruppo.gare.length} gare${
        manca?" · "+esc(manca):""}${conArbitro?` · ${conArbitro} con arbitro`:""}</span>
      <span class="gruppo-freccia">${aperto?"▴":"▾"}</span>
    </button>`;

    if(!aperto) return;

    h += `<div class="gruppo-corpo grid">`;
    gruppo.gare.forEach(g=>{
      h += `<div class="gara">
        <div class="gara-squadre">
          <span>${esc(g.casa)}</span>
          <span class="vs">${g.ora?esc(g.ora):"VS"}</span>
          <span style="text-align:right">${esc(g.ospite)}</span>
        </div>
        ${g.arbitro?`<div class="gara-arb">arbitro: <span style="color:${FLUO}">${esc(g.arbitro)}</span>${
          g.var?` · VAR: ${esc(g.var)}`:""}</div>`:""}
      </div>`;
    });
    h += `</div>`;
  });
  return h;
}

/* ================= PARTITE ================= */
function vPartite(){
  const P=D.ultimePartite||[];
  if(!P.length) return `<div class="sub" style="margin-top:0">Nessuna partita in archivio</div>`;

  const conScheda=new Set((D.arbitri||[]).map(a=>a.nome));

  let h=`<div class="sub" style="margin-top:0">Le più recenti registrate</div>
    <div class="titolo"><i></i><span>RISULTATI</span></div>
    <div class="titolo-sub">G = gialli casa-ospite · R = rossi totali · tocca l'arbitro per la scheda</div>
    <table class="tab"><thead><tr>
      <th>Partita</th><th>Ris</th><th>G</th><th>R</th><th>Arbitro</th>
    </tr></thead><tbody>`;

  P.forEach(p=>{
    const rt=(p.rossiCasa||0)+(p.rossiOspite||0);
    const arb=(p.arbitro||"").trim();
    let cella;
    if(!arb){
      cella=`<span style="font-size:12px;color:${MUTED}">—</span>`;
    } else if(conScheda.has(arb)){
      cella=`<span class="arb" style="font-size:12px;cursor:pointer"
        onclick="vaiArbitro('${esc(arb).replace(/'/g,"\\'")}')">${esc(arb)}</span>`;
    } else {
      // arbitro noto ma senza statistiche disciplinari: mostrato, non cliccabile
      cella=`<span style="font-size:12px;color:${MUTED}">${esc(arb)}</span>`;
    }
    h+=`<tr>
      <td style="line-height:1.5">
        <span style="font-size:10px">${esc(p.casa)} – ${esc(p.ospite)}</span>
        <span style="display:block;font-size:8px;color:${MUTED}">${esc(p.data)}</span>
      </td>
      <td style="color:${FLUO};font-weight:700">${n(p.gc,"?")}-${n(p.go,"?")}</td>
      <td class="gial">${n(p.gialliCasa,"–")}-${n(p.gialliOspite,"–")}</td>
      <td class="${rt>0?"ros":""}">${rt||"–"}</td>
      <td style="text-align:right">${cella}</td>
    </tr>`;
  });
  return h+`</tbody></table>`;
}
</script>
