function stCarica(file){
  if(!ST_CACHE[file]) ST_CACHE[file] = fetch("stats/"+file+"?t="+Math.floor(Date.now()/600000))
    .then(r=>{ if(!r.ok) throw new Error(file); return r.json(); })
    .catch(e=>{ delete ST_CACHE[file]; throw e; });
  return ST_CACHE[file];
}
function stIndice(lega){
  if(ST_INDICE[lega]) return Promise.resolve(ST_INDICE[lega]);
  return fetch(`stats/indice_${lega}.json?t=`+Math.floor(Date.now()/600000)).then(r=>r.ok?r.json():null).then(d=>{ if(d) ST_INDICE[lega]=d; return d; });
}
function stSettimane(tutte){
  if(ST.periodo==="tutta") return null;
  if(ST.periodo.startsWith("u")) return new Set(tutte.slice(-Number(ST.periodo.slice(1))));
  return new Set([Number(ST.periodo.slice(1))]);
}
/* somma le righe del periodo per giocatore o per squadra */
function stAggrega(dati, tutte){
  const w=stSettimane(tutte), basi=dati.basi, mx=new Set(dati.max||[]), gruppi=new Map();
  for(const r of dati.righe){
    if(w && !w.has(r[1])) continue;
    const sq=r[2], avv=r[3];
    let chiave;
    if(ST.modo==="giocatori"){ if(ST.squadra && dati.squadre[sq]!==ST.squadra) continue; chiave=r[0]; }
    else chiave = ST.lato==="fatte" ? sq : avv;
    let a=gruppi.get(chiave);
    if(!a){ a={id:chiave, settimane:new Set(), ultimaW:-1, sq:null}; basi.forEach(b=>a[b]=0); gruppi.set(chiave,a); }
    basi.forEach((b,i)=>{ const v=r[4+i]; a[b] = mx.has(b) ? Math.max(a[b],v) : a[b]+v; });
    a.settimane.add(r[1]+"|"+(ST.modo==="giocatori"?"":sq+"-"+avv));
    if(r[1]>=a.ultimaW){ a.ultimaW=r[1]; a.sq=dati.squadre[sq]; }
  }
  const out=[...gruppi.values()];
  out.forEach(a=>{ a.g = ST.modo==="giocatori" ? new Set([...a.settimane].map(x=>x.split("|")[0])).size : a.settimane.size;
    if(ST.modo==="squadre") a.sq = dati.squadre[a.id]; });
  return out;
}
function stValore(col, a){
  const v=col[2](a);
  if(v===null||v===undefined||!isFinite(v)) return null;
  return (ST.misura==="pg" && !col[4] && a.g) ? v/a.g : v;
}
function stFmt(v, col){
  if(v===null) return "—";
  const dec = ST.misura==="pg" && !col[4] ? Math.max(col[3]||0,1) : (col[3]||0);
  const s = v.toLocaleString("it-IT",{minimumFractionDigits:dec,maximumFractionDigits:dec,useGrouping:"always"});
  return col[0]==="epa" && v>0 ? "+"+s : s;
}

/* Ora italiana → istante: l'offset di Roma si chiede al browser (ora solare o legale) */
function istanteRoma(dataIt, oraIt){
  if(!dataIt || !oraIt) return null;
  const [a,m,g]=dataIt.split("-").map(Number), [h,mi]=oraIt.split(":").map(Number);
  const utc=Date.UTC(a,m-1,g,h,mi);
  let off=1;
  try{
    const t=new Intl.DateTimeFormat("en-US",{timeZone:"Europe/Rome",timeZoneName:"shortOffset"}).formatToParts(new Date(utc))
      .find(p=>p.type==="timeZoneName"); const x=/GMT([+-]\d+)/.exec(t?t.value:""); if(x) off=Number(x[1]);
  }catch(e){}
  return new Date(utc-off*3600e3);
}

function prossimoVia(P){
  const ora=Date.now();
  const future=P.filter(p=>!finitaP(p)).map(p=>({p, t:istanteRoma(p.dataIt,p.oraIt)})).filter(x=>x.t && x.t.getTime()>ora-4*3600e3)
    .sort((a,b)=>a.t-b.t);
  return future[0]||null;
}
function testoContoAllaRovescia(t){
  const d=t.getTime()-Date.now();
  if(d<=0) return "IN CORSO";
  const g=Math.floor(d/864e5), h=Math.floor(d%864e5/36e5), m=Math.floor(d%36e5/6e4);
  return g?`${g}g ${h}h ${m}m`:h?`${h}h ${m}m`:`${m}m`;
}
function aggiornaContoAllaRovescia(){
  const el=document.getElementById("h-cd-tempo");
  if(!el){ clearInterval(homeTimer); homeTimer=null; return; }
  el.textContent=testoContoAllaRovescia(new Date(Number(el.dataset.t)));
}
function strisciaH(wk){
  const P=wk.partite; if(!P.length) return "";
  const pv=prossimoVia(P);
  let cd="";
  if(pv){
    const stesse=P.filter(p=>!finitaP(p) && p.dataIt===pv.p.dataIt && p.oraIt===pv.p.oraIt).length;
    cd=`<div class="h-cd"><small>${pv.t.getTime()<=Date.now()?"ORA IN CAMPO":"PROSSIMO VIA"}</small><b id="h-cd-tempo" data-t="${pv.t.getTime()}">${testoContoAllaRovescia(pv.t)}</b>
      <span>${esc(quandoBreve(pv.p))} · ${stesse} ${stesse===1?"partita":"partite"}</span></div>`;
    if(!homeTimer) homeTimer=setInterval(aggiornaContoAllaRovescia, 30000);
  }
  const celle=P.slice(0,24).map(p=>{
    const fin=finitaP(p), m=meteoDi(p), ic=fin?"":iconaMeteo(m);
    const w=fin?(p.pc>p.po?"c":p.po>p.pc?"o":""):"";
    return `<div class="h-tk${fin?" fin":""}"><small>${fin?"FINALE":esc(quandoBreve(p)).toUpperCase()}${ic?" "+ic:""}${!fin&&tvInclusa(p)?` <span class="tv incl mini" title="Inclusa negli abbonamenti DAZN">DAZN</span>`:""}</small>
      <span class="${w==="o"?"vince":""}">${stemma(p.ospite,true)}${esc(breve(p.ospite))}<b>${fin?p.po:""}</b></span>
      <span class="${w==="c"?"vince":""}">${stemma(p.casa,true)}${esc(breve(p.casa))}<b>${fin?p.pc:""}</b></span></div>`;
  }).join("");
  return `<div class="h-ticker"><div class="h-tk-tit">WEEK ${esc(wk.settimana)}</div>${cd}${celle}</div>`;
}

/* ---------- apertura: la partita della settimana (articolo più recente) e l'ultima partita ---------- */
function articoloPieno(id){
  if(!id) return null;
  if(ART_CACHE[id]===undefined){ ART_CACHE[id]=false;
    scaricaDati(`articoli/${id}.json`).then(x=>{ ART_CACHE[id]=x; render(); }).catch(()=>{ ART_CACHE[id]={errore:true}; }); }
  return ART_CACHE[id]||null;
}
function articoliLega(lega){ return (ART||[]).filter(a=>a.lega===lega).slice().sort((a,b)=>String(b.pubblicato).localeCompare(String(a.pubblicato))); }
/* Crediti delle foto degli stadi (Wikimedia Commons, 22/11/2026): autore, licenza con il suo collegamento e
   pagina del file. Accetta anche i crediti vecchi in testo («autore · licenza»). conLink=false dentro i collegamenti. */
function creditoFoto(c, conLink){
  if(!c) return "";
  if(typeof c==="string") return "Foto: "+esc(c)+" · Wikimedia Commons";
  const L=(u,t)=>conLink&&/^https:\/\//.test(u||"")?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>`:esc(t);
  return `Foto: ${L(c.pagina, c.autore)} · ${L(c.licenzaUrl, c.licenza)} · ${L(c.pagina,"Wikimedia Commons")}`;
}
function copertinaH(a, lega){
  if(!a) return `<div class="h-cover vuota"><b>Gli articoli della settimana arrivano qui</b></div>`;
  const pieno=articoloPieno(a.id)||{};

    :`background:linear-gradient(135deg,${esc(col[0]||"#1F2937")},${esc(col[1]||"#0B0F1A")})`;
  return `<a class="h-cover" style="${sfondo}" href="#articolo=${esc(a.id)}" onclick="apriArticolo('${esc(a.id)}');return false">
    <span class="h-tag luce">${a.tipo==="cronaca"?"LA CRONACA":"LA PARTITA DELLA SETTIMANA · ANTEPRIMA"}</span>

    ${pieno.foto&&pieno.fotoCrediti?`<span class="h-cred">${creditoFoto(pieno.fotoCrediti,false)}</span>`:""}</a>`;
}

/* ---------- la corsa: playoff e ranking ---------- */
function homeScegliConf(c){ homeConf=c; render(); }
function homeTutteRank(){ homeTutte=!homeTutte; render(); }
function corsaH(H){
  const c=H.corsa, r=H.ranking;
  if(!c && !r) return "";
  let pl="";
  if(c && c.squadre){
    const lato=conf=>{
      const L=c.squadre.filter(s=>s.conference===conf).slice(0, homeTutte?16:10);
      return `<div class="h-conf${conf===homeConf?" on":""}"><h3>${conf}</h3><ol class="h-lista">${L.map((s,i)=>`
        <li class="${i<7?"":"fuori"}"><span class="h-pos">${i+1}</span>${stemma(s.squadra,true)}<b>${esc(breve(s.squadra))}<small>${esc(s.bilancio)}</small></b>
          <span class="h-bar"><i style="width:${Math.round(s.p*100)}%"></i></span><em>${pct(s.p)}</em></li>${i===6?`<li class="h-taglio">linea dei playoff</li>`:""}`).join("")}</ol></div>`;
    };
    pl=cardH("CORSA AI PLAYOFF", `<div class="h-schede">${["AFC","NFC"].map(x=>`<button class="${x===homeConf?"on":""}" onclick="homeScegliConf('${x}')">${x}</button>`).join("")}</div>
      <div class="h-due">${lato("AFC")}${lato("NFC")}</div>
      <p class="h-nota">Probabilità di andare ai playoff: ${numIt(c.simulazioni,0).replace(/\B(?=(\d{3})+(?!\d))/g,".")} simulazioni del resto della stagione, partita per partita. In ordine di probabilità, non di seed.</p>`);
  }
  let rk="";
  if(r && r.squadre){
    const L=r.squadre.slice(0, homeTutte?32:10);
    rk=cardH(`RANKING PURESTATS · DOPO LA WEEK ${esc(r.settimana)}`, `<ol class="h-lista">${L.map(s=>{
      const mv=s.mov==null?"":s.mov>0?`<span class="h-mov su">▲${s.mov}</span>`:s.mov<0?`<span class="h-mov giu">▼${-s.mov}</span>`:`<span class="h-mov">=</span>`;
      return `<li><span class="h-pos">${s.pos}</span>${stemma(s.squadra,true)}<b>${esc(breve(s.squadra))}</b>${mv}<em>${s.punti>0?"+":""}${numIt(s.punti)}</em></li>`;
    }).join("")}</ol><p class="h-nota">${esc(r.nota||"")}</p>`);
  }
  return sezioneH("La corsa", `<div class="h-g21">${pl}${rk}</div>`, `<a href="#" onclick="homeTutteRank();return false">${homeTutte?"Mostra meno":"Mostra tutte"} →</a>`, "grafico");
}

/* ---------- la strada verso i playoff: partite decisive + meteo ---------- */
function stradaH(H, wk){
  const dec=((H.corsa||{}).decisive)||[];
  if(!dec.length) return "";
  const righe=dec.slice(0,6).map(g=>{
    const p={...g, stagione:(H.corsa||{}).stagione, _nfl:true};
    const lato=(s,e)=>`<span>${stemma(s,true)}<b>${esc(breve(s))}</b><em>${pct(e.ora)}</em><i title="se vince / se perde">${pct(e.seVince)} / ${pct(e.sePerde)}</i></span>`;
    return `<li><div class="dc-sx"><span class="dc-wk">WEEK ${esc(g.settimana)}</span><span class="dc-data">${esc(quandoBreve(g))}</span><span>${tvBadge(p)}</span></div>
      <div class="dc-sq">${lato(g.ospite,g.esitoOspite)}${lato(g.casa,g.esitoCasa)}</div>
      <div class="dc-dx"><span class="dc-lev"><i style="width:${Math.min(100,Math.round(g.peso/0.8*100))}%"></i></span><small>peso sui playoff</small></div></li>`;
  }).join("");
  const dc=cardH("LE PARTITE CHE DECIDONO LA STAGIONE", `<ul class="dc">${righe}</ul>
    <p class="h-nota">Per ogni squadra: probabilità di playoff oggi, poi se vince / se perde quella partita. Il peso somma i due salti.</p>`);
  // meteo da tenere d'occhio: le partite della week con l'impatto più alto
  const ord={alto:2,medio:1};
  const mt=wk.partite.filter(p=>!finitaP(p)).map(p=>({p,m:meteoDi(p)})).filter(x=>x.m && !x.m.coperto && !x.m.campoNeutro && x.m.tempC!=null)
    .sort((a,b)=>(ord[b.m.impatto]||0)-(ord[a.m.impatto]||0) || (b.m.pioggia||0)-(a.m.pioggia||0) || (b.m.raffKmh||0)-(a.m.raffKmh||0)).slice(0,3);
  const met=cardH("METEO DA TENERE D'OCCHIO", mt.length?`<ul class="h-meteo">${mt.map(({p,m})=>`
    <li><span class="h-mic">${iconaMeteo(m)}</span><span><b>${esc(breve(p.ospite))} @ ${esc(breve(p.casa))}</b>
      <small>${m.pioggia!=null?`pioggia ${m.pioggia}%`:""}${m.raffKmh?` · raffiche ${m.raffKmh} km/h`:""} · ${m.tempC}°${m.impatto==="alto"||m.impatto==="medio"?` · impatto ${m.impatto}`:""}</small>
      <small>${esc(quandoBreve(p))}${p.stadio?" · "+esc(p.stadio):""}</small></span></li>`).join("")}</ul>
    <p class="h-nota">Previsioni per l'ora del via (NWS e Open-Meteo), più fitte nelle 12 ore prima.</p>`
    :`<p class="h-nota">Le previsioni arrivano nei 7 giorni prima delle partite.</p>`);
  return sezioneH("La strada verso i playoff", `<div class="h-g21">${dc}${met}</div>`, linkH("Calendario completo","vai('partite')"), "barre");
}

/* ---------- storia: accadde oggi, mai battuto, dinastie ---------- */
function storiaH(H){
  const oggi=new Date(), k=`${String(oggi.getMonth()+1).padStart(2,"0")}-${String(oggi.getDate()).padStart(2,"0")}`;
  const ac=(H.accadde||{})[k];
  const giorno=Math.floor(Date.now()/864e5);
  let c1="", c2="", c3="";
  if(ac){
    const vince=ac.pc>ac.po?"casa":"ospite";
    const qb=ac.qbOspite&&ac.qbCasa?`${esc(ac.qbOspite)} contro ${esc(ac.qbCasa)}`:"";
    c1=cardH(`ACCADDE OGGI · ${ac.anni} ANNI FA`, `<div class="h-big"><span class="h-num">${esc(String(ac.data).slice(0,4))}</span>
      <span><b>${esc(ac.nomeOspite||ac.ospite)} ${ac.po}, ${esc(ac.nomeCasa||ac.casa)} ${ac.pc}</b>
      <small>${ac.tipo==="REG"?`Week ${esc(ac.settimana)}`:""}${ac.note&&ac.note.length?(ac.tipo==="REG"?" · ":"")+esc(ac.note.join(" · ")):""}</small>
      ${qb?`<small>Quarterback: ${qb}</small>`:""}${ac.stadio?`<small>${esc(ac.stadio)}</small>`:""}</span></div>`);
  }
  const mb=(LEG&&LEG.maiBattuti)||[];
  if(mb.length){
    const m=mb[giorno%mb.length], v=m.vicino;
    const f=x=>Number(x).toLocaleString("it-IT",{maximumFractionDigits:1});
    c2=cardH("MAI BATTUTO", `<div class="h-big"><span class="h-num">${f(m.valore)}</span><span><b>${esc(m.titolo)}: ${esc(m.detentore)}</b>
      ${v?`<small>Il più vicino in attività è ${esc(v.nome)}, a ${f(m.valore-v.valore)}.</small>`:""}</span></div>
      ${v?`<span class="h-bar lungo"><i style="width:${Math.round(v.valore/m.valore*100)}%"></i></span>`:""}`);
  }
  const din=(LEG&&LEG.dinastie)||[];
  if(din.length){
    const d=din[giorno%din.length], vinte=(d.finali||[]).filter(x=>x.vinta).length;
    c3=cardH("DINASTIE", `<div class="h-big"><span class="h-num">${vinte}</span><span><b>${esc(d.nome)}</b>
      <small>${esc(d.dal)}–${esc(d.al)} · ${vinte} ${vinte===1?"titolo":"titoli"} in ${(d.finali||[]).length} Super Bowl · ${esc(d.allenatore||"")}${d.qb?" e "+esc(d.qb):""}</small></span></div>`);
  }
  if(!c1 && !c2 && !c3) return "";
  return sezioneH("Storia", `<div class="h-g3">${c1}${c2}${c3}</div>`, linkH("Leggende","vai('leggende')"), "clessidra");
}

async function stDisegna(){

  if(!document.getElementById("st-radice")) return;          // nel frattempo si è cambiata pagina

function stAggiorna(campo, valore){
  ST[campo]=valore;

  if(["cat","modo","lato"].includes(campo)) ST.ord=null;
  if(campo==="cerca"){                                       // solo il corpo: chi scrive non perde il cursore
    const c=document.getElementById("st-corpo");
    const ind=ST_INDICE[legaAttiva], file=`${legaAttiva}_${ST.stagione}_${ST.cat}.json`;
    if(c && ST_CACHE[file]) ST_CACHE[file].then(d=>{ c.innerHTML=stTabella(d, ind.settimane[String(ST.stagione)]||[]); });
    return;
  }
  stDisegna();
}
function stFiltri(ind, tutte, dati){

  const seg=(campo,voci)=>`<div class="st-seg">${voci.map(([v,t])=>`<button class="${ST[campo]===v?"on":""}" onclick="stAggiorna('${campo}','${v}')">${t}</button>`).join("")}</div>`;
  const periodi=[["tutta","Tutta la stagione"],["u3","Ultime 3 week"],["u5","Ultime 5 week"],...tutte.slice().reverse().map(w=>["w"+w,"Week "+w])];
  const squadre = dati ? dati.squadre.filter(s => legaAttiva!=="college" || (D.loghi||{})[s]).sort((a,b)=>breve(a).localeCompare(breve(b))) : [];

  return `<details class="st-box"${largo||ST.filtriAperti?" open":""} ontoggle="ST.filtriAperti=this.open"><summary>Filtri <span>${esc(riassunto)}</span></summary>
  <div class="st-filtri">
    <select aria-label="Stagione" onchange="stAggiorna('stagione',Number(this.value))">${ind.stagioni.map(s=>opz(s,"Stagione "+s,ST.stagione)).join("")}</select>
    <select aria-label="Periodo" onchange="stAggiorna('periodo',this.value)">${periodi.map(([v,t])=>opz(v,t,ST.periodo)).join("")}</select>
    ${ST.modo==="giocatori"
      ? `<select aria-label="Squadra" onchange="stAggiorna('squadra',this.value)">${opz("","Tutte le squadre",ST.squadra)}${squadre.map(s=>opz(s,breve(s),ST.squadra)).join("")}</select>`
      : ""}
    ${seg("misura",[["tot","Totali"],["pg","A partita"]])}
    ${ST.modo==="giocatori"?`<input type="search" placeholder="Cerca un giocatore…" value="${esc(ST.cerca)}" oninput="stAggiorna('cerca',this.value)">`:""}
  </div></details>
  <div class="st-cat">${Object.keys(ST_COL[legaAttiva]).map(c=>`<button class="${ST.cat===c?"on":""}" onclick="stAggiorna('cat','${c}')">${ST_NOMI[c]}</button>`).join("")}</div>`;
}
function stOrdinate(dati, tutte){
  const spec=ST_COL[legaAttiva][ST.cat], ord=ST.ord||spec.o, col=spec.c.find(c=>c[0]===ord)||spec.c[0];
  let righe=stAggrega(dati, tutte);
  if(ST.modo==="squadre" && legaAttiva==="college") righe=righe.filter(a=>(D.loghi||{})[a.sq]);
  const qual = ST.modo==="giocatori" && ST.soloQual && spec.q && !ST.cerca ? spec.q : null;
  if(qual) righe=righe.filter(qual[0]);
  righe.forEach(a=>a._v=stValore(col,a));
  righe.sort((x,y)=>{ const a=x._v, b=y._v; if(a===null) return 1; if(b===null) return -1; return ST.giu?b-a:a-b; });
  righe.forEach((a,i)=>a._pos=i+1);
  return {righe, col, spec, qual};
}
function stTabella(dati, tutte){
  const {righe:tutteRighe, col, spec, qual} = stOrdinate(dati, tutte);
  let righe=tutteRighe;
  if(ST.modo==="giocatori" && ST.cerca){ const q=stNorm(ST.cerca); righe=righe.filter(a=>stNorm((dati.giocatori[a.id]||[""])[0]).includes(q)); }
  const visibili=righe.slice(0,ST.mostra), primo=righe[0]&&righe[0]._v;
  const nome = a => ST.modo==="giocatori"
    ? `<button class="st-link" onclick="stApri('${esc(a.id)}')"><b>${esc((dati.giocatori[a.id]||["?"])[0])}</b><small>${esc(breve(a.sq))}${(dati.giocatori[a.id]||[])[1]?" · "+esc(dati.giocatori[a.id][1]):""}</small></button>`
    : `<span><b>${esc(breve(a.sq))}</b><small>${ST.lato==="fatte"?"fatte":"concesse agli avversari"}</small></span>`;
  // sul telefono la colonna scelta viene subito dopo il nome, così si vede senza scorrere
  const colonne = window.matchMedia("(max-width:760px)").matches ? [col, ...spec.c.filter(c=>c!==col)] : spec.c;
  const testa = `<tr><th>#</th><th class="st-nome">${ST.modo==="giocatori"?"Giocatore":"Squadra"}</th><th>PG</th>${colonne.map(c=>
    `<th class="${c[0]===col[0]?"on":""}" onclick="stOrdina('${c[0]}')" title="Ordina">${esc(c[1])}${c[0]===col[0]?(ST.giu?" ▼":" ▲"):""}</th>`).join("")}</tr>`;
  const corpo = visibili.map(a=>`<tr><td class="st-pos">${a._pos}</td><td class="st-nome">${stemma(a.sq,true)}${nome(a)}</td><td>${a.g}</td>${colonne.map(c=>{
      const v = c[0]===col[0] ? a._v : stValore(c,a);
      return `<td class="${c[0]===col[0]&&v!==null&&v===primo&&a._pos===1?"st-top":""}${c[0]===col[0]?" st-sel":""}">${stFmt(v,c)}</td>`; }).join("")}</tr>`).join("");
  const nota = [qual?`Qualificati: ${qual[1]} (<button class="st-mini" onclick="ST.soloQual=false;stAggiorna('mostra',50)">mostra tutti</button>)`:
               (ST.modo==="giocatori"&&spec.q&&!ST.soloQual?`Tutti i giocatori (<button class="st-mini" onclick="ST.soloQual=true;stAggiorna('mostra',50)">solo qualificati</button>)`:""),
               "tocca un'intestazione per ordinare", ST.modo==="giocatori"?"tocca un nome per la scheda":""].filter(Boolean).join(" · ");
  return `<p class="st-nota">${nota}</p>
  ${righe.length?`<div class="st-tab"><table><thead>${testa}</thead><tbody>${corpo}</tbody></table></div>`:`<p class="fb-lead">Nessun risultato con questi filtri.</p>`}
  ${righe.length>ST.mostra?`<button class="st-altri" onclick="stAggiorna('mostra',${ST.mostra+50})">Mostra altri (${righe.length-ST.mostra})</button>`:""}
  <p class="st-nota" style="margin-top:12px">${legaAttiva==="nfl"?"Dati: nflverse (CC-BY 4.0), stagione regolare":"Dati: tabellini ESPN, stagione regolare"}</p>`;
}
function stOrdina(k){ if(ST.ord===k || (!ST.ord && ST_COL[legaAttiva][ST.cat].o===k)) ST.giu=!ST.giu; else { ST.ord=k; ST.giu=true; } stDisegna(); }
function stApri(id){ ST.scheda=id; window.scrollTo(0,0); stDisegna(); }

/* Scheda del giocatore: numeri della stagione con la posizione nella lega, grafico e partite week per week */
function stScheda(dati, tutte){
  const spec=ST_COL[legaAttiva][ST.cat], g=dati.giocatori[ST.scheda]||["?",""];
  const salva={...ST}; ST.modo="giocatori"; ST.squadra=""; ST.cerca=""; ST.misura="tot";
  const tutti=stAggrega(dati, tutte), io=tutti.find(a=>a.id===ST.scheda);
  const pool = spec.q ? tutti.filter(spec.q[0]) : tutti;
  Object.assign(ST,{modo:salva.modo,squadra:salva.squadra,cerca:salva.cerca,misura:salva.misura});
  if(!io) return `<button class="st-altri" onclick="stChiudi()">← Torna alla classifica</button><p class="fb-lead">Nessuna partita nel periodo scelto.</p>`;
  const ST_KPI = {passaggi:["yds","td","rat","eff","epa","ypa"],corse:["yds","td","ypc","epa","lng"],ricezioni:["yds","rec","td","ypr"],
    difesa:["tk","sk","int","ff","hur"],calci:["fgm","pct","lng","xpm"],punt:["avg","net","i20","lng"],ritorni:["kry","pry","td","kra"]};
  const principali = ST_KPI[ST.cat].map(k=>spec.c.find(c=>c[0]===k)).filter(Boolean).slice(0,4);
  const kpi = principali.map(c=>{
    const v=c[2](io); if(v===null||!isFinite(v)) return "";
    const valori=pool.map(a=>c[2](a)).filter(x=>x!==null&&isFinite(x)).sort((a,b)=>b-a);
    const pos=valori.findIndex(x=>x<=v)+1, media=valori.length?valori.reduce((s,x)=>s+x,0)/valori.length:null;
    const nota = pos && pool.includes(io) ? `${pos}° su ${valori.length}` : (media!==null?`media ${numIt(media,c[3]||0)}`:"");
    return `<div><b>${stFmt(v,c)}</b><span>${esc(c[1])}</span><em>${nota}</em></div>`; }).join("");
  const mie = dati.righe.filter(r=>r[0]===ST.scheda).sort((a,b)=>a[1]-b[1]);
  const somma = r => { const a={g:1}; dati.basi.forEach((b,i)=>a[b]=r[4+i]); return a; };
  const cg = spec.c.find(c=>c[0]===(ST.ord||spec.o))||spec.c[0];
  const vals = mie.map(r=>cg[2](somma(r))||0), mx=Math.max(1,...vals.map(Math.abs));
  const barre = mie.map((r,i)=>`<div class="st-bar" title="Week ${r[1]}: ${stFmt(vals[i],cg)}"><i style="height:${Math.round(Math.abs(vals[i])/mx*100)}%"></i><span>${r[1]}</span></div>`).join("");
  const partite = mie.slice().reverse().map(r=>{ const a=somma(r);
    return `<tr><td>W${r[1]}</td><td class="st-nome">${stemma(dati.squadre[r[3]],true)}<span>${esc(breve(dati.squadre[r[3]]))}</span></td>${spec.c.map(c=>`<td>${stFmt(c[2](a)===undefined?null:(isFinite(c[2](a))?c[2](a):null),c)}</td>`).join("")}</tr>`; }).join("");
  return `<button class="st-altri" style="margin:0 0 14px" onclick="stChiudi()">← Torna alla classifica</button>
  <div class="st-testata">${stemma(io.sq)}<div><h1>${esc(g[0])}</h1><span class="st-nota">${esc(breve(io.sq))}${g[1]?" · "+esc(g[1]):""} · ${ST_NOMI[ST.cat]} · stagione ${ST.stagione}${ST.periodo==="tutta"?"":" · numeri: "+(ST.periodo.startsWith("u")?"ultime "+ST.periodo.slice(1)+" week":"week "+ST.periodo.slice(1))}</span></div></div>
  <div class="st-cat">${Object.keys(ST_COL[legaAttiva]).map(c=>`<button class="${ST.cat===c?"on":""}" onclick="stAggiorna('cat','${c}')">${ST_NOMI[c]}</button>`).join("")}</div>
  <div class="st-kpi">${kpi}</div>
  <div class="st-scheda"><div class="st-grafico"><b>${esc(cg[1].toUpperCase())} WEEK PER WEEK</b><div class="st-barre">${barre}</div></div>
  <div class="st-tab"><table><thead><tr><th>Week</th><th class="st-nome">Avversario</th>${spec.c.map(c=>`<th>${esc(c[1])}</th>`).join("")}</tr></thead><tbody>${partite}</tbody></table></div></div>`;
}

/* Un giocatore nel confronto: rendimento stagione, ultime 3, passato, esperienza e forma */
function rigaGiocatore(p){
  const tagEsp = p.esperienza ? `<span class="fb-tag${p.giovane?" g":""}">${esc(p.esperienza)}</span>` : "";
  const tagForma = p.forma==="in forma" ? `<span class="fb-tag up">▲ in forma</span>`
                 : p.forma==="in calo" ? `<span class="fb-tag">▼ in calo</span>` : "";
  let m = `${esc(p.misura)}: stagione ${numIt(p.mediaStagione)} · ultime 3 ${numIt(p.mediaUltime3)}`
        + (p.mediaPassato!==null && p.mediaPassato!==undefined ? ` · stagioni prima ${numIt(p.mediaPassato)}` : "");
  if(p.ruolo==="QB" && p.epaLancio!==undefined){
    m += `<br>EPA a lancio: stagione ${p.epaLancio===null?"—":numIt(p.epaLancio,3)} · ultime 3 ${
      p.epaLancioUltime3===null?"—":numIt(p.epaLancioUltime3,3)}${
      p.epaLancioPassato!==null&&p.epaLancioPassato!==undefined?" · prima "+numIt(p.epaLancioPassato,3):""} · ${n(p.td)} TD, ${n(p.int)} INT`;
  }
  if(p.nota) m += `<br>${esc(p.nota)}`;
  return `<div class="fb-pl"><b>${esc(p.nome)}</b> <span class="fb-tag">${esc(p.ruolo)}</span>${tagEsp}${tagForma}<span class="m">${m}</span></div>`;
}

/* Scheda di una singola squadra: andamento stagione per stagione */
function vSquadraFootball(){
  const s=(D.squadre||[]).find(x=>x.nome===squadraAperta);
  if(!s) return `<button class="back" onclick="chiudiSquadra()">‹ INDIETRO</button>
                 <div class="empty">Squadra non trovata</div>`;

  const pos=(D.squadre||[]).findIndex(x=>x.nome===squadraAperta)+1;
  let h=`<button class="back" onclick="chiudiSquadra()">‹ TUTTE LE SQUADRE</button>

  <div class="scheda-top">
    <div class="scheda-testa">
      ${stemma(s.nome).replace('fb-badge fb-stemma','fb-badge fb-stemma xl')}
      <div>
        <div class="scheda-nome">${esc(s.nomeCompleto||s.nome)}</div>
        <div class="scheda-meta">${s.division||s.conference||""} · ${pos}° per percentuale vittorie</div>
      </div>
    </div>
  </div>

  <div class="dati">
    <div class="dato"><b>${n(s.percVittorie)}%</b><span>VITTORIE</span></div>
    <div class="dato"><b class="n">${s.vittorie}-${s.sconfitte}${s.pareggi?"-"+s.pareggi:""}</b><span>RECORD</span></div>
    <div class="dato"><b>${n(s.mediaFatti)}</b><span>PUNTI FATTI<br>A PARTITA</span></div>
    <div class="dato"><b>${n(s.mediaSubiti)}</b><span>PUNTI SUBITI<br>A PARTITA</span></div>
  </div>

  <div class="conf">
    <span class="conf-lab">DIFFERENZA PUNTI COMPLESSIVA</span>
    <span class="conf-val" style="color:${s.differenza<0?"var(--rosso)":"var(--acc)"}">${seg(s.differenza)}</span>
  </div>

  <div class="titolo"><i></i><span>STAGIONE PER STAGIONE</span></div>
  <div class="titolo-sub">CASA e FUORI = vittorie sulle partite giocate</div>
  <div class="fb-scroll"><table class="tab fb-stagioni"><thead><tr>
    <th>Stagione</th><th>PG</th><th>V</th><th>S</th><th>%</th>
    <th>PF</th><th>PS</th><th>CASA</th><th>FUORI</th>
  </tr></thead><tbody>`;

  (s.perStagione||[]).forEach(x=>{
    h+=`<tr>
      <td><span class="nome">${esc(x.stagione)}</span>${
        x.conferenza?`<span class="fb-mini">${esc(x.conferenza)}</span>`:""}</td>
      <td>${n(x.partite)}</td>
      <td class="big">${n(x.vittorie)}</td>
      <td>${n(x.sconfitte)}</td>
      <td>${n(x.percVittorie)}</td>
      <td>${n(x.mediaFatti)}</td>
      <td>${n(x.mediaSubiti)}</td>
      <td>${x.vittorieCasa!==null&&x.vittorieCasa!==undefined?`${x.vittorieCasa}/${x.partiteCasa}`:"—"}</td>
      <td>${x.vittorieFuori!==null&&x.vittorieFuori!==undefined?`${x.vittorieFuori}/${x.partiteFuori}`:"—"}</td>
    </tr>`;
  });
  return h+`</tbody></table></div>`;
}

/* ================= A-LEAGUE ================= */

/* Il campionato australiano fornisce le sole classifiche arbitrali,
   già aggregate dalla fonte: non ci sono partite né squadre, quindi
   niente scheda arbitro con l'elenco delle gare dirette. */
function vArbitriAleague(){
  const A = D.arbitri || [];
  if(!A.length){
    return `<div class="sub" style="margin-top:0">Nessun dato disponibile</div>`;
  }

  const q = ricerca.trim().toLowerCase();
  const o = ord.arbitri;
  const lista = A
    .filter(a=>!q || a.nome.toLowerCase().includes(q)
                  || (a.nazionalita||"").toLowerCase().includes(q))
    .slice()
    .sort((a,b)=>confronta(a,b,o.campo,o.dir) || a.nome.localeCompare(b.nome));

  const conMedia = lista.filter(a=>a.mediaCartellini!==null&&a.mediaCartellini!==undefined);
  const media = conMedia.length
    ? (conMedia.reduce((s,a)=>s+a.mediaCartellini,0)/conMedia.length).toFixed(2) : "—";
  const partite = lista.reduce((s,a)=>s+(a.partite||0),0);

  let h = `<div class="sub" style="margin-top:0">
      ${esc(D.campionato||"")} · medie fornite dalla fonte</div>
    <div class="filtri">
      <input class="cerca" type="search" placeholder="Cerca arbitro…"
             value="${esc(ricerca)}" oninput="cercaSquadra(this.value)">
      <div class="conteggio">${lista.length} arbitri · ${partite} presenze
        ${D.stagione && D.stagione!=="tutte" ? " · stagione "+esc(D.stagione) : ""}</div>
    </div>
    ${kpi([lista.length,"ARBITRI"],[partite,"PRESENZE"],[media,"CART / PARTITA"])}
    <div class="titolo"><i></i><span>CLASSIFICA SEVERITÀ</span></div>
    <div class="titolo-sub">Tocca un'intestazione per ordinare</div>
    <table class="tab"><thead><tr>
      ${th("arbitri","nome","Arbitro",true)}
      ${th("arbitri","partite","PG")}
      ${th("arbitri","mediaCartellini","CART")}
      ${th("arbitri","mediaGialli","GIA")}
      ${th("arbitri","rossi","ROS")}
      <th></th>
    </tr></thead><tbody>`;

  lista.forEach((a,i)=>{
    const storico = (a.perStagione||[]).length;
    h += `<tr class="click" onclick="apriArbitroAleague('${esc(a.nome).replace(/'/g,"\\'")}')">
      <td><span class="pos">${i+1}</span><span class="nome">${esc(a.nome)}</span>${
        storico?`<span style="display:block;font-size:8px;color:${MUTED}">${storico} stagioni</span>`:""}</td>
      <td>${n(a.partite)}</td>
      <td class="big">${n(a.mediaCartellini)}</td>
      <td class="gia">${n(a.mediaGialli)}</td>
      <td class="${a.rossi>0?"ros":""}">${n(a.rossi)}</td>
      <td class="freccia">›</td>
    </tr>`;
  });
  h += `</tbody></table>`;

  if(D.attribuzione){
    h += `<div class="avviso-fonte">${esc(D.attribuzione)}</div>`;
  }
  return h;
}

function apriArbitroAleague(nome){ arbitroAleague=nome; window.scrollTo(0,0); render(); }
function chiudiArbitroAleague(){ arbitroAleague=null; window.scrollTo(0,0); render(); }

/* Scheda di un singolo arbitro australiano: medie complessive e, se le
   stagioni sono state scaricate, l'andamento nel tempo. */
function vSchedaAleague(){
  const a=(D.arbitri||[]).find(x=>x.nome===arbitroAleague);
  if(!a) return `<button class="back" onclick="chiudiArbitroAleague()">‹ INDIETRO</button>
                 <div class="empty">Arbitro non trovato</div>`;

  const pos=(D.arbitri||[]).findIndex(x=>x.nome===arbitroAleague)+1;
  const storico=a.perStagione||[];

  let h=`<button class="back" onclick="chiudiArbitroAleague()">‹ TUTTI GLI ARBITRI</button>

  <div class="scheda-top">
    <div class="scheda-testa">
      ${avatar(a.nome, 54)}
      <div>
        <div class="scheda-nome">${esc(a.nome)}</div>
        <div class="scheda-meta">${a.partite} partite dirette · ${pos}° per severità${
          a.nazionalita?" · "+esc(a.nazionalita):""}</div>
      </div>
    </div>
  </div>

  <div class="dati">
    <div class="dato"><b>${n(a.mediaGialli)}</b><span>GIALLI MEDI</span></div>
    <div class="dato"><b>${n(a.mediaRossi)}</b><span>ROSSI MEDI</span></div>
    <div class="dato"><b class="n">${a.gialli}</b><span>GIALLI TOTALI</span></div>
    <div class="dato"><b class="n">${a.rossi}</b><span>ROSSI TOTALI</span></div>
  </div>

  <div class="conf">
    <span class="conf-lab">CARTELLINI PER PARTITA</span>
    <span class="conf-val">${n(a.mediaCartellini)}</span>
  </div>`;

  if(storico.length){
    h+=`<div class="titolo"><i></i><span>STAGIONE PER STAGIONE</span></div>
      <div class="titolo-sub">Andamento nel tempo</div>
      <table class="tab"><thead><tr>
        <th>Stagione</th><th>PG</th><th>CART</th><th>GIA</th><th>ROS</th>
      </tr></thead><tbody>`;
    storico.forEach(x=>{
      h+=`<tr>
        <td><span class="nome">${esc(x.stagione)}</span></td>
        <td>${n(x.partite)}</td>
        <td class="big">${n(x.mediaCartellini)}</td>
        <td class="gia">${n(x.mediaGialli)}</td>
        <td class="${x.rossi>0?"ros":""}">${n(x.rossi)}</td>
      </tr>`;
    });
    h+=`</tbody></table>`;
  } else {
    h+=`<div class="empty" style="margin-top:16px">
      <div style="font-size:10px;color:${MUTED};line-height:1.8">
        Nessun dettaglio per stagione.<br>
        Si ottiene indicando le stagioni nella variabile STAGIONI_ALEAGUE.</div></div>`;
  }

  if(D.attribuzione){
    h += `<div class="avviso-fonte">${esc(D.attribuzione)}</div>`;
  }
  return h;
}

/* ================= CALENDARIO ================= */

function caricaCalendario(){
  if(calendario) return Promise.resolve(calendario);
  return scaricaDati("calendario.dat", true)
    .then(d=>{ calendario=d; return d; });
}

function quandoEsteso(iso, ora){
  if(!iso) return "";
  const d=new Date(iso+"T12:00:00");
  if(isNaN(d.getTime())) return esc(iso);
  const g=d.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"});
  return ora ? `${g} · ore ${esc(ora)}` : g;
}

/* Quanto manca alla partita, in forma leggibile */
function traQuanto(iso){
  if(!iso) return "";
  const d=new Date(iso+"T12:00:00");
  if(isNaN(d.getTime())) return "";
  const oggi=new Date(); oggi.setHours(12,0,0,0);
  const gg=Math.round((d-oggi)/86400000);
  if(gg<=0) return "oggi";
  if(gg===1) return "domani";
  if(gg<7) return "fra "+gg+" giorni";
  return "";
}

function vCalendario(){
  if(!calendario){
    caricaCalendario().then(()=>render()).catch(()=>{
      const a=document.getElementById("app"); a.className="";
      a.innerHTML=`<div class="empty">
        <div style="font-size:26px;margin-bottom:10px">⚑</div>
        <div class="nome" style="font-size:20px;margin-bottom:10px">CALENDARIO NON DISPONIBILE</div>
        <div style="font-size:10px;color:${MUTED};line-height:1.9">
          Manca il file <code>docs/calendario.dat</code>.<br>
          Lancia il workflow "Aggiorna calendario" dal tab Actions.</div></div>`;
    });
    return `<div class="loading">Caricamento calendario…</div>`;
  }

  const C = (calendario.campionati||{})[legaAttiva];
  const gare = (C && C.partite) || [];

  let h = `<div class="sub" style="margin-top:0">
    Prossime partite${calendario.fusoOrario?" · orari in "+esc(calendario.fusoOrario):""}
    <br>fonte ${esc(calendario.fonte||"")}</div>`;

  if(!gare.length){
    return h + `<div class="empty" style="margin-top:16px">
      <div style="font-size:10px;color:${MUTED};line-height:1.8">
        Nessuna partita in programma nei prossimi
        ${calendario.giorniAvanti||45} giorni.<br>
        Il file viene aggiornato ogni giorno.</div></div>`;
  }

  // raggruppa per giorno, così le partite dello stesso turno stanno insieme
  const perGiorno = [];
  gare.forEach(g=>{
    const ultimo = perGiorno[perGiorno.length-1];
    if(ultimo && ultimo.data===g.data) ultimo.gare.push(g);
    else perGiorno.push({data:g.data, gare:[g]});
  });

  h += `<div class="titolo"><i></i><span>PROSSIME PARTITE</span></div>
        <div class="titolo-sub">${gare.length} gare · tocca un giorno per aprirlo</div>`;

  perGiorno.forEach((gruppo, i)=>{
    const chiave = "cal|" + gruppo.data;
    // Il primo giorno resta aperto: è quello che si guarda per primo.
    const aperto = settimaneAperte.has(chiave) || (i===0 && !settimaneAperte.size);
    const manca = traQuanto(gruppo.data);
    const conArbitro = gruppo.gare.filter(g=>g.arbitro).length;

    h += `<button class="gruppo${aperto?" on":""}" onclick="apriGruppo('${esc(chiave)}')">
      <span class="gruppo-tit">${esc(quandoEsteso(gruppo.data,null)).toUpperCase()}</span>
      <span class="gruppo-sub">${gruppo.gare.length} gare${
        manca?" · "+esc(manca):""}${conArbitro?` · ${conArbitro} con arbitro`:""}</span>
      <span class="gruppo-freccia">${aperto?"▴":"▾"}</span>
    </button>`;

    if(!aperto) return;

    h += `<div class="gruppo-corpo grid">`;
    gruppo.gare.forEach(g=>{
      h += `<div class="gara">
        <div class="gara-squadre">
          <span>${esc(g.casa)}</span>
          <span class="vs">${g.ora?esc(g.ora):"VS"}</span>
          <span style="text-align:right">${esc(g.ospite)}</span>
        </div>
        ${g.arbitro?`<div class="gara-arb">arbitro: <span style="color:${FLUO}">${esc(g.arbitro)}</span>${
          g.var?` · VAR: ${esc(g.var)}`:""}</div>`:""}
      </div>`;
    });
    h += `</div>`;
  });
  return h;
}

/* Meteo pubblico di tutte le partite dei prossimi 7 giorni (21/11/2026): docs/meteo/partite.json, preparato da
   articoli.py meteo_partite con la regola d'impatto generica degli articoli (NWS e Open-Meteo). */
let METEO_P=null;
function meteoPartita(p){
  if(METEO_P===null){ METEO_P=false;
    scaricaDati("meteo/partite.json").then(x=>{ METEO_P=x||{}; render(); }).catch(()=>{ METEO_P={}; }); }
  const m=((METEO_P||{})[legaAttiva]||{})[`${p.stagione}|${p.settimana}|${p.casa}|${p.ospite}`];
  if(!m || m.campoNeutro) return "";
  if(m.coperto) return `<div class="gara-meteo">🏟️ Stadio coperto</div>`;
  if(m.tempC==null) return "";
  const ic=(m.pioggia||0)>=50?"🌧️":(m.tempC<=0)?"❄️":(m.raffKmh||0)>=35?"💨":(m.pioggia||0)>=25?"🌥️":"☀️";
  const imp={alto:" · impatto alto",medio:" · impatto medio"}[m.impatto]||"";
  return `<div class="gara-meteo${m.impatto==="alto"||m.impatto==="medio"?" "+m.impatto:""}" title="Previsione per l'ora del via (${esc(m.fonte||"")})">${ic} ${m.tempC}° · pioggia ${m.pioggia??"–"}%${m.raffKmh?` · raffiche ${m.raffKmh} km/h`:` · vento ${m.ventoKmh??"–"} km/h`}${imp}</div>`;
}
/* ================= PARTITE ================= */
function vPartite(){
  const P=D.ultimePartite||[];
  if(!P.length) return `<div class="sub" style="margin-top:0">Nessuna partita in archivio</div>`;

  const conScheda=new Set((D.arbitri||[]).map(a=>a.nome));

  let h=`<div class="sub" style="margin-top:0">Le più recenti registrate</div>
    <div class="titolo"><i></i><span>RISULTATI</span></div>
    <div class="titolo-sub">G = gialli casa-ospite · R = rossi totali · tocca l'arbitro per la scheda</div>
    <table class="tab"><thead><tr>
      <th>Partita</th><th>Ris</th><th>G</th><th>R</th><th>Arbitro</th>
    </tr></thead><tbody>`;

  P.forEach(p=>{
    const rt=(p.rossiCasa||0)+(p.rossiOspite||0);
    const arb=(p.arbitro||"").trim();
    let cella;
    if(!arb){
      cella=`<span style="font-size:12px;color:${MUTED}">—</span>`;
    } else if(conScheda.has(arb)){
      cella=`<span class="arb" style="font-size:12px;cursor:pointer"
        onclick="vaiArbitro('${esc(arb).replace(/'/g,"\\'")}')">${esc(arb)}</span>`;
    } else {
      // arbitro noto ma senza statistiche disciplinari: mostrato, non cliccabile
      cella=`<span style="font-size:12px;color:${MUTED}">${esc(arb)}</span>`;
    }
    h+=`<tr>
      <td style="line-height:1.5">
        <span style="font-size:10px">${esc(p.casa)} – ${esc(p.ospite)}</span>
        <span style="display:block;font-size:8px;color:${MUTED}">${esc(p.data)}</span>
      </td>
      <td style="color:${FLUO};font-weight:700">${n(p.gc,"?")}-${n(p.go,"?")}</td>
      <td class="gial">${n(p.gialliCasa,"–")}-${n(p.gialliOspite,"–")}</td>
      <td class="${rt>0?"ros":""}">${rt||"–"}</td>
      <td style="text-align:right">${cella}</td>
    </tr>`;
  });
  return h+`</tbody></table>`;
}
