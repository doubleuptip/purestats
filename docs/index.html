<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FootballStats</title>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --nero:#050706; --card:#0C110E; --card2:#111813;
    --fluo:#39FF14; --fluo-dim:#1FA30C; --bordo:#1C2A1F;
    --testo:#E8F5E6; --muted:#6B8470; --rosso:#FF2D2D; --giallo:#FFD400;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--nero);color:var(--testo);font-family:'JetBrains Mono',monospace;padding-bottom:50px}
  .teko{font-family:'Teko',sans-serif}

  header{position:sticky;top:0;z-index:20;background:rgba(5,7,6,.95);
    border-bottom:1px solid var(--bordo);backdrop-filter:blur(8px);padding:16px 16px 0}
  .logo{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--fluo);box-shadow:0 0 10px var(--fluo)}
  .logo span{font-family:'Teko',sans-serif;font-size:26px;letter-spacing:.06em;line-height:1}
  .logo b{color:var(--fluo);font-weight:inherit}

  nav{display:flex;gap:6px;flex-wrap:wrap}
  nav button{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;
    letter-spacing:.06em;color:var(--muted);background:transparent;
    border:1px solid var(--bordo);border-bottom:none;border-radius:5px 5px 0 0;
    padding:9px 14px;cursor:pointer}
  nav button.on{color:var(--nero);background:var(--fluo);border-color:var(--fluo)}

  .submenu{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:12px 0;
    border-top:1px solid var(--bordo);margin-top:-1px}
  .submenu button{text-align:left;font-size:11px;color:var(--testo);background:var(--card);
    border:1px solid var(--bordo);border-radius:5px;padding:9px 11px;cursor:pointer;
    font-family:'JetBrains Mono',monospace}
  .submenu button.on{color:var(--fluo);background:rgba(57,255,20,.08);border-color:var(--fluo)}
  .submenu small{display:block;font-size:9px;color:var(--muted);margin-top:2px}

  main{padding:22px 16px 0}
  h1{font-family:'Teko',sans-serif;font-size:38px;line-height:1;letter-spacing:.02em;font-weight:600}
  .sub{font-size:10px;color:var(--muted);margin-top:6px}

  .titolo{display:flex;align-items:center;gap:8px;margin:26px 0 6px}
  .titolo i{width:3px;height:18px;background:var(--fluo);box-shadow:0 0 8px var(--fluo)}
  .titolo span{font-family:'Teko',sans-serif;font-size:24px;letter-spacing:.03em;line-height:1}
  .titolo-sub{font-size:10px;color:var(--muted);margin:0 0 14px 11px}

  .card{background:var(--card);border:1px solid var(--bordo);border-radius:8px;padding:13px 15px}
  .grid{display:grid;gap:8px}

  .match{display:flex;align-items:center;justify-content:space-between}
  .match .t{font-family:'Teko',sans-serif;font-size:21px;flex:1;letter-spacing:.02em}
  .match .t.r{text-align:right}
  .score{font-size:17px;font-weight:700;color:var(--fluo);padding:2px 11px;
    background:rgba(57,255,20,.07);border-radius:4px;letter-spacing:.05em}

  .pill{font-size:9px;font-weight:700;letter-spacing:.1em;padding:3px 7px;
    border-radius:3px;text-transform:uppercase;display:inline-block}
  .pill.g{color:var(--giallo);background:rgba(255,212,0,.09);border:1px solid rgba(255,212,0,.27)}
  .pill.r{color:var(--rosso);background:rgba(255,45,45,.09);border:1px solid rgba(255,45,45,.27)}
  .pill.f{color:var(--fluo);background:rgba(57,255,20,.09);border:1px solid rgba(57,255,20,.27)}
  .pill.m{color:var(--muted);background:rgba(107,132,112,.09);border:1px solid rgba(107,132,112,.27)}

  .toggle{width:100%;margin-top:10px;font-family:'JetBrains Mono',monospace;font-size:10px;
    color:var(--fluo);background:transparent;border:1px solid var(--bordo);
    border-radius:4px;padding:6px;cursor:pointer;letter-spacing:.06em}
  .dett{margin-top:12px;padding-top:12px;border-top:1px solid var(--bordo)}

  .bar-row{margin-bottom:11px}
  .bar-lab{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
  .bar-lab .a{font-size:12px;color:var(--fluo);font-weight:700;min-width:34px}
  .bar-lab .n{font-size:9px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
  .bar-lab .b{font-size:12px;font-weight:700;min-width:34px;text-align:right}
  .bar-track{display:flex;gap:3px;height:5px}
  .bar-track>div{flex:1;background:rgba(28,42,31,.5);border-radius:2px}
  .bar-track .lf{display:flex;justify-content:flex-end}
  .bar-track .lf i{background:var(--fluo);border-radius:2px;box-shadow:0 0 6px rgba(57,255,20,.5);display:block;height:100%}
  .bar-track .rt i{background:var(--muted);border-radius:2px;display:block;height:100%}

  .prob{display:flex;height:3px;margin-top:8px;border-radius:2px;overflow:hidden;background:var(--bordo)}
  .prob i{display:block;height:100%}

  .chart-box{background:var(--card);border:1px solid var(--bordo);border-radius:8px;
    padding:16px 12px 12px;margin-bottom:22px}
  .chart-box canvas{max-height:220px}

  .empty{background:var(--card);border:1px solid rgba(57,255,20,.2);border-radius:8px;
    padding:30px 20px;text-align:center}
  .empty .ico{width:44px;height:44px;margin:0 auto 14px;border-radius:50%;
    border:2px solid var(--fluo);display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 16px rgba(57,255,20,.27);font-size:20px}

  footer{text-align:center;font-size:8px;color:var(--muted);margin:30px 16px 0;
    padding-top:16px;border-top:1px solid var(--bordo);line-height:1.8}
  .hidden{display:none}
  .loading{text-align:center;padding:60px 20px;color:var(--muted);font-size:11px}
</style>
</head>
<body>

<header>
  <div class="logo"><div class="dot"></div><span>FOOTBALL<b>STATS</b></span></div>
  <nav>
    <button id="nav-camp" class="on" onclick="vaiA('campionati')">CAMPIONATI ▾</button>
    <button id="nav-cart" onclick="vaiA('cartellini')">CARTELLINI</button>
    <button id="nav-arb"  onclick="vaiA('arbitri')">ARBITRI</button>
  </nav>
  <div id="submenu" class="submenu hidden"></div>
</header>

<main>
  <div id="contenuto" class="loading">Caricamento dati…</div>
</main>

<footer id="footer"></footer>

<script>
const FLUO="#39FF14", FLUO_DIM="#1FA30C", GIALLO="#FFD400", ROSSO="#FF2D2D",
      MUTED="#6B8470", BORDO="#1C2A1F", TESTO="#E8F5E6", NERO="#050706";

let DATI=null, vista="campionati", lega=null, menuAperto=false;
let charts=[];

const esc = s => String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const oraIt = iso => iso ? new Date(iso).toLocaleString("it-IT",
  {weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}) : "";

function distruggiCharts(){ charts.forEach(c=>c.destroy()); charts=[]; }

/* ---------- caricamento ---------- */
fetch("data.json?t=" + Date.now())
  .then(r => { if(!r.ok) throw new Error("data.json non trovato"); return r.json(); })
  .then(d => {
    DATI = d;
    const chiavi = Object.keys(d.campionati || {});
    lega = chiavi[0] || null;
    render();
  })
  .catch(e => {
    document.getElementById("contenuto").innerHTML =
      `<div class="empty">
         <div class="ico">⚠</div>
         <div class="teko" style="font-size:24px;margin-bottom:8px">DATI NON DISPONIBILI</div>
         <div style="font-size:10px;color:${MUTED};line-height:1.7">
           ${esc(e.message)}<br><br>
           Esegui il workflow "Aggiorna dati calcio" dal tab Actions del repository.
         </div>
       </div>`;
  });

/* ---------- navigazione ---------- */
function vaiA(v){
  if(v==="campionati" && vista==="campionati"){ menuAperto=!menuAperto; }
  else { menuAperto = (v==="campionati"); }
  vista = v;
  render();
}
function scegliLega(k){ lega=k; menuAperto=false; render(); }

/* ---------- rendering ---------- */
function render(){
  distruggiCharts();

  document.getElementById("nav-camp").className = vista==="campionati" ? "on":"";
  document.getElementById("nav-cart").className = vista==="cartellini" ? "on":"";
  document.getElementById("nav-arb").className  = vista==="arbitri"    ? "on":"";
  document.getElementById("nav-camp").textContent = "CAMPIONATI " + (menuAperto?"▴":"▾");

  const sm = document.getElementById("submenu");
  if(menuAperto && DATI){
    sm.className="submenu";
    sm.innerHTML = Object.entries(DATI.campionati).map(([k,c])=>`
      <button class="${k===lega?'on':''}" onclick="scegliLega('${k}')">
        <b>${esc(c.nome)}</b><small>${esc(c.paese)}${c.errore?" · non disponibile":""}</small>
      </button>`).join("");
  } else sm.className="submenu hidden";

  const el = document.getElementById("contenuto");
  el.className="";
  if(vista==="campionati") el.innerHTML = vistaCampionati();
  if(vista==="cartellini") el.innerHTML = vistaCartellini();
  if(vista==="arbitri")    el.innerHTML = vistaArbitri();

  const agg = DATI ? new Date(DATI.aggiornato).toLocaleString("it-IT") : "";
  document.getElementById("footer").innerHTML =
    `Fonte: ${esc(DATI?.fonte||"")}<br>Ultimo aggiornamento: ${esc(agg)} · ${DATI?.chiamateUsate??0} chiamate API`;

  if(vista==="campionati") disegnaGraficiCampionato();
  if(vista==="cartellini") disegnaGraficiCartellini();
}

function barra(nome,a,b,max,suf=""){
  const pa=Math.max(2,(a/max)*100), pb=Math.max(2,(b/max)*100);
  return `<div class="bar-row">
    <div class="bar-lab"><span class="a">${a}${suf}</span><span class="n">${nome}</span><span class="b">${b}${suf}</span></div>
    <div class="bar-track"><div class="lf"><i style="width:${pa}%"></i></div><div class="rt"><i style="width:${pb}%"></i></div></div>
  </div>`;
}

function vistaCampionati(){
  if(!DATI) return "";
  const L = DATI.campionati[lega];
  if(!L) return `<div class="empty">Campionato non disponibile</div>`;

  let h = `<h1>${esc(L.nome)}</h1><div class="sub">Stagione ${esc(L.stagione)} · ${esc(L.paese)}</div>`;

  if(L.errore){
    h += `<div class="empty" style="margin-top:20px">
      <div class="ico">⚠</div>
      <div class="teko" style="font-size:22px;margin-bottom:8px">DATI NON DISPONIBILI</div>
      <div style="font-size:10px;color:${MUTED};line-height:1.7">
        Il piano gratuito potrebbe non coprire questa stagione.
      </div></div>`;
    return h;
  }

  const conStats = (L.concluse||[]).filter(m=>m.stats);
  if(conStats.length){
    h += `<div class="chart-box"><canvas id="chPoss"></canvas></div>`;
    h += `<div class="chart-box"><canvas id="chTiri"></canvas></div>`;
  }

  if((L.concluse||[]).length){
    h += `<div class="titolo"><i></i><span>RISULTATI</span></div>`;
    h += `<div class="titolo-sub">Tocca per le statistiche complete</div><div class="grid">`;
    L.concluse.forEach((m,i)=>{
      const c = m.cartellini||[];
      const gialli = c.filter(x=>x.tipo==="giallo").length;
      const rossi  = c.filter(x=>x.tipo==="rosso").length;
      h += `<div class="card">
        <div class="match">
          <span class="t">${esc(m.casa)}</span>
          <span class="score">${m.gc}–${m.go}</span>
          <span class="t r">${esc(m.ospite)}</span>
        </div>
        <div style="font-size:9px;color:${MUTED};text-align:center;margin-top:6px">
          ${esc(oraIt(m.data))}${m.arbitro?" · arb. "+esc(m.arbitro):""}
        </div>`;
      if(gialli||rossi){
        h += `<div style="display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap">
          ${gialli?`<span class="pill g">${gialli} gialli</span>`:""}
          ${rossi?`<span class="pill r">${rossi} rossi</span>`:""}</div>`;
      }
      if(m.stats){
        h += `<button class="toggle" onclick="apri(${i})">▼ STATISTICHE</button>
              <div class="dett hidden" id="d${i}">
                ${barra("Possesso",m.stats.casa.poss,m.stats.osp.poss,100,"%")}
                ${barra("Tiri",m.stats.casa.tiri,m.stats.osp.tiri,25)}
                ${barra("In porta",m.stats.casa.porta,m.stats.osp.porta,12)}
                ${barra("Corner",m.stats.casa.corner,m.stats.osp.corner,14)}
                ${barra("Falli",m.stats.casa.falli,m.stats.osp.falli,25)}
                ${barra("Gialli",m.stats.casa.gialli,m.stats.osp.gialli,6)}
                ${barra("Fuorigioco",m.stats.casa.fuori,m.stats.osp.fuori,10)}`;
        if(c.length){
          h += `<div style="margin-top:12px;padding-top:10px;border-top:1px solid ${BORDO}">
            <div style="font-size:9px;color:${MUTED};letter-spacing:.08em;margin-bottom:7px">CARTELLINI</div>`;
          c.forEach(x=>{
            h += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:10px">
              <span style="color:${x.tipo==="rosso"?ROSSO:GIALLO};font-weight:700;min-width:26px">${x.minuto??"?"}'</span>
              <span style="width:8px;height:11px;border-radius:1px;background:${x.tipo==="rosso"?ROSSO:GIALLO};flex-shrink:0"></span>
              <span>${esc(x.giocatore||"—")}</span>
              <span style="color:${MUTED};margin-left:auto;font-size:9px">${esc(x.squadra||"")}</span>
            </div>`;
          });
          h += `</div>`;
        }
        h += `</div>`;
      }
      h += `</div>`;
    });
    h += `</div>`;
  }

  if((L.inCorso||[]).length){
    h += `<div class="titolo"><i></i><span>IN CORSO</span></div><div class="grid">`;
    L.inCorso.forEach(m=>{
      h += `<div class="card" style="border-color:rgba(57,255,20,.27)">
        <div class="match">
          <span class="t">${esc(m.casa)}</span>
          <span class="score">${m.gc}–${m.go}</span>
          <span class="t r">${esc(m.ospite)}</span>
        </div>
        <div style="text-align:center;margin-top:6px"><span class="pill f">● ${m.minuto??""}'</span></div>
      </div>`;
    });
    h += `</div>`;
  }

  if((L.prossime||[]).length){
    h += `<div class="titolo"><i></i><span>PROSSIME PARTITE</span></div><div class="grid">`;
    L.prossime.forEach(m=>{
      h += `<div class="card" style="padding:10px 13px">
        <div class="match">
          <span class="t" style="font-size:17px">${esc(m.casa)}</span>
          <span style="font-size:9px;color:${MUTED};padding:0 8px">VS</span>
          <span class="t r" style="font-size:17px">${esc(m.ospite)}</span>
        </div>
        <div style="font-size:9px;color:${MUTED};text-align:center;margin-top:5px">${esc(oraIt(m.data))}</div>
      </div>`;
    });
    h += `</div>`;
  }
  return h;
}

function apri(i){
  const d=document.getElementById("d"+i);
  if(d) d.className = d.className.includes("hidden") ? "dett" : "dett hidden";
}

function opzioniChart(titolo){
  return {
    responsive:true, maintainAspectRatio:false,
    plugins:{
      title:{display:true,text:titolo,color:TESTO,font:{family:"Teko",size:18},padding:{bottom:12}},
      legend:{labels:{color:MUTED,font:{family:"JetBrains Mono",size:10},boxWidth:10}},
      tooltip:{backgroundColor:NERO,borderColor:FLUO,borderWidth:1,titleColor:TESTO,
        bodyColor:TESTO,titleFont:{family:"JetBrains Mono",size:11},bodyFont:{family:"JetBrains Mono",size:11}}
    },
    scales:{
      x:{ticks:{color:MUTED,font:{family:"JetBrains Mono",size:9}},grid:{color:BORDO}},
      y:{ticks:{color:MUTED,font:{family:"JetBrains Mono",size:9}},grid:{color:BORDO}}
    }
  };
}

function disegnaGraficiCampionato(){
  if(!DATI) return;
  const L = DATI.campionati[lega];
  if(!L || L.errore) return;
  const conStats = (L.concluse||[]).filter(m=>m.stats);
  if(!conStats.length) return;

  const cp=document.getElementById("chPoss");
  if(cp) charts.push(new Chart(cp,{
    type:"bar",
    data:{
      labels:conStats.map(m=>`${m.casa.slice(0,8)}–${m.ospite.slice(0,8)}`),
      datasets:[
        {label:"Casa",  data:conStats.map(m=>m.stats.casa.poss), backgroundColor:FLUO},
        {label:"Ospite",data:conStats.map(m=>m.stats.osp.poss),  backgroundColor:FLUO_DIM}
      ]
    },
    options:opzioniChart("POSSESSO PALLA (%)")
  }));

  const ct=document.getElementById("chTiri");
  if(ct){
    const et=[];
    conStats.forEach(m=>{
      et.push({n:m.casa,t:m.stats.casa.tiri,p:m.stats.casa.porta});
      et.push({n:m.ospite,t:m.stats.osp.tiri,p:m.stats.osp.porta});
    });
    charts.push(new Chart(ct,{
      type:"bar",
      data:{
        labels:et.map(x=>x.n.slice(0,10)),
        datasets:[
          {label:"Tiri totali",data:et.map(x=>x.t),backgroundColor:FLUO_DIM},
          {label:"In porta",   data:et.map(x=>x.p),backgroundColor:FLUO}
        ]
      },
      options:opzioniChart("TIRI")
    }));
  }
}

/* ---------- cartellini ---------- */
function aggregaCartellini(){
  const perSquadra={}, perGiocatore={};
  Object.values(DATI.campionati||{}).forEach(L=>{
    (L.concluse||[]).forEach(m=>{
      (m.cartellini||[]).forEach(c=>{
        const s=c.squadra||"—";
        perSquadra[s] = perSquadra[s] || {squadra:s,gialli:0,rossi:0};
        perGiocatore[c.giocatore||"—"] = perGiocatore[c.giocatore||"—"] ||
          {giocatore:c.giocatore||"—",squadra:s,gialli:0,rossi:0};
        if(c.tipo==="rosso"){ perSquadra[s].rossi++; perGiocatore[c.giocatore||"—"].rossi++; }
        else { perSquadra[s].gialli++; perGiocatore[c.giocatore||"—"].gialli++; }
      });
      if(m.stats){
        [[m.casa,m.stats.casa],[m.ospite,m.stats.osp]].forEach(([n,s])=>{
          perSquadra[n]=perSquadra[n]||{squadra:n,gialli:0,rossi:0};
          perSquadra[n].falli=(perSquadra[n].falli||0)+(s.falli||0);
        });
      }
    });
  });
  const peso = x => x.gialli*1 + x.rossi*3;
  return {
    squadre: Object.values(perSquadra).sort((a,b)=>peso(b)-peso(a)),
    giocatori: Object.values(perGiocatore).sort((a,b)=>peso(b)-peso(a))
  };
}

function vistaCartellini(){
  if(!DATI) return "";
  const {squadre,giocatori}=aggregaCartellini();

  let h = `<h1>Cartellini</h1><div class="sub">Ammonizioni ed espulsioni · tutti i campionati</div>`;

  if(!squadre.length){
    return h + `<div class="empty" style="margin-top:20px">
      <div class="ico">⚑</div>
      <div class="teko" style="font-size:22px;margin-bottom:8px">NESSUN DATO</div>
      <div style="font-size:10px;color:${MUTED};line-height:1.7">
        Nessuna partita conclusa con dettagli disponibili.
      </div></div>`;
  }

  h += `<div class="chart-box"><canvas id="chCart"></canvas></div>`;
  if(giocatori.length) h += `<div class="chart-box"><canvas id="chGioc"></canvas></div>`;

  h += `<div class="titolo"><i></i><span>PER SQUADRA</span></div><div class="grid">`;
  squadre.forEach(s=>{
    h += `<div class="card" style="display:flex;align-items:center;justify-content:space-between;padding:10px 13px;
        ${s.rossi?`border-color:rgba(255,45,45,.33)`:""}">
      <span class="teko" style="font-size:18px">${esc(s.squadra)}</span>
      <span style="display:flex;gap:5px">
        ${s.gialli?`<span class="pill g">${s.gialli}G</span>`:""}
        ${s.rossi?`<span class="pill r">${s.rossi}R</span>`:""}
        ${s.falli?`<span class="pill m">${s.falli} falli</span>`:""}
      </span></div>`;
  });
  h += `</div>`;

  if(giocatori.length){
    h += `<div class="titolo"><i></i><span>PER GIOCATORE</span></div><div class="grid">`;
    giocatori.forEach(g=>{
      h += `<div class="card" style="display:flex;align-items:center;justify-content:space-between;padding:10px 13px">
        <span>
          <span style="font-size:11px">${esc(g.giocatore)}</span>
          <span style="display:block;font-size:9px;color:${MUTED}">${esc(g.squadra)}</span>
        </span>
        <span style="display:flex;gap:5px">
          ${g.gialli?`<span class="pill g">${g.gialli}G</span>`:""}
          ${g.rossi?`<span class="pill r">${g.rossi}R</span>`:""}
        </span></div>`;
    });
    h += `</div>`;
  }
  return h;
}

function disegnaGraficiCartellini(){
  if(!DATI) return;
  const {squadre,giocatori}=aggregaCartellini();

  const c1=document.getElementById("chCart");
  if(c1 && squadre.length){
    const top=squadre.slice(0,12);
    const o=opzioniChart("CARTELLINI PER SQUADRA");
    o.indexAxis="y";
    o.scales.x.stacked=true; o.scales.y.stacked=true;
    charts.push(new Chart(c1,{
      type:"bar",
      data:{labels:top.map(s=>s.squadra),
        datasets:[
          {label:"Gialli",data:top.map(s=>s.gialli),backgroundColor:GIALLO},
          {label:"Rossi", data:top.map(s=>s.rossi), backgroundColor:ROSSO}
        ]},
      options:o
    }));
  }

  const c2=document.getElementById("chGioc");
  if(c2 && giocatori.length){
    const top=giocatori.slice(0,12);
    const o=opzioniChart("GIOCATORI PIÙ AMMONITI");
    o.indexAxis="y";
    o.scales.x.stacked=true; o.scales.y.stacked=true;
    charts.push(new Chart(c2,{
      type:"bar",
      data:{labels:top.map(g=>g.giocatore),
        datasets:[
          {label:"Gialli",data:top.map(g=>g.gialli),backgroundColor:GIALLO},
          {label:"Rossi", data:top.map(g=>g.rossi), backgroundColor:ROSSO}
        ]},
      options:o
    }));
  }
}

/* ---------- arbitri ---------- */
function aggregaArbitri(){
  const m={};
  Object.values(DATI.campionati||{}).forEach(L=>{
    (L.concluse||[]).forEach(p=>{
      if(!p.arbitro) return;
      const nome=p.arbitro.split(",")[0].trim();
      m[nome]=m[nome]||{nome,partite:0,gialli:0,rossi:0,falli:0,conDettagli:0};
      m[nome].partite++;
      (p.cartellini||[]).forEach(c=>{
        if(c.tipo==="rosso") m[nome].rossi++; else m[nome].gialli++;
      });
      if(p.stats){
        m[nome].falli += (p.stats.casa.falli||0)+(p.stats.osp.falli||0);
        m[nome].conDettagli++;
      }
    });
  });
  return Object.values(m).map(a=>({
    ...a,
    mediaCartellini: a.conDettagli ? ((a.gialli+a.rossi)/a.conDettagli).toFixed(1) : null,
    mediaFalli: a.conDettagli ? (a.falli/a.conDettagli).toFixed(1) : null
  })).sort((a,b)=>b.partite-a.partite || (b.gialli+b.rossi)-(a.gialli+a.rossi));
}

function vistaArbitri(){
  if(!DATI) return "";
  const arbitri=aggregaArbitri();

  let h = `<h1>Arbitri</h1><div class="sub">Statistiche direzione di gara</div>`;

  if(!arbitri.length){
    return h + `<div class="empty" style="margin-top:20px">
      <div class="ico">⚑</div>
      <div class="teko" style="font-size:22px;margin-bottom:8px">NESSUN ARBITRO RILEVATO</div>
      <div style="font-size:10px;color:${MUTED};line-height:1.7">
        Il campo arbitro non è ancora presente nei dati scaricati.<br>
        Si popola con le prossime partite concluse.
      </div></div>`;
  }

  h += `<div class="chart-box"><canvas id="chArb"></canvas></div>`;
  h += `<div class="titolo"><i></i><span>ELENCO</span></div>
        <div class="titolo-sub">Le medie considerano solo le partite con statistiche complete</div><div class="grid">`;
  arbitri.forEach(a=>{
    h += `<div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <span class="teko" style="font-size:20px">${esc(a.nome)}</span>
        <span class="pill f">${a.partite} ${a.partite===1?"partita":"partite"}</span>
      </div>
      <div style="display:flex;gap:5px;margin-top:9px;flex-wrap:wrap">
        ${a.gialli?`<span class="pill g">${a.gialli} gialli</span>`:""}
        ${a.rossi?`<span class="pill r">${a.rossi} rossi</span>`:""}
        ${a.mediaCartellini?`<span class="pill m">${a.mediaCartellini} cart./partita</span>`:""}
        ${a.mediaFalli?`<span class="pill m">${a.mediaFalli} falli/partita</span>`:""}
      </div></div>`;
  });
  h += `</div>`;
  return h;
}

function disegnaGraficiArbitri(){
  const arbitri=aggregaArbitri();
  const c=document.getElementById("chArb");
  if(!c || !arbitri.length) return;
  const top=arbitri.filter(a=>a.conDettagli).slice(0,10);
  if(!top.length) return;
  const o=opzioniChart("MEDIA CARTELLINI PER PARTITA");
  o.indexAxis="y";
  charts.push(new Chart(c,{
    type:"bar",
    data:{labels:top.map(a=>a.nome),
      datasets:[{label:"Cartellini/partita",data:top.map(a=>parseFloat(a.mediaCartellini)),backgroundColor:FLUO}]},
    options:o
  }));
}

const _render=render;
render=function(){ _render(); if(vista==="arbitri") disegnaGraficiArbitri(); };
</script>
